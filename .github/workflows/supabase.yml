name: Datenbank

# Legt die Datenbankstruktur in Supabase an bzw. aktualisiert sie (supabase/migrations)
# und prüft danach die Zugriffsregeln (supabase/tests). Zugangsdaten nur aus den GitHub-Secrets.
on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  workflow_dispatch:

concurrency: { group: supabase, cancel-in-progress: false }

jobs:
  db:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Secrets vorhanden?
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            if [ -z "${!v}" ]; then echo "::error::GitHub-Secret $v fehlt"; exit 1; fi
          done
          if [ "$SUPABASE_PROJECT_REF" != "sraocwhvkisomjjoqznr" ]; then echo "::error::SUPABASE_PROJECT_REF passt nicht zur Projekt-URL"; exit 1; fi
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Mit dem Projekt verbinden
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"
      - name: Login einstellen
        # Adresse der App und keine Selbstregistrierung. Die E-Mail-Vorlage (Code statt Link) lässt Supabase im Free-Plan
        # erst mit eigenem E-Mail-Versand ändern (Roadmap M4.12) – supabase/auth/magic_link.html liegt dafür bereit.
        run: |
          body='{"site_url":"https://bqtmarcel.github.io/AOS/","uri_allow_list":"https://bqtmarcel.github.io/AOS/**","disable_signup":true,"external_email_enabled":true}'
          code=$(curl -s -o /tmp/auth.json -w '%{http_code}' -X PATCH "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d "$body")
          if [ "$code" != "200" ]; then echo "::error::Login-Einstellungen nicht gespeichert (HTTP $code)"; jq -r '.message? // empty' /tmp/auth.json; exit 1; fi
          jq '{site_url, uri_allow_list, disable_signup, external_email_enabled, smtp_host: (.smtp_host != null and .smtp_host != "")}' /tmp/auth.json
      - name: Datenbankstruktur aktualisieren
        run: supabase db push --remote --yes -p "$SUPABASE_DB_PASSWORD"
      - name: Zugriffsregeln prüfen
        run: supabase test db --remote --yes
