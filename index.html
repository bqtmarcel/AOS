<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=5">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=5">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AOS">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; manifest-src 'self'; worker-src 'self'; connect-src https://api.github.com https://world.openfoodfacts.org; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>AOS – Athlete Operating System</title>
<style>
:root{--mono: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14171b; --surface:#1c2026; --surface2:#252a31; --text:#e8eaed; --muted:#a2a9b3; --line:#323842;
    --accent:#5fbf8f; --accent-ink:#0d1a13; --accent-soft:#1f3a2d; --warn:#f0c060; --warn-soft:#3a3020;
    --bad:#f08a8a; --bad-soft:#3d2224; --info-soft:#1f2a3a; --info:#9cc0f0; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{-webkit-tap-highlight-color:transparent;line-height:1.5;-webkit-text-size-adjust:100%}

header.top{position:sticky;top:0;z-index:20}
.top-inner{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav.tabs button:hover{color:var(--text)}
main{max-width:980px;margin:0 auto;padding:18px 16px 96px}
p{margin:6px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.badge{display:inline-block;border-radius:99px;white-space:nowrap}
.badge.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}

.weekstrip{display:grid;grid-template-columns:repeat(7,1fr)}.weekstrip .day{text-align:center;font-size:.85rem}.weekstrip .day.today{border-color:var(--accent);background:var(--accent-soft)}.weekstrip .day[data-act]{cursor:pointer}
.chips5{display:flex;gap:6px}.chips5 .chip{flex:1;margin:3px 0}
.syncchip{font:inherit;font-size:.78rem;line-height:1.3;min-height:0;padding:3px 10px;border-radius:99px;white-space:nowrap}
.syncchip.warn{background:var(--warn-soft);color:var(--warn)}.syncchip.bad{background:var(--bad-soft);color:var(--bad)}.syncchip.info{background:var(--info-soft);color:var(--info)}
.cap{display:inline-flex;align-items:center;gap:6px;border-radius:99px}
.note{margin:10px 0}
.note.warn{border-color:var(--warn);background:var(--warn-soft)}
.note.bad{border-color:var(--bad);background:var(--bad-soft)}
.empty{padding:16px;text-align:left;margin:10px 0}
button,.btn{font:inherit;cursor:pointer}
button.link{border:0;background:none}

button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label{display:block}
input,select,textarea{font:inherit;font-size:16px;width:100%}
textarea{resize:vertical}
input[type=checkbox]{width:auto;min-height:auto;transform:scale(1.25);margin-right:8px}
.field{margin:8px 0;min-width:0}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px 12px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;vertical-align:top}

.table-wrap{overflow-x:auto}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day.unavail{background:repeating-linear-gradient(45deg,var(--surface2),var(--surface2) 6px,var(--surface) 6px,var(--surface) 12px)}
.day.today{border-color:var(--accent);border-width:2px}
.day h4{margin:0 0 6px;font-size:.85rem;display:flex;justify-content:space-between;gap:4px;flex-wrap:wrap}

button.chip{margin:3px 4px 3px 0}

button.chip[aria-pressed="true"] .muted{color:inherit}
@media (max-width:760px){
  .week{grid-template-columns:1fr}
  .day{min-height:auto}
  nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);margin:0;padding:4px 4px calc(4px + env(safe-area-inset-bottom));justify-content:space-around;flex-wrap:nowrap;z-index:30}

  .top-inner{padding:8px 12px;flex-wrap:nowrap}

  #topinfo{margin-left:auto}
  main{padding:14px max(12px,env(safe-area-inset-right)) calc(110px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
}

.ex-head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}

.setrow{display:grid;align-items:end}
pre.out{white-space:pre-wrap;font-family:var(--mono);font-size:.88rem;background:var(--surface2);border-radius:8px;padding:12px;border:1px solid var(--line);max-height:60vh;overflow:auto}
dialog{padding:0;max-width:720px;width:calc(100% - 24px);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
.dlg-head h2{margin:0}
.dlg-body{padding:12px 16px;max-height:75vh;overflow:auto}
.dlg-foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);z-index:100;font-size:.92rem;max-width:90vw}
.chart{display:block}
.chart text{fill:var(--muted);font-size:11px}
.chart .ln{fill:none}
.chart .goal{stroke-dasharray:5 4;stroke-width:1.5}
details summary{cursor:pointer;margin:6px 0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* ===== AOS Design: monochrom, dunkel, ruhig (inspiriert von Athletik-Apps im Schwarz-Weiß-Look) ===== */
:root, :root[data-x]{
  color-scheme: dark;
  --bg:#000; --surface:#0f0f10; --surface2:#18181a; --surface3:#222225;
  --text:#f4f4f5; --muted:#8b8b90; --faint:#7c7c82;
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
  --accent:#f4f4f5; --accent-ink:#000; --accent-soft:rgba(255,255,255,.08);
  --warn:#e3b45c; --warn-soft:rgba(227,180,92,.10); --bad:#FF8A1F; --bad-soft:rgba(255,138,31,.12);
  --info:#c9c9ce; --info-soft:rgba(255,255,255,.05);
  --radius:20px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Helvetica Neue",Arial,sans-serif;
}
body{color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
a{color:var(--text)}
::selection{background:#fff;color:#000}

/* Kopf */
  /* kein backdrop-filter: sonst hängt die fixe Navigation am Kopf statt am Bildschirmrand */
.top-inner{padding:12px 20px}
.brand{font-weight:700;font-size:.95rem}

#topinfo .small{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* Typografie */
main{padding-top:22px}
h1{line-height:1.1;margin:8px 0 22px}
h2{font-size:.72rem;font-weight:600;text-transform:uppercase;color:var(--muted);margin:30px 0 12px}
h3{font-size:.95rem;font-weight:600;letter-spacing:-.01em;margin:16px 0 6px}
.small{font-size:.84rem}
.muted{color:var(--muted)}
.eyebrow{font-size:.7rem;font-weight:600;text-transform:uppercase;color:var(--muted)}
strong{font-weight:600}

/* Flächen */
.section{padding:18px 18px;margin:12px 0}
.empty{border:1px dashed var(--line2);border-radius:var(--radius);color:var(--muted)}
.note{background:var(--surface2);border-left:2px solid var(--line2);border-radius:12px;padding:10px 14px;font-size:.88rem}
.note.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.note.bad{border-left-color:var(--bad);background:var(--bad-soft)}
hr{border:0;border-top:1px solid var(--line)}

/* Startkarte */
.hero{padding:22px 20px 20px}
.hero .hero-title{font-weight:600;margin:10px 0 4px}
.hero .hero-sub{color:var(--muted);font-size:.9rem}

/* Knöpfe */
button,.btn{font-weight:500;border-radius:999px;color:var(--text);padding:10px 18px;min-height:44px}
button:active{transform:scale(.98)}
button.primary{font-weight:600}
button.primary:hover{background:#fff}
button.block{display:block;width:100%}
button.danger{color:var(--bad)}
button.link{text-decoration:none;border-bottom:1px solid var(--line2);border-radius:0;padding:2px 0;margin:0 2px;min-height:auto}
button.small{padding:6px 14px;min-height:36px}
button.chip{border-radius:999px;border:1px solid var(--line2);min-height:40px;padding:7px 15px;font-size:.88rem}
button.chip[aria-pressed="true"]{font-weight:600}
.chips5 .chip{font-size:1.1rem;font-weight:600;min-height:52px;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* Felder */
label{font-size:.7rem;font-weight:600;text-transform:uppercase;color:var(--muted);margin:10px 0 6px}
input,select,textarea{border:1px solid var(--line2);border-radius:14px;color:var(--text);padding:11px 14px;min-height:48px;font-variant-numeric:tabular-nums}
input:focus,select:focus,textarea:focus{border-color:#f4f4f5;outline:none}
input::placeholder{color:var(--faint)}
select{-webkit-appearance:none;padding-right:36px}
details summary{color:var(--muted);font-size:.84rem;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:'+';display:inline-block;width:16px;color:var(--text)}
details[open]>summary::before{content:'–'}

/* Kennzeichen */
.badge{background:transparent;border:1px solid var(--line2);color:var(--muted);font-size:.64rem;font-weight:600;text-transform:uppercase;padding:3px 8px}
.badge.warn{color:var(--warn);border-color:rgba(227,180,92,.4)}
.badge.bad{color:var(--bad);border-color:rgba(255,138,31,.45);background:transparent}
.cap{background:transparent;border:1px solid var(--line2);color:var(--text);font-size:.68rem;text-transform:uppercase;font-weight:600;padding:4px 10px}

/* Wochenstreifen */
.weekstrip{gap:2px;margin:6px 0 4px}
.weekstrip .day{background:transparent;border:0;border-radius:14px;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:auto}
.weekstrip .day .wd{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.weekstrip .day .dn{font-size:1.05rem;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.weekstrip .day .tp{font-size:.7rem;font-weight:600;min-height:1em}
.weekstrip .day .tp.done{color:var(--muted)}
.weekstrip .day.today{background:var(--surface2);border:0}
.weekstrip .day.today .dn{color:#fff;font-weight:700}
.weekstrip .day.today .wd{color:var(--text)}

/* Kennzahlen */

/* Übungen und Sätze */
.ex{padding:14px 16px;margin:10px 0}
.ex-name{font-weight:600;letter-spacing:-.01em}
.plan-hint{color:var(--muted);font-size:.78rem}
.setrow{grid-template-columns:28px repeat(3,minmax(0,1fr));gap:8px;margin:6px 0}
.setrow .lbl{font-size:.9rem;font-weight:600;color:var(--faint);padding-bottom:15px;text-align:center;font-variant-numeric:tabular-nums}
.setrow label{margin:0 0 4px;text-align:center}
.setrow input{text-align:center;font-size:1.2rem;font-weight:500;min-height:52px}

/* Tabellen */
table{font-size:.9rem}
th{font-size:.66rem;text-transform:uppercase;color:var(--muted);font-weight:600}
th,td{border-bottom:1px solid var(--line);padding:9px 6px}

/* Dialog, Meldung */

dialog::backdrop{background:rgba(0,0,0,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.dlg-head,.dlg-foot{background:#111113;border-color:var(--line)}
.dlg-head h2{font-size:1.05rem;letter-spacing:-.01em;text-transform:none;color:var(--text)}
.toast{border-radius:999px;font-weight:500;padding:11px 20px;bottom:calc(104px + env(safe-area-inset-bottom))}
pre.out{background:#0a0a0b;border-color:var(--line)}

/* Diagramme */
.chart .ln{stroke-width:2}

.chart .gl{stroke:var(--line)}
.chart .goal{stroke:var(--muted)}

/* Navigation */
nav.tabs button{display:flex;gap:7px;color:var(--muted)}
nav.tabs button[aria-current="page"]{font-weight:600}
@media (max-width:760px){
  nav.tabs{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));padding:6px;border-radius:30px;background:rgba(20,20,22,.96);backdrop-filter:saturate(150%) blur(20px);-webkit-backdrop-filter:saturate(150%) blur(20px);border:1px solid var(--line2);gap:0}
  nav.tabs button{flex-direction:column;gap:3px;font-size:.6rem;letter-spacing:.02em;padding:7px 0 6px;min-height:52px;border-radius:22px;background:none}
  main{padding-bottom:calc(120px + env(safe-area-inset-bottom))}

}

/* ===== Variante B (Signal) mit Code-Schrift ===== */
:root{ --font:"SF Mono",ui-monospace,"JetBrains Mono","Roboto Mono",Menlo,Consolas,monospace; --sig:#F60100; --sig-deep:#BB271B; --sig-ink:#fff; --sig-soft:rgba(246,1,0,.12) }
body{letter-spacing:0;font-size:15px}
h1{font-size:1.6rem;letter-spacing:-.02em;font-weight:600}
h2,.eyebrow,label,th,.badge,.cap{letter-spacing:.08em}
main{counter-reset:sec}
main h2::before{counter-increment:sec;content:counter(sec,decimal-leading-zero) " / ";color:var(--faint)}
dialog h2::before{content:none}
.hero .hero-title{font-size:1.3rem;letter-spacing:-.01em;line-height:1.25}
.hero .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--sig);margin-right:8px;box-shadow:0 0 10px var(--sig);vertical-align:1px}
.ex-name{font-size:.95rem}
button,.btn{font-size:.88rem}
button.primary,button.primary:hover{background:var(--sig);border-color:var(--sig);color:var(--sig-ink)}
button.chip[aria-pressed="true"]{color:var(--sig-ink)}
input:focus,select:focus,textarea:focus{border-color:var(--sig)}
:focus-visible{outline-color:var(--sig)}
.weekstrip .day.today{background:transparent;box-shadow:inset 0 0 0 1px var(--sig)}
.weekstrip .day.today .dn{color:var(--sig)}
.weekstrip .day.today .wd{color:var(--text)}
.badge.ok{color:var(--text);border-color:rgba(246,1,0,.55)}
.chart .ln{stroke:var(--sig)} .chart .pt{fill:var(--sig)}
.chart .ln-raw{stroke:var(--muted);stroke-width:1;opacity:.5}.chart .pt-raw{fill:var(--muted)}.chart .ln-trend{stroke-width:2.5}

.sysbar{display:flex;gap:10px;font-size:.66rem;letter-spacing:.04em;color:var(--muted);white-space:nowrap}
.sysbar b{color:var(--text);font-weight:500}
.sysbar .sync-btn{background:none!important;border:0!important;box-shadow:none!important;padding:10px;margin:-10px;min-height:0;min-width:0;color:inherit}
.sysbar .sd.ok{color:var(--text)} .sysbar .sd.run{color:var(--text)} .sysbar .sd.err{color:var(--bad)} .sysbar .sd.off{color:var(--faint)}
nav.tabs button{font-size:.72rem;letter-spacing:.02em}

@media (max-width:760px){
  nav.tabs{padding:5px 6px;justify-content:space-evenly;gap:0}
  nav.tabs button{flex:0 0 auto;min-width:0;min-height:44px;font-size:clamp(8px,2.6vw,.6rem);letter-spacing:-.02em;padding:0 clamp(4px,1.8vw,8px);justify-content:center;border-radius:22px;white-space:nowrap}
  button.chip{padding:7px 12px}

  h1{font-size:1.5rem}
  .hero .hero-title{font-size:1.25rem}
}
/* Heute-Karte */
.today-card .hero-sub{margin-bottom:14px}
.tc-row{border-top:1px solid var(--line);padding:12px 0}
.tc-k{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase}
.tc-weight{display:flex;align-items:center;gap:12px}
.tc-weight .tc-k{width:72px;flex:none}
.tc-weight>span:nth-child(2){flex:1}
.tc-hints{border-top:1px solid var(--line);padding:10px 0 2px;font-size:.78rem;color:var(--muted);display:grid;gap:4px}
.tc-btn{margin-top:12px}
/* Navigation nur mit Icons */
nav.tabs button svg{height:22px;flex:none}
nav.tabs button svg .f{fill:currentColor;stroke:none}
nav.tabs button{justify-content:center;align-items:center}
nav.tabs button[aria-current="page"]{color:var(--sig-ink)}
@media (min-width:761px){ nav.tabs button{padding:8px 14px} }
@media (max-width:760px){
  nav.tabs{display:grid!important;grid-template-columns:repeat(6,1fr);padding:6px;gap:4px}
  nav.tabs button{width:auto;min-height:48px;padding:0;border-radius:24px;font-size:0}
  nav.tabs button svg{width:24px;height:24px}
}
/* Gestapelte Tabellen und Umbruch am Handy */
main{overflow-wrap:break-word}
main table:not(.stack){max-width:100%}
main table:not(.stack) td{overflow-wrap:anywhere}

@media (max-width:760px){
  .table-wrap{overflow:visible}
  table.stack,table.stack tbody,table.stack tr,table.stack td{display:block;width:100%}
  table.stack thead{display:none}
  table.stack tr{border-bottom:1px solid var(--line);padding:10px 0}
  table.stack td{border:0;padding:3px 0;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
  table.stack td::before{content:attr(data-label);flex:0 0 96px;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  table.stack td[data-label=""]::before{display:none}
  table.stack td.empty-cell{display:none}
  table.stack td>*{max-width:100%}
  .badge{white-space:normal}
  .row.between{flex-wrap:wrap;gap:4px 12px}
}
/* Open Food Facts */
.off-box{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.off-list{display:grid;gap:6px;margin-top:8px}
.off-item{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border-radius:14px;padding:10px 14px;width:100%}
.off-item .off-n{font-weight:600;font-size:.88rem}
.off-item .off-m{font-size:.72rem;color:var(--muted)}
.off-item.picked{border-color:var(--sig)}
.off-item.picked .off-n::after{content:' ✓';color:var(--sig)}
/* Menge wählen */
.sel-panel{border:1px solid var(--sig);border-radius:16px;padding:12px 14px;margin:6px 0 12px;background:var(--surface2)}
.sel-name{font-weight:600;margin-bottom:8px}
.sel-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.sel-row #fd-n{width:96px;flex:none;text-align:center;font-size:1.1rem}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg .chip{padding:6px 12px}
.nut-row{grid-template-columns:1fr 64px 76px auto!important;align-items:center}
.nut-row input,.nut-row select{min-height:42px;padding:6px 8px;font-size:.95rem}

.nut-row select{padding-right:24px;background-position:calc(100% - 14px) 50%,calc(100% - 9px) 50%}
.nut-u{font-size:.8rem;color:var(--muted);text-align:center}
/* Makro-Abdeckung */
.mbars{display:grid;gap:10px;margin:8px 0 6px}
.mb-row{display:grid;grid-template-columns:64px 1fr auto;grid-template-areas:"l v n" "b b b";gap:4px 10px;align-items:baseline}
.mbars.compact{grid-template-columns:1fr 1fr;gap:12px 18px}
.mbars.compact .mb-row{grid-template-columns:auto 1fr;grid-template-areas:"l l" "v v" "b b";gap:2px}
.mb-l{grid-area:l;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mb-v{grid-area:v;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.mb-v b{color:var(--text);font-weight:600;font-size:.95rem}
.mb-n{grid-area:n;font-size:.75rem;color:var(--muted);white-space:nowrap}
.mb-bar{grid-area:b;height:6px;border-radius:3px;overflow:hidden}
.mb-bar i{display:block;height:100%;border-radius:3px}
.mb-bar i{background:var(--sig-deep)!important} .mb-row.ok .mb-bar i{background:var(--sig)!important} .mb-row.ok .mb-n{color:var(--text)}
.mb-row.over .mb-bar i{background:var(--warn)} .mb-row.over .mb-n{color:var(--warn)}
.off-at{display:inline-block;font-size:.6rem;font-weight:700;letter-spacing:.08em;color:var(--sig-ink);background:var(--sig);border-radius:4px;padding:1px 5px;margin-right:6px;vertical-align:2px}
/* Trainingsorte */
.loc-card textarea{min-height:76px}
.loc-card .chip[data-act="locDay"]{padding:6px 0;width:calc((100% - 36px)/7);margin:0 6px 0 0;font-size:.8rem}
.loc-card .chip[data-act="locDay"]:last-child{margin-right:0}
.loc-sum{margin:6px 0 4px;color:var(--muted);border-left:2px solid var(--sig);padding-left:10px}
.chips10{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}

'use strict';
/* ===== AOS – Kern: Hilfsfunktionen, Datenmodell, Speicherung ===== */
const AOS_KEY = 'aos-data-v1';
const SCHEMA_VERSION = 3;
const SEED_TIME = '1970-01-01T00:00:00.000Z'; /* Ausgangsdaten gelten als "nie geändert" */
function slug(s){ return String(s).toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }
const WD = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const WD_LONG = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const STATUS_LABEL = {geplant:'geplant', absolviert:'absolviert', teilweise:'teilweise absolviert', ausgelassen:'ausgelassen'};

const FORM_LABEL = {1:'1 – sehr schlecht',2:'2 – eher schlecht',3:'3 – normal',4:'4 – gut',5:'5 – sehr gut'};

function uid(p){ return (p||'id') + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pad(n){ return String(n).padStart(2,'0'); }
function isoOf(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function todayISO(){ return isoOf(new Date()); }
function parseISO(s){ if(!s) return null; const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(iso,n){ const d=parseISO(iso); d.setDate(d.getDate()+n); return isoOf(d); }
function mondayOf(iso){ const d=parseISO(iso); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); return isoOf(d); }
function weekdayOf(iso){ return parseISO(iso).getDay(); }
function fmtDate(iso){ if(!iso) return '—'; const d=parseISO(iso); return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear(); }
function fmtDateShort(iso){ if(!iso) return '—'; const d=parseISO(iso); return WD[d.getDay()]+' '+pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'; }
function daysBetween(a,b){ return Math.round((parseISO(b)-parseISO(a))/86400000); }

const FRESH_TIME = '0000-01-01T00:00:00.000Z';
function freshData(){ const d=seedData(); syncStampAll(d, FRESH_TIME); return migrate(d); }   // migrate ergänzt u. a. die Standard-Trainingsorte

/* ---------- Speicher ---------- */
let S = null;
let storageOK = true;
function storageAvailable(){ try{ const k='__aos_t'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }catch(e){ return false; } }
function load(){
  storageOK = storageAvailable();
  let raw = null;
  if(storageOK){ try{ raw = localStorage.getItem(AOS_KEY); }catch(e){ raw=null; } }
  if(raw){
    try{ const d = JSON.parse(raw); const v = validateData(d); if(v.ok){ S = migrate(d); syncInit(); return; } console.warn('Ungültige gespeicherte Daten', v.errors); }
    catch(e){ console.warn('Gespeicherte Daten nicht lesbar', e); }
    // Defekte Daten nicht überschreiben: sichern
    try{ localStorage.setItem(AOS_KEY+'-defekt-'+Date.now(), raw); }catch(e){}
  }
  S = freshData();
  syncInit();
  save(true);
}
function save(silent){
  S.meta.updatedAt = new Date().toISOString();
  const changed = syncTrack();
  if(changed && typeof ghOnLocalChange==='function') ghOnLocalChange();
  if(!storageOK) return false;
  try{ localStorage.setItem(AOS_KEY, JSON.stringify(S)); return true; }
  catch(e){ storageOK=false; if(!silent) toast('Speichern auf dem Gerät fehlgeschlagen'+(ghReady()?' – der Abgleich mit GitHub läuft weiter.':' – bitte jetzt eine JSON-Sicherung exportieren.')); return false; }
}
function migrate(d){
  // Platz für künftige Schema-Änderungen; fehlende Bereiche ergänzen statt Daten zu verwerfen
  d.unavailable = d.unavailable || [];
  d.fieldLogs = Array.isArray(d.fieldLogs) ? d.fieldLogs : [];
  d.calendar = Array.isArray(d.calendar) ? d.calendar : [];   // Kalender: Spieltage (Kickoff) und wichtige Termine   // Feldtraining (Football, Team): ein Eintrag pro Tag
  d.suggestionDecisions = d.suggestionDecisions || {};
  if(!d.nutrition || !Array.isArray(d.nutrition.items)) d.nutrition = defaultNutrition();
  const n=d.nutrition; n.combos=n.combos||[]; n.meals=n.meals||[]; n.templates=Array.isArray(n.templates)?n.templates:[]; n.dayOverrides=n.dayOverrides||{}; n.constraints=n.constraints||''; n.guides=n.guides||defaultNutrition().guides;
  Object.keys(n.dayOverrides).forEach(k=>{ if(typeof n.dayOverrides[k]!=='object' || n.dayOverrides[k]===null) n.dayOverrides[k]={}; });   // alte Tagesarten (Text) → neues Format
  d.settings = d.settings || {};
  (d.tests||[]).forEach(t=>{ if(t.name==='High-Bar Squatü') t.name='High-Bar Squat'; });   // Tippfehler aus der Ersterfassung
  // Trainingsorte: Public Gym, Home Gym, Feld (Name frei, Ausstattung als Freitext, Standard-Wochentage)
  d.profile.locations = Array.isArray(d.profile.locations) ? d.profile.locations : [];
  const L=d.profile.locations, has=id=>L.some(l=>l.id===id);
  if(!has('loc-public')) L.push({ id:'loc-public', name:'Public Gym', note:'', source:'standard' });
  if(!has('loc-own')) L.push({ id:'loc-own', name:'Home Gym', note:'', source:'standard' });
  if(!has('loc-field')){ L.push({ id:'loc-field', name:'Feld', note:'', source:'standard' });
    const rank={ 'loc-public':0, 'loc-own':1, 'loc-field':2 }; L.sort((a,b)=>(rank[a.id]??9)-(rank[b.id]??9)); }
  L.forEach(l=>{ if(l.id==='loc-own' && l.name==='Eigenes Gym') l.name='Home Gym'; if(typeof l.text!=='string') l.text=''; if(!Array.isArray(l.days)) l.days=[]; });
  d.blocks = Array.isArray(d.blocks) ? d.blocks : [];   // nur noch leerer Platzhalter (W3), Pläne erzeugt der Sessionplaner
  if(!d.sync) syncMigrateLegacy(d);
  cleanupLegacy(d);
  d.schemaVersion = SCHEMA_VERSION;
  return d;
}
/* Altdaten der früheren, von Hand geführten Planverwaltung entfernen (Backlog W3). Entfernte Datensätze bekommen eine
   Löschmarke, damit sie beim Abgleich mit iPhone/Laptop/Datenrepo nicht zurückkommen. Idempotent. */
function cleanupLegacy(d){
  const sy=d.sync; if(!sy) return; sy.stamps=sy.stamps||{}; sy.tombstones=sy.tombstones||{}; const now=new Date().toISOString();
  const tomb=k=>{ sy.tombstones[k]=now; delete sy.stamps[k]; };
  (d.blocks||[]).forEach(b=>tomb('blocks:'+b.id)); d.blocks=[];                         // alte Blöcke, Trainingstage, Änderungsprotokoll
  (d.unavailable||[]).forEach(x=>tomb('unavail:'+x)); d.unavailable=[];                 // alte „nicht verfügbar“-Tage (ersetzt durch Tag frei im Plan)
  Object.keys(d.suggestionDecisions||{}).forEach(k=>{ if(/^(deload|plan)\|/.test(k)){ tomb('decision:'+k); delete d.suggestionDecisions[k]; } });
  // Profil: Altfelder still entfernen, ohne den Zeitstempel zu erneuern – sonst überschreibt beim Abgleich die
  // frisch bereinigte (ältere) Fassung aus dem Datenrepo neuere Eingaben dieses Geräts (z. B. Ausstattung der Orte)
  const p=d.profile||{};
  ['positionHistory','sex','age'].forEach(f=>{ if(f in p) delete p[f]; });
  // alte Ausstattungsliste wurde nie ausgewertet – maßgeblich ist der Freitext (eine positive Liste würde dort alles andere ausschließen)
  (p.locations||[]).forEach(l=>{ if('equipment' in l) delete l.equipment; });
}
function validateData(d){
  const errors=[];
  if(!d || typeof d!=='object') return {ok:false, errors:['Die Datei enthält kein JSON-Objekt.']};
  if(typeof d.schemaVersion!=='number') errors.push('Feld „schemaVersion“ fehlt – das ist vermutlich keine AOS-Sicherung.');
  else if(d.schemaVersion>SCHEMA_VERSION) errors.push('Die Sicherung stammt aus einer neueren AOS-Version ('+d.schemaVersion+').');
  if(!d.profile || typeof d.profile!=='object') errors.push('Bereich „profile“ fehlt.');
  else if(!Array.isArray(d.profile.positions)) errors.push('Positionsliste fehlt im Profil.');
  ['goals','tests','bodyweight','blocks','sessions'].forEach(k=>{ if(!Array.isArray(d[k])) errors.push('Bereich „'+k+'“ fehlt oder ist keine Liste.'); });
  if(Array.isArray(d.blocks)) d.blocks.forEach((b,i)=>{ if(!b||!b.id||!Array.isArray(b.days)) errors.push('Trainingsblock '+(i+1)+' ist unvollständig.'); });
  if(Array.isArray(d.sessions)) d.sessions.forEach((s,i)=>{ if(!s||!s.id||!STATUS_LABEL[s.status]) errors.push('Einheit '+(i+1)+' hat keinen gültigen Status.'); });
  return {ok: errors.length===0, errors};
}

/* ---------- Trainingsorte: Freitext → Regeln ----------
   Leer = keine Auswirkung. Genannte Geräte = am Ort vorhanden (andere Geräte dann nicht).

const LOC_EQ = {
  barbell:['langhantel','hantelstange','barbell','lh'], rack:['rack','power rack','squat rack','kniebeugenständer','ständer','käfig'],
  bench:['bank','flachbank','hantelbank','schrägbank'], dumbbell:['kurzhantel','dumbbell','kh'], kettlebell:['kettlebell','kb'],
  medball:['medizinball','medball','slamball'], trap_bar:['trap bar','trapbar','hex bar','hexbar'], ssb:['ssb','safety squat','safety bar'],
  landmine:['landmine'], cable:['kabelzug','kabel','seilzug','cable'], pull_up_bar:['klimmzug','pull-up','pullup'], dip_bars:['dipbarren','dip-barren','barren','dips'],
  box:['box','kasten','plyobox'], belt_squat:['belt squat','beltsquat'], leg_curl:['beinbeuger','leg curl'], lat_pulldown:['latzug','lat pulldown'],
  shoulder_press_machine:['schulterpresse'], adductor_machine:['adduktor'], back_extension_bench:['hyperextension','rückenstrecker','back extension'],
  band:['widerstandsband','bänder','band'], dip_belt:['dipgürtel','gewichtsgürtel'], plate:['hantelscheibe','scheiben'], cones:['hütchen','cones','pylonen'],
  field:['feld','rasen','kunstrasen','sprintstrecke','laufbahn'] };
const LOC_MOVE = {
  jump:{ label:'Sprünge', words:['sprung','sprünge','springen','jump','plyo','hüpf','hops'], test:e=>['jump','jump_loaded'].includes(e.pattern) },
  overhead:{ label:'Überkopf', words:['überkopf','ueberkopf','über kopf','overhead'], test:e=>e.pattern==='vertical_push' || e.id==='mb_slam' },
  sprint:{ label:'Sprints', words:['sprint','laufen','läufe'], test:e=>['sprint','cod'].includes(e.pattern) },
  throw:{ label:'Würfe', words:['wurf','würfe','werfen','throw','slam'], test:e=>e.pattern==='throw' },
  olympic:{ label:'Olympisches Heben', words:['olymp','umsetzen','clean','reißen','snatch'], test:e=>e.pattern==='olympic' } };
const LOC_ALWAYS = ['floor_space','wall','step','foot_anchor'];
const EQ_NAME = { barbell:'Langhantel', rack:'Rack', bench:'Bank', dumbbell:'Kurzhanteln', kettlebell:'Kettlebell', medball:'Medizinball', trap_bar:'Trap Bar', ssb:'SSB',
  landmine:'Landmine', cable:'Kabelzug', pull_up_bar:'Klimmzugstange', dip_bars:'Dip-Barren', box:'Box', belt_squat:'Belt Squat', leg_curl:'Beinbeuger-Maschine', lat_pulldown:'Latzug',
  shoulder_press_machine:'Schulterpresse', adductor_machine:'Adduktoren-Maschine', back_extension_bench:'Hyperextension', band:'Band', dip_belt:'Dipgürtel', plate:'Hantelscheiben', cones:'Hütchen', field:'Feld/Rasen' };
function locWordPos(clause, w){ const src = w.length<=3 ? '(^|[^a-zäöüß])'+w+'(?=$|[^a-zäöüß])' : '(^|[^a-zäöüß])'+w.replace(/[-\s]/g,'[-\\s]?');
  const m=new RegExp(src).exec(clause); return m ? m.index+m[1].length : -1; }
function locParse(text){
  const r={ empty:true, have:[], noEq:[], noMove:[] }; const t=String(text||'').toLowerCase().trim(); if(!t) return r; r.empty=false;
  // Satzteile; ein „kein/keine/ohne/nicht …“ gilt für alles danach im selben Satzteil („keine Sprünge oder Überkopf“)
  t.split(/[,;\n.\/+]|\s[–-]\s|\bund\b|\bsowie\b/).forEach(raw=>{ const c=' '+raw.trim()+' '; if(!raw.trim()) return;
    const nm=/(^|[^a-zäöüß])(kein|keine|keinen|keiner|ohne|nicht|kaum)(?=[^a-zäöüß]|$)/.exec(c); const negAt=nm?nm.index:-1;
    const isNeg=pos=> negAt>=0 && (pos>negAt || /\b(nicht|geht nicht|nicht möglich)\b/.test(c.slice(pos)));
    Object.entries(LOC_MOVE).forEach(([k,m])=>{ const ps=m.words.map(w=>locWordPos(c,w)).filter(x=>x>=0); if(ps.length && isNeg(Math.min(...ps))) r.noMove.push(k); });
    Object.entries(LOC_EQ).forEach(([k,ws])=>{ const ps=ws.map(w=>locWordPos(c,w)).filter(x=>x>=0); if(ps.length) (isNeg(Math.min(...ps))?r.noEq:r.have).push(k); }); });
  r.noMove=[...new Set(r.noMove)]; r.noEq=[...new Set(r.noEq)]; r.have=[...new Set(r.have)].filter(k=>!r.noEq.includes(k));
  return r; }
function locSummary(l){ const r=locParse(l.text); if(r.empty) return 'Leer – keine Einschränkung, alle Übungen möglich.';
  const out=[]; if(r.have.length) out.push('vorhanden: '+r.have.map(k=>EQ_NAME[k]).join(', ')+' (andere Geräte werden hier nicht geplant)');
  if(r.noEq.length) out.push('nicht vorhanden: '+r.noEq.map(k=>EQ_NAME[k]).join(', '));
  if(r.noMove.length) out.push('nicht möglich: '+r.noMove.map(k=>LOC_MOVE[k].label).join(', '));
  return out.length ? out.join(' · ') : 'Nichts erkannt – Text hat keine Auswirkung. Nenne Geräte (z. B. Langhantel, Rack, Kurzhanteln) oder „keine Sprünge“.'; }
/* Warum ist Übung e am Ort nicht möglich? null = möglich */
function locBlocks(e, r){ if(!r || r.empty) return null;
  for(const k of r.noMove) if(LOC_MOVE[k].test(e)) return LOC_MOVE[k].label+' nicht möglich';
  const eq=e.equipment||[]; const bad=eq.filter(q=>r.noEq.includes(q)); if(bad.length) return bad.map(q=>EQ_NAME[q]||q).join(', ')+' nicht vorhanden';
  if(r.have.length){ const ok=new Set(r.have.concat(LOC_ALWAYS)); if(r.have.includes('barbell')) ok.add('plate');
    const miss=eq.filter(q=>!ok.has(q)); if(miss.length) return miss.map(q=>EQ_NAME[q]||q).join(', ')+' nicht vorhanden'; }
  return null; }

/* Plan-Vorgabe einer Übung als kompakter Text */
function exPlanText(ex){
  const parts=[]; let base='';
  if(ex.sets||ex.reps) base=(ex.sets?ex.sets:'?')+' × '+(ex.reps||'?');
  if(ex.loadKg!=null) base+=(base?' ':'')+'@ '+fmtNum(ex.loadKg)+' kg';
  if(base) parts.push(base);
  if(ex.loadNote) parts.push(ex.loadNote);
  if(ex.rpeTarget) parts.push('RPE '+ex.rpeTarget);
  if(ex.rest) parts.push('Pause '+ex.rest);
  return parts.join(' · ');
}

'use strict';
/* ===== AOS – Änderungsverfolgung & Zusammenführen =====
   Jeder Eintrag (Einheit, Test, Mahlzeit …) ist ein "Datensatz" mit Schlüssel <bereich>:<id>.
   AOS merkt sich pro Datensatz, wann er zuletzt geändert (stamps) oder gelöscht (tombstones) wurde.
   Beim Zusammenführen gewinnt pro Datensatz die jüngste Änderung bzw. Löschung. */

const SYNC_ARRAYS = [
  ['goals','Ziele', d=>d.goals, (d,v)=>d.goals=v],
  ['tests','Testergebnisse', d=>d.tests, (d,v)=>d.tests=v],
  ['bodyweight','Körpergewichtsmessungen', d=>d.bodyweight, (d,v)=>d.bodyweight=v],
  ['blocks','Trainingsblöcke (inkl. Trainingstage & Übungen)', d=>d.blocks, (d,v)=>d.blocks=v],
  ['sessions','Trainingseinheiten', d=>d.sessions, (d,v)=>d.sessions=v],
  ['food','Ernährungsbausteine', d=>d.nutrition.items, (d,v)=>d.nutrition.items=v],
  ['combo','Ernährungskombinationen', d=>d.nutrition.combos, (d,v)=>d.nutrition.combos=v],
  ['mtpl','Gespeicherte Mahlzeiten', d=>d.nutrition.templates, (d,v)=>d.nutrition.templates=v],
  ['meal','Mahlzeiten', d=>d.nutrition.meals, (d,v)=>d.nutrition.meals=v],
  ['field','Feldtraining', d=>d.fieldLogs, (d,v)=>d.fieldLogs=v],
  ['cal','Kalender', d=>d.calendar, (d,v)=>d.calendar=v]
];

function syncRecords(d){
  const m=new Map();
  SYNC_ARRAYS.forEach(([c,,get])=>(get(d)||[]).forEach(r=>m.set(c+':'+r.id, r)));
  m.set('profile:_', d.profile);
  const n=d.nutrition; m.set('nutset:_', {guides:n.guides, guidesSource:n.guidesSource||'', constraints:n.constraints||''});
  (d.unavailable||[]).forEach(x=>m.set('unavail:'+x, true));
  Object.entries(d.suggestionDecisions||{}).forEach(([k,v])=>m.set('decision:'+k, v));
  Object.entries(n.dayOverrides||{}).forEach(([k,v])=>m.set('dayov:'+k, v));
  return m;
}
function applyRecords(d, m){
  SYNC_ARRAYS.forEach(([c,,,set])=>set(d, [...m].filter(([k])=>k.startsWith(c+':')).map(([,v])=>v)));
  if(m.has('profile:_')) d.profile=m.get('profile:_');
  if(m.has('nutset:_')){ const x=m.get('nutset:_'); d.nutrition.guides=x.guides; d.nutrition.guidesSource=x.guidesSource; d.nutrition.constraints=x.constraints; }
  d.unavailable=[...m.keys()].filter(k=>k.startsWith('unavail:')).map(k=>k.slice(8)).sort();
  d.suggestionDecisions=Object.fromEntries([...m].filter(([k])=>k.startsWith('decision:')).map(([k,v])=>[k.slice(9),v]));
  d.nutrition.dayOverrides=Object.fromEntries([...m].filter(([k])=>k.startsWith('dayov:')).map(([k,v])=>[k.slice(6),v]));
}
function fp(v){ return JSON.stringify(v); }
function newDeviceId(){ return 'dev-'+Math.random().toString(36).slice(2,10); }
function syncStampAll(d, at){
  d.sync = d.sync || { stamps:{}, tombstones:{}, deviceId:newDeviceId() };
  syncRecords(d).forEach((v,k)=>{ d.sync.stamps[k]=at; });
}

/* Fingerabdrücke des zuletzt gespeicherten Stands (nur im Arbeitsspeicher) */
let lastFP = new Map();
function syncInit(){
  if(!S.sync) syncStampAll(S, S.meta.updatedAt||SEED_TIME);
  S.sync.stamps=S.sync.stamps||{}; S.sync.tombstones=S.sync.tombstones||{};
  lastFP=new Map(); syncRecords(S).forEach((v,k)=>{ lastFP.set(k, fp(v)); if(!S.sync.stamps[k]) S.sync.stamps[k]=S.meta.updatedAt||SEED_TIME; });
}
function syncTrack(){
  if(!S.sync) return false;
  const now=new Date().toISOString(); const cur=new Map(); let changed=false;
  syncRecords(S).forEach((v,k)=>{ const f=fp(v); cur.set(k,f);
    if(lastFP.get(k)!==f){ S.sync.stamps[k]=now; delete S.sync.tombstones[k]; changed=true; } });
  lastFP.forEach((f,k)=>{ if(!cur.has(k)){ S.sync.tombstones[k]=now; delete S.sync.stamps[k]; changed=true; } });
  lastFP=cur;
  return changed;
}

/* Ältere Daten (vor Version 3): Ausgangsdaten auf feste IDs umstellen, damit sie geräteübergreifend gleich sind */
function syncMigrateLegacy(d){
  const seed=seedData(); const remap={};
  const SRC='ausgangsdaten';
  d.tests.forEach(t=>{ if(t.source===SRC){ const nid='seed-test-'+slug(t.name)+'-'+(t.value==null?'x':t.value); if(seed.tests.some(x=>x.id===nid) && !d.tests.some(x=>x.id===nid)){ t.id=nid; } } });
  d.goals.forEach(g=>{ if(g.source===SRC){ const nid='seed-goal-'+slug(g.name); if(seed.goals.some(x=>x.id===nid) && !d.goals.some(x=>x.id===nid)) g.id=nid; } });
  const bw=d.bodyweight.find(x=>x.source===SRC); if(bw && !d.bodyweight.some(x=>x.id==='seed-bw-1')) bw.id='seed-bw-1';
  const b=d.blocks.find(x=>x.source===SRC);
  if(b && !d.blocks.some(x=>x.id==='seed-block-1')){
    remap[b.id]='seed-block-1'; b.id='seed-block-1';
    b.days.slice(0,4).forEach((day,i)=>{ const nid='seed-block-1-day-'+(i+1); remap[day.id]=nid; day.id=nid; });
  }
  d.sessions.forEach(s=>{ if(remap[s.blockId]) s.blockId=remap[s.blockId]; if(remap[s.dayId]) s.dayId=remap[s.dayId]; });
  const fr={};
  d.nutrition.items.forEach(f=>{ if(f.source===SRC){ const nid='seed-food-'+f.cat+'-'+slug(f.name); if(!d.nutrition.items.some(x=>x.id===nid)){ fr[f.id]=nid; f.id=nid; } } });
  const rm=a=>a.map(i=>fr[i]||i);
  d.nutrition.meals.forEach(m=>m.items=rm(m.items)); d.nutrition.combos.forEach(c=>c.items=rm(c.items));
  d.profile.positions.forEach(p=>{ if(p.code==='RB'&&!p.id.startsWith('seed')) p.id='seed-pos-rb'; if(p.code==='DE'&&!p.id.startsWith('seed')) p.id='seed-pos-de'; });
  // Zeitstempel: unveränderte Ausgangsdaten gelten als "nie geändert", alles andere als zuletzt gespeichert
  const norm=v=>JSON.stringify(v,(k,x)=>(k==='id'||k==='createdAt'||k==='replacedAt'||k==='version')?undefined:x);
  const sr=syncRecords(seed); const at=(d.meta&&d.meta.updatedAt)||new Date().toISOString();
  d.sync={ stamps:{}, tombstones:{}, deviceId:newDeviceId() };
  const same=new Map();
  syncRecords(d).forEach((v,k)=>{ const eq=sr.has(k) && norm(sr.get(k))===norm(v); if(eq) same.set(k, sr.get(k)); d.sync.stamps[k] = eq ? SEED_TIME : at; });
  // unveränderte Ausgangsdaten exakt auf den Standardstand bringen (gleiche IDs/Zeitfelder auf allen Geräten)
  if(same.size){ const m=syncRecords(d); same.forEach((v,k)=>m.set(k, clone(v))); applyRecords(d, m); }
}

/* Zusammenführen: lokaler Stand L + Datei R → neuer Stand + Bericht */
function mergeData(L, R){
  const lm=syncRecords(L), rm=syncRecords(R);
  const ls=L.sync.stamps, lt=L.sync.tombstones, rs=R.sync.stamps, rt=R.sync.tombstones;
  const keys=new Set([...lm.keys(), ...rm.keys(), ...Object.keys(lt), ...Object.keys(rt)]);
  const out=new Map(); const stamps={}, tombs={};
  const rep={ added:{}, updated:{}, deleted:{}, keptLocal:{}, total:0 };
  const inc=(o,k)=>{ const c=k.split(':')[0]; o[c]=(o[c]||0)+1; rep.total++; };
  // lokale Reihenfolge beibehalten, neue Einträge hinten anhängen
  const order=[...lm.keys(), ...[...rm.keys()].filter(k=>!lm.has(k))];
  const decide=k=>{
    const c=[];
    if(lm.has(k)) c.push({t:ls[k]||'', side:'L', del:false});
    if(lt[k]) c.push({t:lt[k], side:'L', del:true});
    if(rm.has(k)) c.push({t:rs[k]||'', side:'R', del:false});
    if(rt[k]) c.push({t:rt[k], side:'R', del:true});
    c.sort((a,b)=> a.t<b.t?1 : a.t>b.t?-1 : (a.side==='L'?-1:1));
    return c[0];
  };
  keys.forEach(k=>{
    const w=decide(k);
    if(w.del){ tombs[k]=[lt[k]||'',rt[k]||''].sort().pop(); if(lm.has(k)) inc(rep.deleted,k); return; }
    stamps[k]=w.t;
    if(w.side==='R'){ if(!lm.has(k)) inc(rep.added,k); else if(fp(lm.get(k))!==fp(rm.get(k))) inc(rep.updated,k); }
    else if(rm.has(k) && fp(lm.get(k))!==fp(rm.get(k))) inc(rep.keptLocal,k);
  });
  const m=new Map();
  order.forEach(k=>{ if(stamps[k]===undefined) return; const w=decide(k); m.set(k, clone(w.side==='R'?rm.get(k):lm.get(k))); });
  const res=clone(L); applyRecords(res, m);
  res.sync={ stamps, tombstones:tombs, deviceId:L.sync.deviceId, lastMerge:{ at:new Date().toISOString(), from:R.sync.deviceId||'', fileUpdatedAt:(R.meta&&R.meta.updatedAt)||'' } };
  return { data:res, report:rep };
}

/* ---------- Dateien & Zwischenablage ---------- */
function isIOS(){ return /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1); }
function isStandalone(){ return window.navigator.standalone===true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches); }
function download(filename, content, mime){
  const blob = new Blob([content], {type:(mime||'text/plain')+';charset=utf-8'});
  if(isIOS() && navigator.canShare && typeof File==='function'){
    try{ const file=new File([blob], filename, {type:blob.type});
      if(navigator.canShare({files:[file]})){ navigator.share({files:[file], title:filename}).catch(e=>{ if(e && e.name!=='AbortError') toast('Teilen nicht möglich: '+e.message); }); return; } }catch(e){}
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
async function copyText(text){
  try{ if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(text); toast('In die Zwischenablage kopiert.'); return true; } }catch(e){}
  const ta=document.createElement('textarea'); ta.value=text; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
  let ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
  ta.remove();
  toast(ok?'In die Zwischenablage kopiert.':'Kopieren nicht möglich – bitte den Text markieren und manuell kopieren.');
  return ok;
}

const REST={ start:0, min:0, max:0, key:'', iv:null, beeped:0, ac:null };
function restRange(pe){ const m=String((pe&&pe.rest)||'').match(/(\d+)(?:\s*[–-]\s*(\d+))?/); if(!m) return [90,90]; const a=+m[1], b=m[2]?+m[2]:a; return [a,b]; }
function restMaybeStart(ei, sj, f, n){
  const s=sessionById(ui.sessionId); if(!s || s.log || typeof n!=='number' || Number.isNaN(n)) return;
  const e=ui.draft.exercises[ei]; const keys=(e.metric||'kraft')==='kraft' ? ['reps'] : ['reps',(METRIC_FIELDS[e.metric]||METRIC_FIELDS.kraft)[0][0]];
  if(!keys.includes(f)) return; const k=ei+'-'+sj; if(REST.key===k) return;

}
function restStart(a,b,k){ Object.assign(REST,{ start:Date.now(), min:a, max:b, key:k||'', beeped:0 });
  try{ if(!REST.ac){ const C=window.AudioContext||window.webkitAudioContext; if(C) REST.ac=new C(); } if(REST.ac && REST.ac.state==='suspended') REST.ac.resume(); }catch(e){}
  clearInterval(REST.iv); REST.iv=setInterval(restTick, 500); restTick(); }

  for(let i=0;i<n;i++){ const o=ac.createOscillator(), g=ac.createGain(); o.frequency.value=880; o.connect(g); g.connect(ac.destination);
    const t=ac.currentTime+i*0.25; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.3,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.18); o.start(t); o.stop(t+0.2); } }catch(e){} }
function restStop(){ clearInterval(REST.iv); REST.iv=null; REST.key=''; const el=document.getElementById('rest-bar'); if(el) el.remove(); }
function restTick(){
  if(!(ui.view==='training' && ui.sessionId)){ restStop(); return; }
  const sec=Math.floor((Date.now()-REST.start)/1000); const fmt=x=>Math.floor(x/60)+':'+String(x%60).padStart(2,'0');
  if(sec>=REST.min && REST.beeped<1){ REST.beeped=1; restBeep(1); }
  if(REST.max>REST.min && sec>=REST.max && REST.beeped<2){ REST.beeped=2; restBeep(2); }
  let el=document.getElementById('rest-bar');
  if(!el){ el=document.createElement('div'); el.id='rest-bar'; el.setAttribute('role','timer'); document.body.appendChild(el); }
  const st= sec>=REST.max ? 'go' : sec>=REST.min ? 'ok' : '';
  el.className=st; const pct=Math.min(100, sec/REST.max*100);
  el.innerHTML='<span class="rb-l">Pause</span><span class="rb-t">'+fmt(sec)+'</span><span class="rb-z">'+(st==='go'?'weiter geht’s':'Ziel '+(REST.min===REST.max?fmt(REST.min):fmt(REST.min)+'–'+fmt(REST.max)))+'</span>'+
    '<button class="small" data-act="restPlus" aria-label="30 Sekunden länger">+30</button><button class="small" data-act="restStop" aria-label="Pause beenden">✕</button><i style="width:'+pct+'%"></i>';
}
ACT.restStop = ()=>restStop();
ACT.restPlus = ()=>{ REST.min+=30; REST.max+=30; if(REST.beeped>0 && (Date.now()-REST.start)/1000<REST.min) REST.beeped=0; restTick(); };

/* ---------- Scheibenrechner: Scheiben je Seite für Langhantel-Übungen ---------- */
const BAR_KG=20, PLATES=[25,20,15,10,5,2.5,1.25];
function isBarbell(pe){ const x=pe&&pe.planner&&typeof REF!=='undefined'&&REF.exMap[pe.planner.dbId]; return !!(x && (x.equipment||[]).includes('barbell')); }
function platesText(kg){ if(kg==null||!(kg>BAR_KG)) return ''; let rest=(kg-BAR_KG)/2; const out=[];
  PLATES.forEach(p=>{ while(rest>=p-1e-9){ out.push(p); rest-=p; } });
  return 'Je Seite: '+out.map(fmtNum).join(' · ')+(rest>0.01?' (+'+fmtNum(Math.round(rest*2*100)/100)+' kg fehlen)':'')+' · Stange '+BAR_KG+' kg'; }
function platesUpdate(ei){ const el=document.getElementById('plates-'+ei); if(!el||!ui.draft) return; const e=ui.draft.exercises[ei];
  const typed=e.sets.map(x=>x.kg).filter(v=>typeof v==='number'&&!Number.isNaN(v)).slice(-1)[0]; const kg=typed!=null?typed:+el.dataset.plan||null;
  el.textContent=platesText(kg); }

/* ---------- Aufwärmsätze zur Arbeitslast (Hauptübungen) ---------- */
function warmupSets(pe){ const kg=pe&&pe.loadKg; if(!(kg>=40) || !pe.planner || pe.planner.role!=='main') return [];
  const bar=isBarbell(pe); const rd=x=>Math.round(x/2.5)*2.5; const out=[]; if(bar) out.push([BAR_KG,10]);
  [[0.4,5],[0.6,3],[0.8,2]].forEach(([p,r])=>{ const w=rd(kg*p); if(w>(out.length?out[out.length-1][0]:0) && w<kg && (!bar||w>BAR_KG)) out.push([w,r]); });
  return out; }

/* Letzte Leistung einer Übung (gleicher Name und Variante), ohne die aktuelle Einheit */
function lastPerf(e, excludeId){
  const key=e.name+'|'+(e.variant||'');
  const ss=loggedSessions().filter(s=>s.id!==excludeId).reverse();
  for(const s of ss){ const le=s.log.exercises.find(x=>x.name+'|'+(x.variant||'')===key); if(!le) continue;
    const sets=le.sets.filter(x=>Object.values(x).some(v=>v!=null)); if(!sets.length) continue;
    const withKg=sets.filter(x=>x.kg!=null);
    const top=withKg.length?withKg.reduce((a,b)=>(b.kg>a.kg||(b.kg===a.kg&&(b.reps||0)>(a.reps||0)))?b:a):sets[0];
    const same=sets.every(x=>x.kg===sets[0].kg && x.reps===sets[0].reps);
    const rp=sets.map(x=>x.rpe).filter(v=>v!=null); const rpMax=rp.length?Math.max(...rp):null;
    const txt=(same&&sets.length>1&&sets[0].reps!=null ? sets.length+' × '+istOf(Object.assign({},top,{rpe:rpMax})) : istOf(top)+(sets.length>1?' · '+sets.length+' Sätze':''));
    return { date:sessionDate(s), text:txt };
  }
  return null;
}

/* Autoregulation in der Einheit (Hauptübungen mit Lastvorgabe): Der letzte Satz mit kg + RPE entscheidet über die
   restlichen Sätze. Über der RPE-Obergrenze −5 %, mindestens 1 RPE über dem Ziel −2,5 %. Gesteigert wird hier nie. */
function autoreg(s, e){
  const pe=(s.plan||[]).find(p=>p.id===e.planExId); if(!pe || pe.loadKg==null || (e.metric||'kraft')!=='kraft' || !pe.planner || pe.planner.role!=='main') return null;
  const cap=(s.planner&&s.planner.cap!=null)?s.planner.cap:null; const tgt=pe.rpeTarget!=null?Number(String(pe.rpeTarget).replace(',','.')):null;
  let j=-1; e.sets.forEach((x,k)=>{ if(typeof x.kg==='number' && !isNaN(x.kg) && typeof x.rpe==='number' && !isNaN(x.rpe)) j=k; }); if(j<0) return null;
  const x=e.sets[j]; let p=0, why='';
  if(cap!=null && x.rpe>cap){ p=0.05; why='über der Obergrenze RPE '+fmtNum(cap); }
  else if(tgt!=null && !isNaN(tgt) && x.rpe>=tgt+1){ p=0.025; why='deutlich über dem Ziel RPE '+fmtNum(tgt); }
  if(!p) return null;
  const inc=plInc(pe.planner.dbId); let kg=Math.round(x.kg*(1-p)/inc)*inc; if(kg>=x.kg) kg=x.kg-inc; if(kg<=0) return null;
  return { from:j, kg, text:'Satz '+(j+1)+' lag mit RPE '+fmtNum(x.rpe)+' '+why+' → restliche Sätze '+fmtNum(kg)+' kg ('+(p===0.05?'−5 %':'−2,5 %')+').' };
}

/* Standortbestimmung automatisch (Testwoche eines Blocks): Top-Satz der Grundübungen (Kniebeuge, Bank, Trap Bar)

function autoTests(s){ if(!s || !s.planner || !s.log) return 0; const b=blockById(s.blockId); if(!b || !(b.test_weeks||[]).includes(s.planner.week)) return 0;

    let c=null; const kg=e.sets.filter(x=>typeof x.kg==='number'&&typeof x.reps==='number'); const ht=e.sets.filter(x=>typeof x.height==='number');
    if(kg.length){ const t=kg.reduce((a,b)=>(b.kg>a.kg||(b.kg===a.kg&&b.reps>a.reps))?b:a); c={value:t.kg,unit:'kg',reps:t.reps,rpe:t.rpe??null,category:'Kraft'}; }

    S.tests.push({ id:uid('test'), source:'training', fromSession:s.id, createdAt:new Date().toISOString(), name, category:prev?prev.category:c.category, date, value:c.value, unit:c.unit, reps:c.reps, rpe:c.rpe, detail:'', conditions:'Standortbestimmung aus '+s.name, note:'' }); n++; });

/* ===== AOS – Tests, Körpergewicht, Verlauf ===== */
function lineChart(points, opts){
  opts=opts||{}; const W=640,H=200,P={l:44,r:14,t:14,b:28};
  if(points.length<2) return '';
  const xs=points.map(p=>parseISO(p.x).getTime()); const ys=points.map(p=>p.y);
  let y0=Math.min(...ys), y1=Math.max(...ys); if(opts.goal!=null){ y0=Math.min(y0,opts.goal); y1=Math.max(y1,opts.goal); }
  if(y0===y1){ y0-=1; y1+=1; } const pad=(y1-y0)*0.1; y0-=pad; y1+=pad;
  const x0=Math.min(...xs), x1=Math.max(...xs)||x0+1;
  const X=t=>P.l+(x1===x0?0.5:(t-x0)/(x1-x0))*(W-P.l-P.r), Y=v=>H-P.b-(v-y0)/(y1-y0)*(H-P.t-P.b);
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opts.label||'Verlauf')+'">';
  for(let i=0;i<=3;i++){ const v=y0+(y1-y0)*i/3; s+='<line class="gl" x1="'+P.l+'" x2="'+(W-P.r)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text x="'+(P.l-6)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+fmtNum(Math.round(v*10)/10)+'</text>'; }
  if(opts.goal!=null) s+='<line class="goal" x1="'+P.l+'" x2="'+(W-P.r)+'" y1="'+Y(opts.goal)+'" y2="'+Y(opts.goal)+'"/><text x="'+(W-P.r)+'" y="'+(Y(opts.goal)-5)+'" text-anchor="end">Ziel '+fmtNum(opts.goal)+'</text>';
  if(opts.trend){ const av=points.map((p,i)=>{ const w=points.filter((q,j)=>xs[j]<=xs[i] && xs[j]>xs[i]-7*864e5); return w.reduce((a,q)=>a+q.y,0)/w.length; });
    s+='<polyline class="ln ln-raw" points="'+points.map((p,i)=>X(xs[i])+','+Y(p.y)).join(' ')+'"/>';
    s+='<polyline class="ln ln-trend" points="'+av.map((v,i)=>X(xs[i])+','+Y(v)).join(' ')+'"/>'; }
  else s+='<polyline class="ln" points="'+points.map((p,i)=>X(xs[i])+','+Y(p.y)).join(' ')+'"/>';
  points.forEach((p,i)=>{ s+='<circle class="pt'+(opts.trend?' pt-raw':'')+'" cx="'+X(xs[i])+'" cy="'+Y(p.y)+'" r="4"><title>'+fmtDate(p.x)+': '+fmtNum(p.y)+(opts.unit?' '+opts.unit:'')+'</title></circle>'; });
  s+='<text x="'+P.l+'" y="'+(H-8)+'">'+fmtDate(points[0].x)+'</text><text x="'+(W-P.r)+'" y="'+(H-8)+'" text-anchor="end">'+fmtDate(points[points.length-1].x)+'</text></svg>';
  return s;
}

/* ---------- Standortbestimmung: beste Sätze der letzten 7 Tage als Testergebnis übernehmen (Spezifikation 3.8) ---------- */
const TEST_SYN=[['kniebeuge','squat'],['kreuzheben','deadlift'],['bankdrücken','bench'],['klimmzug','pull'],['klimmzüge','pull'],['liegestütz','push-up']];
function normName(n){ let x=String(n||'').toLowerCase().replace(/[()–-]/g,' '); TEST_SYN.forEach(([a,b])=>{ x=x.split(a).join(b); }); return x.split(/\s+/).filter(w=>w.length>1).sort().join(' '); }
function guessTest(exName){ const names=[...new Set(S.tests.map(t=>t.name))]; const a=normName(exName).split(' ');
  let best=null, sc=0; names.forEach(n=>{ const b=normName(n).split(' '); const k=a.filter(w=>b.includes(w)).length/Math.max(a.length,b.length); if(k>sc){ sc=k; best=n; } }); return sc>=0.5?best:''; }
function fromTrainingCandidates(){ const from=addDays(todayISO(),-6); const out={};
  loggedSessions().filter(s=>sessionDate(s)>=from).forEach(s=>s.log.exercises.forEach(e=>{
    const kg=e.sets.filter(x=>x.kg!=null&&x.reps!=null); const ht=e.sets.filter(x=>x.height!=null); let c=null;
    if(kg.length){ const t=kg.reduce((a,b)=>(b.kg>a.kg||(b.kg===a.kg&&b.reps>a.reps))?b:a); c={value:t.kg,unit:'kg',reps:t.reps,rpe:t.rpe,category:'Kraft'}; }
    else if(ht.length){ const t=ht.reduce((a,b)=>b.height>a.height?b:a); c={value:t.height,unit:'cm',reps:null,rpe:t.rpe,category:'Sprung & Power'}; }
    else { const r=e.sets.filter(x=>x.reps!=null&&x.kg==null); if(r.length){ const t=r.reduce((a,b)=>b.reps>a.reps?b:a); c={value:t.reps,unit:'Wdh',reps:null,rpe:t.rpe,category:'Kraft'}; } }
    if(!c) return; const k=e.name+(e.variant?' ('+e.variant+')':''); const prev=out[k];
    if(!prev || c.value>prev.value) out[k]=Object.assign(c,{ex:k,date:sessionDate(s)}); }));
  return Object.values(out); }
ACT.testsFromTraining = ()=>{ const L=fromTrainingCandidates(); const names=[...new Set(S.tests.map(t=>t.name))];

      sel('tft-'+i,'Als Test speichern',[['','— nicht übernehmen —']].concat(names.map(n=>[n,n])).concat([['__neu','neuer Test: '+c.ex]]),guessTest(c.ex))+'</div>').join('');

    S.tests.push({ id:uid('test'), source:'eingabe', createdAt:new Date().toISOString(), name, category:prev?prev.category:c.category, date:c.date, value:c.value, unit:c.unit, reps:c.reps, rpe:c.rpe, detail:'', conditions:'aus dem Training ('+c.ex+')', note:'' }); n++; });

/* Wochenbelastung (Session-RPE × Minuten, „AU“): Gym aus den Protokollen (Ø RPE der Sätze × Dauer), Feld aus dem Feldprotokoll.
   Einheiten ohne Dauer oder RPE werden nicht geschätzt, sondern weggelassen und gezählt. */
function weeklyLoad(weeks){
  const mon=mondayOf(todayISO()); const W=[]; for(let i=weeks-1;i>=0;i--) W.push({mon:addDays(mon,-7*i), gym:0, field:0, miss:0});
  const at=d=>W.find(w=>d>=w.mon && d<=addDays(w.mon,6));
  loggedSessions().forEach(s=>{ const w=at(sessionDate(s)); if(!w) return; const rp=[]; s.log.exercises.forEach(e=>e.sets.forEach(x=>{ if(x.rpe!=null) rp.push(x.rpe); }));
    if(s.log.durationMin && rp.length) w.gym+=Math.round(s.log.durationMin*rp.reduce((a,b)=>a+b,0)/rp.length); else w.miss++; });
  (S.fieldLogs||[]).forEach(l=>{ const w=at(l.date); if(!w||l.status==='ausgefallen') return; if(l.rpe&&l.durationMin) w.field+=l.rpe*l.durationMin; else w.miss++; });
  return W;
}
function readySection(){
  const L=loggedSessions().map(s=>{ const c=(s.planner&&s.planner.checkin)||{}; return { d:sessionDate(s), r:s.log.form!=null?s.log.form:(c.readiness!=null?c.readiness:null), p:c.pain||0 }; }).filter(x=>x.r!=null).slice(-20);
  if(L.length<2) return '';
  const avg=a=>Math.round(a.reduce((x,y)=>x+y,0)/a.length*10)/10; const last5=L.slice(-5).map(x=>x.r);
  const pain=L.filter(x=>x.p>0);
  const b=lineChart(L.map(x=>({x:x.d,y:x.r})),{label:'Tagesform'})+'<p class="small">Ø der letzten '+last5.length+' Einheiten: <strong>'+fmtNum(avg(last5))+'</strong> von 5'+(pain.length?' · Beschwerden in '+pain.length+' von '+L.length+' Einheiten':'')+'</p><p class="small muted">Tagesform 1 = schlecht, 5 = top – aus dem Check-in vor der Einheit.</p>';
  return pdet('v-ready','Tagesform','Ø '+fmtNum(avg(last5))+' von 5', b);
}
function loadSection(){
  const W=weeklyLoad(8); const tot=w=>w.gym+w.field; if(!W.some(w=>tot(w)>0)) return '';
  const max=Math.max(...W.map(tot)); const cur=W[W.length-1], prev=W.slice(-4,-1).filter(w=>tot(w)>0);
  const avg=prev.length?prev.reduce((a,w)=>a+tot(w),0)/prev.length:0; const ratio=avg?tot(cur)/avg:null;
  const Wd=640,H=170,P={l:8,r:8,t:10,b:24}; const bw=(Wd-P.l-P.r)/W.length;
  let svg='<svg class="chart" viewBox="0 0 '+Wd+' '+H+'" role="img" aria-label="Wochenbelastung">';
  W.forEach((w,i)=>{ const x=P.l+i*bw+bw*0.18, wd=bw*0.64, sc=v=>v/max*(H-P.t-P.b); const g=sc(w.gym), f=sc(w.field); const y0=H-P.b;
    if(w.gym) svg+='<rect class="bar-gym" x="'+x+'" y="'+(y0-g)+'" width="'+wd+'" height="'+g+'"><title>Gym '+w.gym+' AU</title></rect>';
    if(w.field) svg+='<rect class="bar-field" x="'+x+'" y="'+(y0-g-f)+'" width="'+wd+'" height="'+f+'"><title>Feld '+w.field+' AU</title></rect>';
    svg+='<text x="'+(x+wd/2)+'" y="'+(H-8)+'" text-anchor="middle">'+fmtDate(w.mon).slice(0,6)+'</text>'; });
  svg+='</svg>';
  let b=svg+'<p class="small"><span class="lg lg-gym"></span> Gym <span class="lg lg-field"></span> Feld · diese Woche <strong>'+tot(cur)+' AU</strong>'+(avg?' · Schnitt der 3 Wochen davor '+Math.round(avg)+' AU':'')+'</p>';
  if(ratio!=null && ratio>1.3) b+='<div class="note warn small">Diese Woche liegt die Belastung <strong>'+Math.round((ratio-1)*100)+' %</strong> über dem Schnitt der Vorwochen. Starke Sprünge erhöhen das Verletzungsrisiko – Schlaf, Essen und Erholung im Blick behalten.</div>';
  const miss=W.reduce((a,w)=>a+w.miss,0); if(miss) b+='<p class="small muted">'+miss+' Einheit'+(miss===1?'':'en')+' ohne Dauer oder RPE nicht enthalten.</p>';
  b+='<p class="small muted">Belastung = Anstrengung (RPE) × Minuten. Gym: Ø RPE der Sätze × Dauer.</p>';
  return pdet('v-load','Wochenbelastung','diese Woche '+tot(cur)+' AU'+(ratio!=null&&ratio>1.3?' · stark gestiegen':''), b);
}
function testCard(name){
  const list=S.tests.filter(t=>t.name===name).slice().sort((a,b)=>{ if(a.date&&b.date) return a.date<b.date?-1:1; if(a.date) return 1; if(b.date) return -1; return 0; });
  const goal=S.goals.find(g=>g.testName===name && g.status==='aktiv');
  const units=[...new Set(list.filter(t=>t.value!=null).map(t=>t.unit))];
  const pts=list.filter(t=>t.date&&t.value!=null&&t.unit===units[0]).map(t=>({x:t.date,y:t.value}));
  const last=list[list.length-1];
  let h='';
  if(pts.length>=2) h+=lineChart(pts,{unit:units[0],goal:goal&&goal.unit===units[0]?goal.target:null,label:name});
  // Vergleich der letzten beiden Einträge
  if(list.length>=2){
    const a=list[list.length-2], b=list[list.length-1]; const issues=[];
    if(!a.date||!b.date) issues.push('mindestens ein Datum fehlt – Reihenfolge unsicher');
    if(a.conditions && b.conditions && a.conditions!==b.conditions) issues.push('Testbedingungen unterscheiden sich');
    if(a.unit!==b.unit) issues.push('unterschiedliche Einheiten');
    if((a.reps||null)!==(b.reps||null)) issues.push('unterschiedliche Wiederholungszahl');
    let diff=''; if(a.value!=null&&b.value!=null&&a.unit===b.unit){ const d=b.value-a.value; diff=(d>0?'+':'')+fmtNum(d)+' '+b.unit; }
    h+='<p class="small">Vergleich der letzten beiden Einträge: '+esc(testValueText(a))+' → '+esc(testValueText(b))+(diff?' ('+esc(diff)+')':'')+'</p>';
    if(issues.length) h+='<div class="note warn small">Vergleich nur eingeschränkt aussagekräftig: '+esc(issues.join('; '))+'.</div>';
  }
  h+='<div class="table-wrap"><table><thead><tr><th>Datum</th><th>Ergebnis</th><th>Bedingungen</th><th>Hinweise</th><th></th></tr></thead><tbody>'+
    list.slice().reverse().map(t=>{ const g=testGaps(t);
      return '<tr><td>'+(t.date?fmtDate(t.date):'—')+'</td><td>'+esc(testValueText(t))+'</td><td>'+esc(t.conditions||'—')+'</td><td>'+srcBadge(t)+' '+g.map(x=>badge(x,'warn')).join(' ')+(t.note?'<div class="small muted">'+esc(t.note)+'</div>':'')+'</td><td><button class="small" data-act="editTest" data-id="'+t.id+'">Bearbeiten</button></td></tr>'; }).join('')+
    '</tbody></table></div><div class="add-row"><button class="small" data-act="editTest" data-name="'+esc(name)+'">+ Neue Messung</button></div>';
  const info=[last?'Aktuell <strong>'+esc(testValueText(last))+'</strong>':'', goal?'Ziel '+esc(fmtNum(goal.target)+' '+goal.unit):'', list.length===1?'1 Eintrag':list.length+' Einträge'].filter(Boolean).join(' · ');
  return pdet('vt-'+name,name,'','<p class="small muted" style="margin-top:0">'+info+'</p>'+h);
}

/* Verlauf je Übung aus den Protokollen: schwerster erfasster Satz pro Einheit (keine Hochrechnung) */
function trainingProgress(){
  const map={};
  loggedSessions().forEach(s=>s.log.exercises.forEach(e=>{
    const key=e.name+(e.variant?' ('+e.variant+')':'');
    const withKg=e.sets.filter(x=>x.kg!=null);
    const top=withKg.length?withKg.reduce((a,b)=>(b.kg>a.kg||(b.kg===a.kg&&(b.reps||0)>(a.reps||0)))?b:a):null;
    (map[key]=map[key]||[]).push({date:sessionDate(s), top, sets:e.sets, session:s});
  }));
  const keys=Object.keys(map).sort();
  if(!keys.length) return '<div class="empty">Sobald Einheiten protokolliert sind, siehst du hier je Übung den Verlauf.</div>';
  if(!ui.exName || !map[ui.exName]) ui.exName=keys[0];
  const list=map[ui.exName];
  let h='<div class="section">'+sel('pr-ex','Übung',keys.map(k=>[k,k+' ('+map[k].length+')']),ui.exName,'data-chg="pickEx"');
  const pts=list.filter(x=>x.top).map(x=>({x:x.date,y:x.top.kg}));
  h+= pts.length>=2 ? lineChart(pts,{unit:'kg',label:'Schwerster Satz '+ui.exName}) : '<p class="small muted">Diagramm ab zwei Einheiten mit Gewichtsangabe.</p>';
  // Geschätztes 1RM (Epley), nur Sätze mit Gewicht und 1–10 Wdh
  const e1=x=>{ const c=x.sets.filter(y=>y.kg!=null&&y.reps>=1&&y.reps<=10).map(y=>y.kg*(1+(y.reps===1?0:y.reps/30))); return c.length?Math.round(Math.max(...c)*2)/2:null; };
  const ep=list.map(x=>({x:x.date,y:e1(x)})).filter(p=>p.y!=null);
  if(ep.length) h+='<h3 style="margin-top:16px">Geschätztes 1RM</h3>'+(ep.length>=2?lineChart(ep,{unit:'kg',label:'Geschätztes 1RM '+ui.exName}):'')+
    '<p class="small muted">Aktuell ≈ <strong>'+fmtNum(ep[ep.length-1].y)+' kg</strong>'+(ep.length>=2?' ('+(ep[ep.length-1].y-ep[0].y>=0?'+':'')+fmtNum(Math.round((ep[ep.length-1].y-ep[0].y)*2)/2)+' kg seit '+fmtDate(ep[0].x)+')':'')+'. Schätzung nach Epley aus dem besten Satz bis 10 Wdh – kein getestetes Maximum.</p>';
  h+='<div class="table-wrap"><table><thead><tr><th>Datum</th><th>Schwerster Satz</th><th>Alle Sätze</th></tr></thead><tbody>'+list.slice().reverse().map(x=>'<tr><td>'+fmtDate(x.date)+'</td><td>'+(x.top?fmtNum(x.top.kg)+' kg × '+(x.top.reps!=null?x.top.reps:'?')+(x.top.rpe!=null?' @'+fmtNum(x.top.rpe):''):'—')+'</td><td class="small">'+esc(x.sets.map(y=>istOf(y)).filter(Boolean).join(' | ')||'—')+'</td></tr>').join('')+'</tbody></table></div>';
  h+='<p class="small muted">„Schwerster Satz“ ist der erfasste Satz mit dem höchsten Gewicht – keine Schätzung eines Maximalgewichts.</p></div>';
  return h;
}

function readBackup(el, onOk){
  const f=el.files&&el.files[0]; el.value=''; if(!f) return;
  const fail=msg=>openDlg('Datei nicht verwendbar', msg+'<p class="small muted">Deine aktuellen Daten wurden nicht verändert.</p>','<button data-act="closeDlg">OK</button>');
  if(f.size>20*1024*1024){ fail('<p>Die Datei ist größer als 20 MB und wird nicht als AOS-Sicherung erkannt.</p>'); return; }
  const r=new FileReader();
  r.onload=()=>{
    let d; try{ d=JSON.parse(r.result); }catch(e){ fail('<p>Die Datei „'+esc(f.name)+'“ ist keine gültige JSON-Datei.</p>'); return; }
    const v=validateData(d);
    if(!v.ok){ fail('<p>„'+esc(f.name)+'“ ist keine gültige AOS-Sicherung:</p><ul>'+v.errors.slice(0,8).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'); return; }
    try{ onOk(d, f); }catch(e){ console.error(e); fail('<p>Die Sicherung konnte nicht verarbeitet werden ('+esc(e.message)+').</p>'); }
  };
  r.onerror=()=>toast('Die Datei konnte nicht gelesen werden.');
  r.readAsText(f);
}

'use strict';
/* ===== AOS – Sessionplaner =====
   Regeln laut AOS_Sessionplaner_Spezifikation (v11). Persönliche Planerdaten (Phasen, Block, Templates, Startlasten)
   und die Übungsdatenbank kommen aus dem privaten Datenrepo (planner/plan.json, db/AOS_Uebungsdatenbank.json),
   werden nur gelesen und für den Offline-Betrieb auf dem Gerät zwischengespeichert.
   Grundsätze: AOS erfindet keine Zahlen (ohne Wert → Kalibrieren), Steigerungen brauchen eine Bestätigung,
   Reduktionen wegen Readiness/Zeit/Beschwerden passieren automatisch und werden begründet. */

const REF_KEY = 'aos-ref-v1';
const REF = { plan:null, ex:null, exMap:{}, nut:null, food:null, recipes:null, at:null, error:'', nutError:'', loading:false };
function refSet(plan, ex, at, more){ REF.plan=plan; REF.ex=ex; REF.at=at; REF.exMap={}; ((ex&&ex.exercises)||[]).forEach(e=>{ REF.exMap[e.id]=e; });
  try{ apGenerate(REF.plan); }catch(e){ console.warn('Automatische Blockplanung fehlgeschlagen', e); }
  try{ plDropStale(); }catch(e){}
  if(more){ REF.nut=more.nut||null; REF.food=more.food||null; REF.recipes=more.recipes||null; } }
/* Gespeicherte, noch nicht begonnene Einheiten eines Blocks, den es im Plan nicht mehr gibt (z. B. fester Block → automatisch), verwerfen */
function plDropStale(){ if(typeof S==='undefined' || !S || !REF.plan || !(REF.plan.blocks||[]).length) return;
  const ids=new Set(REF.plan.blocks.map(b=>b.id)); const n=S.sessions.length;
  S.sessions=S.sessions.filter(x=>!(x.status==='geplant' && !x.log && x.planner && x.planner.blockId && !ids.has(x.planner.blockId)));
  if(S.sessions.length<n) save(true); }
function refInit(){ try{ const c=JSON.parse(localStorage.getItem(REF_KEY)||'null'); if(c&&c.plan&&c.ex) refSet(c.plan, c.ex, c.at, c); }catch(e){} }
async function ghRaw(path){
  let res;
  try{ res = await fetch(ghRepoUrl('/contents/'+path.split('/').map(encodeURIComponent).join('/')+'?ref='+encodeURIComponent(gh.cfg.branch)),
    { cache:'no-store', headers:{ 'Accept':'application/vnd.github.raw+json', 'Authorization':'Bearer '+gh.cfg.token, 'X-GitHub-Api-Version':'2022-11-28' } }); }
  catch(e){ const err=new Error('Keine Verbindung zu GitHub'); err.offline=true; throw err; }
  if(!res.ok){ const err=new Error(res.status===404?'„'+path+'“ fehlt im Datenrepo.':'HTTP '+res.status); err.status=res.status; throw err; }
  return res.text();
}
async function refLoad(force){
  if(!ghReady() || REF.loading) return false;
  if(!force && REF.at && Date.now()-new Date(REF.at).getTime() < 10*60*1000) return true;
  REF.loading=true;
  try{
    const [p, x] = await Promise.all([ ghRaw('planner/plan.json'), ghRaw('db/AOS_Uebungsdatenbank.json') ]);
    let plan, ex; try{ plan=JSON.parse(p); ex=JSON.parse(x); }catch(e){ throw new Error('Planerdaten im Datenrepo sind kein gültiges JSON.'); }
    if(!plan.blocks || !ex.exercises) throw new Error('Planerdaten unvollständig.');
    // Ernährungsdaten getrennt laden: Fehlen sie, funktioniert der Trainingsplaner trotzdem
    const more={ nut:REF.nut, food:REF.food, recipes:REF.recipes };
    const r=await Promise.allSettled([ ghRaw('planner/nutrition.json'), ghRaw('db/AOS_Lebensmitteldatenbank.json'), ghRaw('db/AOS_Rezeptdatenbank.json') ]);
    try{ if(r[0].status==='fulfilled') more.nut=JSON.parse(r[0].value); if(r[1].status==='fulfilled') more.food=JSON.parse(r[1].value); if(r[2].status==='fulfilled') more.recipes=JSON.parse(r[2].value);
      REF.nutError = r.slice(0,2).some(x=>x.status!=='fulfilled') ? 'Ernährungsdaten fehlen im Datenrepo (planner/nutrition.json, db/AOS_Lebensmitteldatenbank.json).' : ''; }
    catch(e){ REF.nutError='Ernährungsdaten im Datenrepo sind kein gültiges JSON.'; }
    refSet(plan, ex, new Date().toISOString(), more); REF.error='';
    try{ localStorage.setItem(REF_KEY, JSON.stringify({ plan, ex, at:REF.at, nut:REF.nut, food:REF.food, recipes:REF.recipes })); }catch(e){}
    return true;
  }catch(e){ REF.error = e.offline ? '' : (e.status ? ghErrText(e) : e.message); return false; }
  finally{ REF.loading=false; const dlg=document.getElementById('dlg'); if(['training','uebersicht','plan','ernaehrung'].includes(ui.view) && !ui.sessionId && !(dlg&&dlg.open)) render(); }
}

function plMergeSlots(b, week, slots){ // Kernübungen (prio ≤ merge_priority) eines Templates, die in dieser Woche dosiert sind
  const fr=(REF.plan.rules||{}).frequency||{}; return slots.filter(x=>(x.prio||9)<=(fr.merge_priority||1) && (x.dose||{})[week]); }
function plFirstSession(b){ for(let i=0;i<b.weeks*7;i++){ const d=addDays(b.start,i); const w=plWeek(b,d); const t=plScheduledAt(b,d).tpl; if(t) return { date:d, tpl:t }; } return null; }
/* Laufender Block – oder vor dessen Start der nächste (z. B. am Wochenende vor Blockbeginn) */

/* ---------- Erholungssignale (Spezifikation 3.7): ab zwei Signalen plant AOS automatisch leichter ---------- */
function deloadSignals(){
  if(typeof REF==='undefined'||!REF.plan) return [];
  const L=loggedSessions().filter(s=>s.planner).slice(-8); if(L.length<2) return [];
  const thr=(REF.plan.rules||{}).pain_threshold||3; const out=[];
  const rd=s=>{ const c=s.planner.checkin||{}; return s.log.form!=null?s.log.form:c.readiness; };
  const last3=L.slice(-3); if(last3.length===3 && last3.every(s=>rd(s)!=null && rd(s)<=2)) out.push('Tagesform 1–2 in den letzten 3 Einheiten');
  const over=s=>s.planner.cap!=null && s.log.exercises.some(e=>e.sets.some(x=>x.rpe!=null && x.rpe>s.planner.cap));
  if(over(L[L.length-1]) && over(L[L.length-2])) out.push('RPE in den letzten 2 Einheiten über der Obergrenze');

  if(pain(L[L.length-1]) && pain(L[L.length-2])) out.push('Beschwerden in den letzten 2 Einheiten');

  const blk=L[L.length-1].planner.blockId; const byEx={};
  loggedSessions().filter(s=>s.planner&&s.planner.blockId===blk).forEach(s=>s.log.exercises.forEach(e=>{ const pe=s.plan.find(p=>p.id===e.planExId); if(!pe||!pe.planner||pe.planner.role!=='main') return;
    const c=e.sets.filter(y=>y.kg!=null&&y.reps>=1&&y.reps<=10).map(y=>y.kg*(1+(y.reps===1?0:y.reps/30))); if(c.length) (byEx[e.name]=byEx[e.name]||[]).push(Math.max(...c)); }));
  Object.entries(byEx).forEach(([n,v])=>{ if(v.length<3) return; const best=Math.max(...v.slice(0,-2)); if(v.slice(-2).every(x=>x<best*0.95)) out.push(n+': geschätztes 1RM 2× mehr als 5 % unter dem Blockbestwert'); });

  const bj=S.tests.filter(t=>/broad jump/i.test(t.name)&&t.value!=null&&t.unit==='cm'); const base=bj.length?Math.max(...bj.map(t=>t.value)):null;
  if(base){ const jumps=[]; L.forEach(s=>s.log.exercises.forEach(e=>{ if(/broad jump/i.test(e.name)){ const h=e.sets.map(x=>x.height).filter(v=>v!=null); if(h.length) jumps.push(Math.max(...h)); } }));
    if(jumps.length && jumps[jumps.length-1]<base*0.95) out.push('Broad Jump mehr als 5 % unter deiner besten Testweite'); }
  return out;
}
function deloadNote(){ const sg=deloadSignals(); if(sg.length<2) return '';

    '<p class="small" style="margin:0">AOS plant die nächsten Einheiten deshalb leichter: ca. 40 % weniger Sätze bei gleichen Lasten, keine Steigerungen. Sobald die Signale weg sind, geht es normal weiter. Gut schlafen und genug essen.</p></div>'; }
const isDone = s=>s.status==='absolviert'||s.status==='teilweise';

/* Welche Einheit ist an diesem Tag fällig? (Spezifikation 5.1) */
function plDue(date){
  const phase=plPhase(date), b=plBlockAt(date);

  if(!b) return r;
  r.week=plWeek(b,date); r.wave=(b.week_wave||{})[r.week]||'';
  const ov=(b.week_overrides||{})[r.week]||null;
  const sched=(ov&&ov.schedule)||b.week_schedule||{};

  const done=mine.filter(s=>isDone(s) && s.planner.week===r.week).map(s=>s.planner.templateId);
  r.remaining=(b.session_order||[]).filter(t=>!skipped.includes(t) && !done.includes(t));
  const sc=plScheduledAt(b,date); const scheduled=sc.tpl; r.changed=sc.changed;
  if(scheduled && (r.remaining.includes(scheduled) || (sc.changed && !done.includes(scheduled)))){ r.tpl=scheduled; r.why=sc.changed?'von dir für diesen Tag geändert':'laut Wochenplan ('+WD_LONG[weekdayOf(date)]+(ov?', '+ov.note:'')+')'; }
  else if(scheduled){ r.tpl=r.remaining[0]||null; r.why=scheduled+' ist diese Woche schon erledigt'+(r.tpl?' → nächste offene Einheit '+r.tpl:'')+'. Verpasstes wird nicht nachgeholt.'; }
  else { r.offday=true; r.tpl=r.remaining[0]||null; r.why=(sc.changed?'Diesen Tag hast du trainingsfrei gesetzt.':'Heute ist laut Wochenplan kein Trainingstag.')+(r.tpl?' Du kannst die nächste offene Einheit ('+r.tpl+') trotzdem starten.':''); }
  if(skipped.length) r.warnings.push('Diese Woche entfällt '+skipped.join(', ')+' (kein Nachholen).');
  // Gleicher Schwerpunkt an aufeinanderfolgenden Tagen (5.1 Punkt 4)
  const t=plTemplate(b, r.tpl); const yest=mine.find(s=>isDone(s) && sessionDate(s)===addDays(date,-1));

  return r;
}

/* ---------- Historie & Lasten ---------- */
function plHistory(dbId, beforeDate){
  const out=[];
  loggedSessions().forEach(s=>{ const d=sessionDate(s); if(beforeDate && d>=beforeDate) return;
    (s.log.exercises||[]).forEach(le=>{ const pe=(s.plan||[]).find(p=>p.id===le.planExId); if(pe&&pe.planner&&pe.planner.dbId===dbId) out.push({ s, pe, le, date:d }); }); });
  return out.sort((a,b)=>a.date<b.date?1:-1);
}
const workSets = le=>(le.sets||[]).filter(x=>x.reps!=null||x.kg!=null);
function topKg(le){ const k=workSets(le).map(x=>x.kg).filter(v=>v!=null); return k.length?Math.max(...k):null; }
function maxRpe(le){ const r=workSets(le).map(x=>x.rpe).filter(v=>v!=null); return r.length?Math.max(...r):null; }
function setsTxt(le){ return workSets(le).map(x=>(x.reps!=null?x.reps:'?')+(x.kg!=null?'×'+fmtNum(x.kg):'')+(x.rpe!=null?' @'+fmtNum(x.rpe):'')).join(', ')||'keine Satzdaten'; }
function repTargets(pe){ // "5/4/4/4" → [5,4,4,4]; "6–8/S" → min 6
  const r=String(pe.reps||''); if(/^\d+(\/\d+)+$/.test(r)) return r.split('/').map(Number);
  const m=repMin(r); return Array.from({length:pe.sets||0}, ()=>m);
}
function allMet(h){ const t=repTargets(h.pe); const ws=workSets(h.le); if(!t.length || t[0]==null) return null;
  if(ws.length<t.length) return false;
  return t.every((n,i)=>ws[i].reps!=null && ws[i].reps>=n && (h.pe.loadKg==null || (ws[i].kg!=null && ws[i].kg>=h.pe.loadKg))); }
function lastDecision(dbId){
  const l=Object.entries(S.suggestionDecisions||{}).filter(([k,d])=>k.startsWith('last|'+dbId+'|') && d.status==='bestätigt' && d.kg!=null).map(([,d])=>d).sort((a,b)=>a.at<b.at?1:-1);
  return l[0]||null;
}
function plInc(id){ const r=(REF.plan.rules||{}).increments_kg||{}; const e=REF.exMap[id]; return r[id] || (e&&e.min_increment_kg) || 2.5; }
const roundDown=(x,inc)=>Math.floor(x/inc+1e-9)*inc;
/* Startgewicht schätzen wie ein Strength Coach: konservativ aus den bestätigten Startlasten der Grundübungen.

const START_EST={ ssb_squat:['high_bar_squat',0.85], hang_power_clean:['high_bar_squat',0.45], trap_bar_shrug:['trap_bar_deadlift',0.7],
  landmine_push_press:['bench_press',0.35], bulgarian_split_squat:['high_bar_squat',0.16], high_step_up:['high_bar_squat',0.14], db_row:['bench_press',0.40],
  db_overhead_press:['bench_press',0.28], farmer_carry:['trap_bar_deadlift',0.35], prone_ytw:['bench_press',0.03], db_lateral_raise:['bench_press',0.12],
  dead_bug:['bench_press',0.12], trap_bar_speed_pull:['trap_bar_deadlift',0.65],
  front_squat:['high_bar_squat',0.8], box_squat:['high_bar_squat',0.85], pause_squat:['high_bar_squat',0.85], conventional_deadlift:['trap_bar_deadlift',0.9],
  pause_bench:['bench_press',0.9], close_grip_bench:['bench_press',0.9], floor_press:['bench_press',0.95], incline_bb_bench:['bench_press',0.8], db_bench_press:['bench_press',0.35], walking_lunge:['high_bar_squat',0.14], reverse_lunge:['high_bar_squat',0.14], lateral_lunge:['high_bar_squat',0.12],
  db_single_leg_rdl:['trap_bar_deadlift',0.16], romanian_deadlift:['trap_bar_deadlift',0.55], pendlay_row:['bench_press',0.7], chest_supported_db_row:['bench_press',0.3],
  suitcase_carry:['trap_bar_deadlift',0.3], farmer_hold:['trap_bar_deadlift',0.35], db_reverse_fly:['bench_press',0.06], db_shrug:['trap_bar_deadlift',0.3],
  trap_bar_jump:['trap_bar_deadlift',0.25], power_clean:['hang_power_clean',1.0], hang_power_clean_bk:['hang_power_clean',0.95],
  clean_pull:['hang_power_clean',1.25], high_pull:['hang_power_clean',1.0], hang_high_pull:['hang_power_clean',1.0], kb_swing:['trap_bar_deadlift',0.2], bb_push_press:['bench_press',0.6], db_push_press_single_arm:['bench_press',0.25], landmine_press:['bench_press',0.3],
  landmine_rotation:['bench_press',0.2], incline_db_press:['bench_press',0.3], neck_plate_isometric:['bench_press',0.07], bench_press:['high_bar_squat',0.65], high_bar_squat:['trap_bar_deadlift',0.85], trap_bar_deadlift:['high_bar_squat',1.15] };
const perHand=id=>{ const e=REF.exMap[id]; return !!(e && (e.equipment||[]).includes('dumbbell') && !(e.equipment||[]).includes('barbell')); };
function plStartEst(exId, block, date){ const r=START_EST[exId]; if(!r) return null; const [ref,f]=r;
  let base=(block.start_loads||{})[ref];
  const h=plHistory(ref, date)[0]; if(h && topKg(h.le)!=null) base=topKg(h.le);

  if(base==null) return null; const inc=plInc(exId); const kg=Math.max(inc, roundDown(base*f, inc));

/* e1RM (Spezifikation 6.4): RPE-Tabelle über Wdh + Wdh in Reserve. Es zählt der höchste Wert der letzten 3 Einheiten, nur Sätze mit RPE ≥ 6. */
const RPE_PCT=[1,0.955,0.922,0.892,0.863,0.837,0.811,0.786,0.762,0.739,0.707,0.68,0.653,0.626,0.6];

function plE1RM(exId, beforeDate){ const H=plHistory(exId, beforeDate).slice(0,3); let best=null;
  H.forEach(h=>workSets(h.le).forEach(x=>{ if(x.kg==null||x.reps==null||x.rpe==null||x.rpe<6||x.reps<1||x.reps>12) return;
    const e=x.kg/pctRM(x.reps,x.rpe); if(!best||e>best.kg) best={ kg:e, date:h.date, set:x }; }));

/* Ohne Trainingsprotokoll: geschätztes 1RM aus dem letzten passenden Krafttest (Wdh + RPE; ohne RPE gilt 9).
