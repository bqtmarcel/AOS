const TEST_LIFT={ high_bar_squat:/kniebeuge|squat/i, bench_press:/bankdr|bench/i, trap_bar_deadlift:/kreuzheben|deadlift/i };
function plTestE1RM(exId, beforeDate){ const rx=TEST_LIFT[exId]; if(!rx || typeof S==='undefined' || !S) return null;
  const L=(S.tests||[]).filter(t=>t.unit==='kg' && t.value!=null && t.date && t.date<=beforeDate && t.reps>=1 && t.reps<=12 && rx.test(t.name) && !/front|ssb|box|pause|sumo|rumän|romanian/i.test(t.name))
    .sort((a,b)=>a.date<b.date?1:-1); const t=L[0]; if(!t) return null;
  const old=daysBetween(t.date, beforeDate)>21; const kg=t.value/pctRM(t.reps, t.rpe!=null?t.rpe:9)*(old?0.95:1);
  return { kg, date:t.date, test:t.name, old }; }

/* Last für einen Slot (Spezifikation 3.4, 6.3) */
function plLoad(slot, exId, ctx){
  const out={ kg:null, text:'', reasons:[], suggest:null, calibrate:false, decrease:false };
  const m=slot.method, inc=plInc(exId), cap=ctx.cap;
  const weighted=['rpe_linear','wave','velocity','double','load_distance','load_time','reps_load'].includes(m);
  if(!weighted){ out.text='Körpergewicht'; return out; }
  const H=plHistory(exId, ctx.date); const last=H[0]; const dec=lastDecision(exId);
  // Wochenwelle: Last aus e1RM und Ziel-RPE der Woche (6.4)
  if(m==='wave' && ctx.reps!=null){ let e=plE1RM(exId, ctx.date)||plTestE1RM(exId, ctx.date);
    if(!e && START_EST[exId]){ const [ref,f]=START_EST[exId]; const b0=plE1RM(ref, ctx.date)||plTestE1RM(ref, ctx.date); if(b0) e={ kg:b0.kg*f, date:b0.date, set:b0.set, test:b0.test, old:b0.old, from:(REF.exMap[ref]||{}).name_de||ref, f }; } const trpe=(slot.rpe_wave||{})[ctx.week]!=null ? slot.rpe_wave[ctx.week] : cap;
    if(e && trpe!=null){ let kg=roundDown(e.kg*pctRM(ctx.reps, trpe), inc); const lastTop=last?topKg(last.le):null;
      out.reasons.push('Wochenwelle: '+ctx.reps+' Wdh @ RPE '+fmtNum(trpe)+' ≈ '+Math.round(pctRM(ctx.reps,trpe)*100)+' % vom geschätzten 1RM '+fmtNum(Math.round(e.kg*2)/2)+' kg'+(e.from?' (abgeleitet: '+e.from+' × '+fmtNum(e.f)+', ':' (')+(e.test?'Test „'+e.test+'“ vom '+fmtDate(e.date)+(e.old?', −5 %, weil älter als 3 Wochen':''):fmtDate(e.date)+': '+fmtNum(e.set.kg)+' kg × '+e.set.reps+' @'+fmtNum(e.set.rpe))+').');
      if(ctx.noIncrease && lastTop!=null && kg>lastTop){ kg=lastTop; out.reasons.push('Heute keine höhere Last als zuletzt ('+ctx.noIncrease+').'); }
      out.kg=kg;
      if(ctx.readiness===2 && slot.role==='main'){ const k=roundDown(kg*0.95, inc); if(k<kg){ out.kg=k; out.decrease=true; out.reasons.push('Readiness 2 → Hauptlast ca. −5 %.'); } }

  if(decAfterLast){ base=dec.kg; out.reasons.push('Steigerung auf '+fmtNum(dec.kg)+' kg bestätigt am '+fmtDate(dec.at.slice(0,10))+'.'); }

  if(base==null && start!=null){ base=start; out.reasons.push('Bestätigte Startlast.'); }
  if(base==null){ const est=plStartEst(exId, ctx.block, ctx.date);
    if(est){ base=est.kg; out.kg=base; out.reasons.push('Startgewicht von AOS festgelegt (abgeleitet aus '+est.ref+'). Nach dieser Einheit passt AOS die Last selbst an.'); return out; } }

    out.reasons.push(slot.rpe&&/6/.test(slot.rpe) ? 'Noch kein Wert: leicht einsteigen und bis RPE ≤ 6 steigern, jede Wdh schnell. Arbeitsgewicht notieren.' : 'Noch kein Wert: aufwärmen bis Ziel-RPE ~7, Arbeitsgewicht notieren.');

      else if(met && r<=cap-0.5){ if(noUp) out.reasons.push('Steigerung wäre möglich, heute aber nicht ('+noUp+').');

      else if(last.le.fast===false) out.reasons.push('Letztes Mal nicht alle Wdh schnell → halten.');

}

const EQUIP_LABEL={ barbell:'Langhantel', rack:'Rack', ssb:'Safety Squat Bar', trap_bar:'Trap Bar', dumbbell:'Kurzhanteln', kettlebell:'Kettlebell', bench:'Bank', box:'Box',

function metricOf(ex, slot){ if(ex.pattern==='jump'||ex.pattern==='jump_loaded') return ex.pattern==='jump_loaded'?'kraft':'sprung';
  if(/ m$/.test(slot.doseTxt||'')) return 'distanz'; if(/ s(\/S)?$/.test(slot.doseTxt||'')) return 'zeit'; return 'kraft'; }
function repsNum(txt){ const m=String(txt).match(/\d+/); return m?Number(m[0]):0; }
function perSide(txt){ return /\/S$/.test(String(txt)); }
function slotSec(x){ const work = x.role==='power'?15:(x.role==='main'?45:40); const per=perSide(x.reps)?2:1;
  const ramp = (x.role==='main' && x.method!=='bodyweight_reps') ? 240 : (x.method==='velocity' ? 180 : 0);   // Aufwärmsätze vor Hauptübungen und Gewichtheber-Übungen
  return x.sets*work*per + Math.max(0,x.sets-1)*((x.rest[0]+x.rest[1])/2) + 120 + ramp; }   // + Umbau/Wechsel
function contactsOf(x){ const e=REF.exMap[x.dbId]; const c=e?e.contacts_per_rep:0; return c? x.sets*repsNum(x.reps)*(perSide(x.reps)?2:1)*c : 0; }

function plBuild(inp){
  const due=plDue(inp.date); const b=due.block;
  const nx=!b ? plCurrentBlock(inp.date) : null; const nf=nx?plFirstSession(nx):null;
  if(!b || !inp.tpl) return { due, items:[], dropped:[], notes:[], error: !b ? (due.phase ? 'Für '+due.phase.name+' konnte AOS noch keinen Block planen (Übungsdatenbank noch nicht geladen).'
      : (nx ? '„'+nx.name+'“ startet am '+WD_LONG[weekdayOf(nx.start)]+', '+fmtDate(nx.start)+(nf?'. Erste Einheit: '+nf.tpl+' am '+WD_LONG[weekdayOf(nf.date)]+', '+fmtDate(nf.date)+' – stell oben das Datum um, um sie vorab anzusehen.':'.') : 'Für dieses Datum gibt es keinen Block im Plan.')) : 'In dieser Woche ist keine Einheit mehr offen.' };
  const t=plTemplate(b, inp.tpl); const week=due.week; const cap=plCap(b);
  const rules=REF.plan.rules||{}; const thr=rules.pain_threshold||3;
  const pain=inp.pain||0, regions=inp.regions||[], rd=inp.readiness;
  const painOn = pain>=thr;
  const legPain = painOn && regions.some(r=>(rules.leg_regions||[]).includes(r));
  const notes=[], dropped=[], items=[];
  const fieldToday=fieldActive(inp.date); const fc=fieldCfg();
  const ydLog=fieldLog(addDays(inp.date,-1)); const fieldYest=fieldHard(ydLog);
  if(fieldToday) notes.push('Heute '+(fc.time||'')+' '+(fc.name||'Feldtraining')+' (ca. '+(fc.duration_min||90)+' min): Power/Sprünge und Zusatzübungen je −1 Satz, optionale Übungen entfallen, Hauptübungen ab 4 Sätzen −1 Satz.');
  if(fieldYest) notes.push('Gestern hartes Feldtraining ('+fieldSummary(ydLog).replace('✓ ','')+'): intensive Sprünge entfallen heute.');
  const locObj=inp.loc?locById(inp.loc):null; const locR=locObj?locParse(locObj.text):null;
  if(locObj && locR && !locR.empty) notes.push('Ort '+locObj.name+': '+locSummary(locObj)+'. Übungen, die dort nicht gehen, werden ersetzt oder weggelassen.');
  const dlSig = inp.date>=todayISO() ? deloadSignals() : []; const deload = dlSig.length>=2;
  const noIncrease = painOn ? 'Beschwerden '+pain+'/10' : (rd!=null && rd<=2 ? 'Readiness '+rd : (deload ? 'automatische Entlastung' : ''));
  if(deload) notes.push('Automatische Entlastung (Erholungssignale: '+dlSig.join('; ')+'): ca. 40 % weniger Sätze, keine Steigerungen. Sobald die Signale weg sind, geht es normal weiter.');
  ((b.week_notes||{})[week]||[]).forEach(n=>notes.push(n));
  if(rd===1) notes.push('Readiness 1: Empfehlung ist eine Recovery-/Technik-Einheit oder Pause. Falls du trotzdem trainierst, ist die Einheit unten stark reduziert.');
  if(painOn) notes.push('Beschwerden '+pain+'/10'+(regions.length?' ('+regions.map(r=>REGION_LABEL[r]||r).join(', ')+')':'')+': Übungen, die diese Region belasten, werden ersetzt oder weggelassen. Keine Steigerungen. AOS stellt keine Diagnose.');
  const recentUse = slotId=>{ const s=plSessions().filter(x=>x.planner.blockId===b.id && isDone(x) && sessionDate(x)<inp.date).sort((a,c)=>sessionDate(a)<sessionDate(c)?1:-1);
    for(const x of s){ const pe=(x.plan||[]).find(p=>p.planner&&p.planner.slotId===slotId); if(pe) return pe.planner.dbId; } return null; };

  const fr=(REF.plan.rules||{}).frequency; let slots=t.slots.slice(); let merged=[];
  if(fr){ const wp=plWeekPlan(b, week); const from=wp.hosts[t.id]||[];
    from.forEach(m=>plMergeSlots(b, week, plTemplate(b,m).slots).forEach(sl=>{
      const ex=REF.exMap[sl.candidates[0]];
      const dup=slots.concat(merged).some(x=>x.candidates[0]===sl.candidates[0] || (x.role==='main' && sl.role==='main' && ex && REF.exMap[x.candidates[0]] && REF.exMap[x.candidates[0]].pattern===ex.pattern));
      if(!dup) merged.push(Object.assign({}, sl, { from:m })); }));
    if(merged.length){
      const src=[...new Set(merged.map(x=>x.from))].join(', ');
      slots=slots.filter(sl=>{ if((sl.prio||0)>=(fr.drop_host_priority||3) && (sl.dose||{})[week]){ dropped.push({ slot:sl, why:'Platz für Kernübungen aus '+src }); return false; } return true; });
      const rank={ power:0, main:1, assistance:2, optional:3 };
      slots=slots.concat(merged).sort((a,z)=>(rank[a.role]??9)-(rank[z.role]??9));
      notes.push('Diese Woche '+wp.count+' Einheiten: Das Wichtigste aus '+src+' ist hier eingebaut ('+merged.map(x=>(REF.exMap[x.candidates[0]]||{}).name_de).join(', ')+').');
    } }
  slots.forEach(slot=>{
    const d=(slot.dose||{})[week]; if(!d){ return; }
    if(slot.role==='optional' && fieldToday){ dropped.push({ slot, why:'optional – heute abends Feldtraining' }); return; }
    if(slot.role==='optional' && !(rd==null || rd>=4)){ dropped.push({ slot, why:'optional – nur bei Readiness 4–5' }); return; }
    // Kandidaten: Ausstattung, Beschwerden, Kontinuität (5.2)
    let cands=slot.candidates.map(id=>REF.exMap[id]).filter(Boolean);
    // Ersatzübungen aus der Datenbank nur nachrangig (greifen, wenn der Ort die geplanten Übungen ausschließt)
    if(locR && !locR.empty){ const ids=new Set(cands.map(e=>e.id)); cands.slice().forEach(e=>(e.substitutes||[]).forEach(id=>{ const x=REF.exMap[id]; if(x && !ids.has(id) && (!x.phases || !due.phase || x.phases.includes(due.phase.id))){ ids.add(id); cands.push(x); } })); }
    const filt=[], skipWhy=[];
    cands.forEach(e=>{
      const lb=locBlocks(e, locR); if(lb){ if(slot.candidates.includes(e.id)) skipWhy.push(e.name_de+': '+lb+' ('+locObj.name+')'); return; }
      const miss=(e.equipment||[]).filter(q=>(inp.noEquip||[]).includes(q));
      if(miss.length){ skipWhy.push(e.name_de+': '+miss.map(q=>EQUIP_LABEL[q]||q).join(', ')+' nicht verfügbar'); return; }
      const hit=painOn ? (e.regions||[]).filter(r=>regions.includes(r)) : [];
      if(hit.length){ skipWhy.push(e.name_de+' belastet '+hit.map(r=>REGION_LABEL[r]||r).join(', ')); return; }
      if(fieldYest && (e.pattern==='jump'||e.pattern==='jump_loaded')){ skipWhy.push(e.name_de+': gestern hartes Feldtraining'); return; }
      if(legPain && (e.pattern==='jump'||e.pattern==='jump_loaded')){ skipWhy.push(e.name_de+': intensive Sprünge entfallen bei Beschwerden in Bein/Hüfte/Leiste'); return; }
      filt.push(e);
    });
    if(!filt.length){ dropped.push({ slot, why: skipWhy.join('; ')||'keine passende Übung' }); return; }
    const prev=recentUse(slot.id);
    const ex = (prev && filt.find(e=>e.id===prev)) || filt[0];
    const reasons=[];
    if(ex.id!==slot.candidates[0]) reasons.push('Ersatz für '+(REF.exMap[slot.candidates[0]]?REF.exMap[slot.candidates[0]].name_de:slot.candidates[0])+(skipWhy.length?' ('+skipWhy.join('; ')+')':' (im Block bisher so gemacht)')+'.');
    let sets=d[0], reps=d[1];
    if(slot.from) reasons.unshift('Aus '+slot.from+' übernommen (diese Woche weniger Einheiten).');
    const x={ slot, from:slot.from||null, slotId:slot.id, dbId:ex.id, ex, role:slot.role, method:slot.method, sets, reps, rest:slot.rest||[60,90], rpe:((slot.rpe_wave||{})[week]!=null ? fmtNum(slot.rpe_wave[week]) : (slot.rpe||'')), reasons, note:slot.note||'', alternatives: filt.filter(e=>e.id!==ex.id).map(e=>e.name_de) };
    // Readiness (7)
    if(fieldToday){ const lim = x.role==='main' ? 4 : 2;
      if(['power','assistance','main'].includes(x.role) && x.sets>=lim){ x.sets--; reasons.push('Abends Feldtraining → 1 Satz weniger.'); } }
    if(rd!=null && rd<=3 && x.role==='assistance' && x.sets>1){ x.sets--; reasons.push('Readiness '+rd+' → 1 Satz weniger.'); }
    if(rd!=null && rd<=2 && x.role==='power'){ const n=Math.max(1, Math.round(x.sets*0.75)); if(n<x.sets){ reasons.push('Readiness '+rd+' → Power-Volumen ca. −25 % ('+x.sets+' → '+n+' Sätze).'); x.sets=n; } }
    if(slot.grip && inp.grip && x.sets>1){ x.sets--; reasons.push('Griff ermüdet → 1 Satz weniger.'); }
    // Last
    const L=plLoad(slot, ex.id, { date:inp.date, cap, block:b, readiness:rd, noIncrease, week, reps:repMin(String(reps)) });
    x.load=L; x.loadKg=L.kg; L.reasons.forEach(r=>reasons.push(r));
    if(L.suggest){ x.loadKg=L.suggest.kg; x.increased=true; if(L.suggest.resetReps) x.reps=String(x.reps).replace(/^\d+(–\d+)?/, String(L.suggest.resetReps));
      reasons.push('Steigerung auf '+fmtNum(L.suggest.kg)+' kg (+'+fmtNum(L.suggest.kg-L.kg)+')'+(/deutlich leichter/.test(L.suggest.basis)?' – letzte Einheit deutlich leichter als geplant, doppelter Schritt':' – Vorgabe letztes Mal sauber geschafft')+'.'); }
    x.perHand=perHand(ex.id);
    items.push(x);
  });

  if(deload) items.forEach(x=>{ const n=Math.max(1, Math.round(x.sets*0.6)); if(n<x.sets){ x.reasons.push('Automatische Entlastung → '+x.sets+' → '+n+' Sätze.'); x.sets=n; } });
  // Kontakte gegen Blocklimit (6.5) – autonom kürzen
  const lim=((b.limits||{}).contacts_per_session||[])[1];
  const cSum=()=>items.reduce((a,x)=>a+contactsOf(x),0);
  if(lim){ for(let i=items.length-1; i>=0 && cSum()>lim; i--){ const x=items[i]; while(contactsOf(x)>0 && x.sets>1 && cSum()>lim){ x.sets--; x.reasons.push('Bodenkontakte über dem Blocklimit '+lim+' → 1 Satz weniger.'); } } }

  // Zeitbudget (8)
  const limitMin=Math.min(inp.avail||rules.max_session_min||65, rules.max_session_min||65);
  const est=()=>Math.round((rules.warmup_min||7) + items.reduce((a,x)=>a+slotSec(x),0)/60);
  if(est()>limitMin){
    const steps=[];
    for(let i=items.length-1;i>=0 && est()>limitMin;i--) if(items[i].role==='optional'){ dropped.push({slot:items[i].slot, why:'Zeitbudget'}); items.splice(i,1); steps.push('optionale Übung gestrichen'); }
    if(est()>limitMin){ let any=false; items.forEach(x=>{ if(x.role==='assistance' && x.sets>1){ x.sets--; x.reasons.push('Zeitbudget → 1 Satz weniger.'); any=true; } }); if(any) steps.push('Ergänzung −1 Satz'); }
    for(let i=items.length-1;i>=0 && est()>limitMin;i--) if(items[i].role==='assistance'){ dropped.push({slot:items[i].slot, why:'Zeitbudget'}); steps.push(items[i].ex.name_de+' gestrichen'); items.splice(i,1); }
    const firstPower=items.findIndex(x=>x.role==='power');
    if(est()>limitMin) items.forEach((x,i)=>{ if(x.role==='power' && x.sets>1 && est()>limitMin){ x.sets--; x.reasons.push('Zeitbudget → 1 Satz weniger.'); } });
    notes.push('Zeit: '+limitMin+' min verfügbar → gekürzt ('+(steps.join(', ')||'Sätze reduziert')+'). Hauptübungen'+(firstPower>=0?' und der erste Power-Block':'')+' bleiben'+(est()>limitMin?', deshalb dauert die Einheit trotzdem ca. '+est()+' min':'')+'.');
  }
  // Validierung (9)
  const valid=[];
  if(lim && cSum()>lim) valid.push('Bodenkontakte '+cSum()+' über dem Limit '+lim+'.');
  items.forEach(x=>{ const m=String(x.rpe).match(/[\d,]+(?=\s*$)/); if(m && num(m[0])>cap) valid.push(x.ex.name_de+': Ziel-RPE über dem Cap.'); });
  return { due, tpl:t, block:b, week, cap, items, dropped, notes, valid, contacts:cSum(), estMin:est(), limitMin, inp };
}

/* Plan → Einheit im App-Format (Snapshot inkl. Eingaben und Begründungen, Spezifikation 10) */
function plToSession(P){
  const b=P.block, t=P.tpl, date=P.inp.date;
  const plan=P.items.map(x=>({
    id:uid('ex'), name:x.ex.name_de, variant:'', sets:x.sets, reps:x.reps, loadKg:x.loadKg,
    loadNote: x.load.calibrate ? 'kalibrieren' : (x.loadKg==null ? (x.load.text||'') : (x.perHand?'je Hand':'')),
    rpeTarget:x.rpe, rest:x.rest[0]===x.rest[1] ? x.rest[0]+' s' : x.rest[0]+'–'+x.rest[1]+' s',
    metric:metricOf(x.ex, Object.assign({doseTxt:x.reps}, x.slot)), positionTag:'allgemein', equipment:[], alternatives:x.alternatives.map(n=>({name:n, note:''})),
    notes:[x.note].concat(x.reasons).filter(Boolean).join(' '),
    planner:{ dbId:x.dbId, slotId:x.slotId, method:x.method, role:x.role, fastCheck:x.method==='velocity', range:x.slot.range||null }
  }));
  return { id:uid('ses'), blockId:b.id, dayId:null, name:t.id+' – '+t.name, focus:t.goal||'', plannedDate:date, week:mondayOf(date),
    status:'geplant', location:'', plan, dayVersion:null, log:null, skipReason:'', moves:[], createdAt:new Date().toISOString(),
    planner:{ planVersion:REF.plan.version, blockId:b.id, phase:P.due.phase?P.due.phase.id:null, week:P.week, wave:P.due.wave, templateId:t.id, cap:P.cap,
      checkin:{ readiness:P.inp.readiness, sleep:P.inp.sleep, pain:P.inp.pain, regions:P.inp.regions, avail:P.inp.avail, grip:!!P.inp.grip, noEquip:P.inp.noEquip, loc:P.inp.loc||null, locName:(P.inp.loc&&locById(P.inp.loc)||{}).name||null },
      notes:P.notes, merged:P.items.filter(x=>x.from).map(x=>x.slotId), dropped:P.dropped.map(d=>({ slot:d.slot.id, why:d.why })), contacts:P.contacts, estMin:P.estMin, generatedAt:new Date().toISOString() } };
}

/* ---------- Sessionplaner: Oberfläche ---------- */
function plDefaults(){ return { date:todayISO(), readiness:null, sleep:null, pain:0, regions:[], avail:null, grip:false, noEquip:[], accept:{}, tpl:null, loc:null }; }
function plInput(){ const p=ui.pl; const due=plDue(p.date); const loc=p.loc && locById(p.loc) ? p.loc : locDefault(p.date); return Object.assign({}, p, { tpl: p.tpl && due.block && plTemplate(due.block,p.tpl) ? p.tpl : due.tpl, loc }); }
function chipBtn(act, k, v, label, on){ return '<button class="chip" data-act="'+act+'" data-k="'+k+'" data-v="'+esc(v)+'" aria-pressed="'+(on?'true':'false')+'">'+esc(label)+'</button>'; }


function plPreview(P){
  if(P.error) return '<div class="note">'+esc(P.error)+'</div>';
  const b=P.block;
  let h='<div class="section"><div class="row between"><span class="small muted">ca. '+P.estMin+' min inkl. Aufwärmen'+(P.contacts?' · '+P.contacts+' Bodenkontakte':'')+'</span><span class="cap">RPE ≤ '+fmtNum(P.cap)+'</span></div>';
  P.notes.forEach(n=>{ h+='<div class="note small">'+esc(n)+'</div>'; });
  P.items.forEach((x,i)=>{
    const load = x.loadKg!=null ? fmtNum(x.loadKg)+' kg'+(x.perHand?' je Hand':'')+(x.increased?' ↑':'') : (x.load.calibrate?'kalibrieren':(x.load.text||''));
    h+='<div class="ex"><div class="ex-head"><span class="ex-name">'+(i+1)+'. '+esc(x.ex.name_de)+'</span>'+(x.from?badge('aus '+x.from,'warn')+' ':'')+badge(ROLE_LABEL[x.role]||x.role, x.role==='main'?'ok':(x.role==='power'?'info':''))+'</div>';
    h+='<div><strong>'+x.sets+' × '+esc(x.reps)+'</strong>'+(load?' · '+esc(load):'')+(x.rpe?' · RPE '+esc(x.rpe):'')+' · Pause '+(x.rest[0]===x.rest[1]?x.rest[0]:x.rest[0]+'–'+x.rest[1])+' s</div>';
    // Wichtiges direkt zeigen (Anleitung, Ersatz, Reduktion), Herkunft der Last nur auf Nachfrage
    const info=r=>/^(Letzte Einheit|Bestätigte Startlast|Startgewicht von AOS|Steigerung auf .* bestätigt)/.test(r);
    const main=[x.note].concat(x.reasons.filter(r=>!info(r))).filter(Boolean), more=x.reasons.filter(info);
    if(main.length) h+='<div class="small muted">'+main.map(esc).join(' ')+'</div>';
    if(more.length || x.alternatives.length) h+='<details><summary class="small muted">Details</summary><div class="small muted">'+more.map(esc).join(' ')+(x.alternatives.length?' Ersatz möglich: '+esc(x.alternatives.join(' / '))+'.':'')+'</div></details>';
    h+='</div>';
  });
  if(P.dropped.length) h+='<p class="small"><strong>Weggelassen:</strong> '+P.dropped.map(d=>esc((REF.exMap[d.slot.candidates[0]]||{}).name_de||d.slot.id)+' ('+esc(d.why)+')').join('; ')+'</p>';
  P.valid.forEach(v=>{ h+='<div class="note bad small">'+esc(v)+'</div>'; });
  h+='<div class="row" style="margin-top:12px"><button class="primary ph" data-act="plTake" aria-label="Einheit starten">PLAY HARD<small>Einheit starten</small></button></div>';
  return h+'</div>';
}

CHG.plIn = el=>{ const p=ui.pl; const d=val('pl-date');
  if(el && el.id==='pl-date'){ if(d && d!==p.date){ p.date=d; p.tpl=null; p.accept={}; } }
  else { const t=document.getElementById('pl-tpl'); if(el && el.id==='pl-tpl' && t){ p.tpl=t.value; p.accept={}; } }
  const sl=num(val('pl-sleep')); p.sleep=sl; const av=num(val('pl-avail')); p.avail=av&&av>0?Math.round(av):null;
  const pa=document.getElementById('pl-pain'); if(pa){ p.pain=Number(pa.value)||0; if(!p.pain) p.regions=[]; }
  render(); };
ACT.plChip = el=>{ const p=ui.pl, k=el.dataset.k, v=el.dataset.v;
  if(k==='readiness') p.readiness=Number(v);
  else if(k==='painLvl'){ p.pain=Number(v); if(!p.pain) p.regions=[]; }
  else if(k==='grip') p.grip=!p.grip;
  else if(k==='loc'){ p.loc=v; p.accept={}; S.settings.lastLocId=v; save(); }
  else { const a=p[k]; const i=a.indexOf(v); if(i>=0) a.splice(i,1); else a.push(v); }
  render(); };
ACT.plDate = el=>{ ui.pl=ui.pl||plDefaults(); ui.pl.date=el.dataset.d; ui.pl.tpl=null; ui.pl.accept={}; render(); window.scrollTo(0,0); };
ACT.plShowBlock = el=>{ const id=el.dataset.id; ui.planBlock = ui.planBlock===id ? null : id; render(); const x=ui.planBlock&&document.getElementById('plan-block'); if(x) x.scrollIntoView(); };
ACT.plReload = async ()=>{ const ok=await refLoad(true); toast(ok?'Planerdaten aktualisiert.':(REF.error||'Keine Verbindung – es wird der zuletzt geladene Stand verwendet.')); render(); };

function plCommit(){
  const P=plBuild(plInput()); if(P.error || !P.items.length){ toast(P.error||'Keine Übungen in dieser Einheit.'); return null; }
  if(P.due.doneToday && P.due.doneToday.planner && P.due.doneToday.planner.templateId!==P.tpl.id && P.inp.date===P.due.doneToday.plannedDate){ toast('Für diesen Tag ist schon eine Einheit erledigt – höchstens eine Einheit pro Tag.'); return null; }
  const s=plToSession(P);
  // Bestehende, noch nicht protokollierte Einheit desselben Tages ersetzen (Planer-Einheit oder leerer Platzhalter)
  const old=S.sessions.find(o=>o.status==='geplant' && !o.log && o.plannedDate===P.inp.date && (o.planner || !(o.plan||[]).length));
  if(old){ s.id=old.id; s.createdAt=old.createdAt; S.sessions[S.sessions.indexOf(old)]=s; } else S.sessions.push(s);
  ui.pl.accept={}; save(); return s;
}
ACT.plTake = ()=>{ const s=plCommit(); if(s){ toast('Einheit angelegt.'); startLog(s.id); } };


'use strict';
/* ===== AOS – Ernährung (Spezifikation Nutrition v11) =====
   Persönliche Ernährungsdaten (planner/nutrition.json), Lebensmittel- und Rezeptdatenbank kommen aus dem privaten Datenrepo.
   Gespeichert werden nur deine Eingaben: Mahlzeiten (nutrition.meals, Format v2), Tageseinstellungen (nutrition.dayOverrides),
   Bewertungen und eigene Lebensmittel (nutrition.items). Keine Bewertung von Essen, Abweichungen werden neutral angezeigt. */

const NUT = ()=>REF.nut;
const MAC = { P:'protein_g', K:'carbs_g', F:'fat_g' };
const r5 = x=>Math.round(x/5)*5;
const r10 = x=>Math.round(x/10)*10;
const fmtK = n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');

function nutDayCfg(date){ const v=(S.nutrition.dayOverrides||{})[date]; return (v && typeof v==='object') ? v : {}; }
function nutSetDay(date, patch){ const o=Object.assign({}, nutDayCfg(date), patch); Object.keys(o).forEach(k=>{ if(o[k]==null) delete o[k]; }); S.nutrition.dayOverrides[date]=o; }

/* ---------- Lebensmittel ---------- */
function nutPrefs(){ const m={}; (S.nutrition.items||[]).forEach(i=>{ if(i.ref) m[i.ref]=i; }); return m; }
function nutFoods(all){
  const pr=nutPrefs();
  const db=((REF.food&&REF.food.foods)||[]).map(f=>Object.assign({}, f, pr[f.id]?{ user_rating:pr[f.id].rating, active:pr[f.id].active!==false }:{}));
  const own=(S.nutrition.items||[]).filter(i=>i.custom).map(i=>Object.assign({ tags:[], grams_per_block:{}, active:true }, i));
  return db.concat(own).filter(f=>all || (f.active!==false && f.user_rating!==1));
}
function nutFood(id){ return nutFoods(true).find(f=>f.id===id) || null; }
const isPortion = f=>f && f.per==='Portion';
function itemMac(it){ const f=nutFood(it.food); if(!f || it.g==null) return { P:0, K:0, F:0, kcal:0 };
  const k = isPortion(f) ? it.g : it.g/100;

/* Abdeckung: alles, was für den Tag eingetragen ist, gegen das Tagesziel */
function nutDayItems(date,T){ const out=[]; nutMealPlan(T||nutTargets(date)).forEach(({slot})=>{ const m=nutMeal(date,slot.id); if(m) m.items.forEach(i=>out.push(i)); }); return out; }
function macroBars(day,T,compact){

    const note= ok ? '✓' : over ? '+'+fmtK(-rest)+u : 'noch '+fmtK(rest)+u;
    return '<div class="mb-row'+(over?' over':ok?' ok':'')+'"><span class="mb-l">'+lbl+'</span><span class="mb-v"><b>'+fmtK(a)+'</b> / '+fmtK(b)+u+'</span>'+

function sumMac(items){ return items.reduce((a,it)=>{ const m=itemMac(it); a.P+=m.P; a.K+=m.K; a.F+=m.F; a.kcal+=m.kcal; return a; }, { P:0, K:0, F:0, kcal:0 }); }
/* Mengen-Einheiten: intern immer Gramm bzw. ml (it.g); Stück nur als Anzeige/Eingabe über piece_g */
function nutUnits(f){ if(!f) return [['g','g']]; if(isPortion(f)) return [['port','Port.']];
  const u=[]; if(f.piece_g) u.push(['stk', f.piece_label||'Stück']);
  if(/ml/.test(f.per)) u.push(['ml','ml'],['g','g']); else u.push(['g','g']); return u; }
function itemUnit(it,f){ f=f||nutFood(it.food); const us=nutUnits(f).map(x=>x[0]); return us.includes(it.unit) ? it.unit : (us.includes('ml')?'ml':us.includes('port')?'port':'g'); }
function unitDefault(f){ const us=nutUnits(f).map(x=>x[0]); if(us.includes('port')) return 'port';

  if(us.includes('stk') && !['fleisch_fisch','gemuese','beilage','fett','suess','sauce','fruehstueck'].includes(f.category) && !['Handvoll','EL','TL','Schale'].includes(f.piece_label)) return 'stk';
  return us.includes('ml')?'ml':'g'; }
function itemQty(it,f){ f=f||nutFood(it.food); if(it.g==null) return null; return itemUnit(it,f)==='stk' && f.piece_g ? Math.round(it.g/f.piece_g*100)/100 : it.g; }
function qtyToG(v,unit,f){ return unit==='stk' && f && f.piece_g ? v*f.piece_g : v; }

  const u=itemUnit(it,f); if(u==='stk') return fmtNum(itemQty(it,f))+' '+unitLbl(u,f)+' ('+fmtNum(Math.round(it.g))+(/ml/.test(f.per)?' ml':' g')+')';

/* Mengenrechner (6.6): feste Einträge abziehen, dann KH-, P-, F-Lebensmittel auf das Restziel skalieren, mehrere Durchgänge, runden */
const NUT_SIDE_CATS=['obst','gemuese','suess','getraenk','sauce','kantine'];   // Beilagen-Kategorien: Standardportion statt Hochrechnen
function nutCalc(items, T){
  const scalable = it=>{ const f=nutFood(it.food); return f && ['P','K','F'].includes(f.main_block) && !NUT_SIDE_CATS.includes(f.category); };
  const grp = it=>{ const f=nutFood(it.food); if(!f) return null;
    if(scalable(it)) return f.main_block;
    // Obst, Süßes usw. nur hochrechnen, wenn sie die einzige Quelle dieses Makros in der Mahlzeit sind
    return items.some(o=>o!==it && scalable(o) && nutFood(o.food).main_block===f.main_block) ? 'side' : f.main_block; };
  const free = items.filter(it=>!it.fixed && ['P','K','F'].includes(grp(it)));
  items.forEach(it=>{ const f=nutFood(it.food); if(!f) return;
    if(!it.fixed && !['P','K','F'].includes(grp(it))) it.g = isPortion(f) ? (it.g||1) : (it.g!=null && it.g>0 && it.g<=(f.default_portion_g||100)*3 ? it.g : (f.default_portion_g||100)); });
  free.forEach(it=>{ it.g=0; });
  for(let pass=0; pass<3; pass++){
    ['K','P','F'].forEach(m=>{
      const mine=free.filter(it=>grp(it)===m); if(!mine.length) return;
      const have=items.filter(it=>!mine.includes(it)).reduce((a,it)=>a+itemMac(it)[m],0);
      const need=Math.max(0, T[m]-have);
      mine.forEach(it=>{ const f=nutFood(it.food); const per=(f[MAC[m]]||0)/(isPortion(f)?1:100); it.g = per>0 ? need/mine.length/per : 0; });
    });
  }
  free.forEach(it=>{ const f=nutFood(it.food);
    if(itemUnit(it,f)==='stk' && f.piece_g){ const step=f.piece_g>=100?0.5:1; it.g=Math.max(step, Math.round(it.g/f.piece_g/step)*step)*f.piece_g; return; }
    it.g = isPortion(f) ? Math.max(0.5, Math.round(it.g*2)/2) : Math.max(5, r5(it.g)); });
  return items;
}

/* ---------- Tagestyp, Gewicht, Ziele (4, 5, 6.4) ---------- */
/* ---------- Automatische Kalorienanpassung (Spezifikation 4.4) – AOS entscheidet selbst, wöchentlich montags ----------
   Gewicht ist die Leitplanke (7-Tage-Schnitt), Leistung entscheidet mit. Nach jeder Änderung 14 Tage Pause.
   Anpassung immer über Kohlenhydrate: +30 g ≈ +120 kcal, −25 g ≈ −100 kcal. */
function bwAvg(date){ const w=S.bodyweight.filter(b=>b.date && b.kg!=null && b.date<=date && daysBetween(b.date,date)<7); return w.length>=2 ? w.reduce((a,b)=>a+b.kg,0)/w.length : null; }
function nutCorridor(){ const N=NUT(); if(Array.isArray(N.weight_corridor)) return N.weight_corridor; const t=S.profile&&S.profile.targetWeightKg; return t ? [t-1.5, t+1.5] : null; }
function nutAdjust(date){
  const out={ train:0, rest:0, hist:[] }; const dated=S.bodyweight.filter(b=>b.date&&b.kg!=null).map(b=>b.date).sort(); if(!dated.length || !REF.nut) return out;
  const cor=nutCorridor(); const maxGain=(NUT().max_gain_pct_week||0.25)/100; let last=null;
  for(let d=mondayOf(addDays(dated[0],14)); d<=date; d=addDays(d,7)){
    if(last && daysBetween(last,d)<14) continue;
    const a0=bwAvg(addDays(d,-1)), a1=bwAvg(addDays(d,-8)), a2=bwAvg(addDays(d,-15)); if(a0==null||a1==null) continue;
    const rd=loggedSessions().filter(s=>sessionDate(s)<d && s.planner).slice(-3).map(s=>s.log.form!=null?s.log.form:(s.planner.checkin||{}).readiness).filter(v=>v!=null);
    const lowRd=rd.length===3 && rd.reduce((x,y)=>x+y,0)/3<=2.5;
    let dT=0, dR=0, why='';
    if(cor && a0<cor[0]){ dT=30; dR=30; why='7-Tage-Schnitt '+fmtNum(Math.round(a0*10)/10)+' kg unter dem Korridor ('+fmtNum(cor[0])+'–'+fmtNum(cor[1])+' kg)'; }
    else if(a2!=null && a0<a1 && a1<a2){ dT=30; dR=30; why='Gewicht 2 Wochen in Folge gesunken ('+fmtNum(Math.round(a2*10)/10)+' → '+fmtNum(Math.round(a0*10)/10)+' kg)'; }
    else if(lowRd && a0<=a1){ dT=40; why='Tagesform niedrig bei stabilem oder fallendem Gewicht – mehr Kohlenhydrate an Trainingstagen'; }
    else if(cor && a0>cor[1]){ dR=-25; why='7-Tage-Schnitt '+fmtNum(Math.round(a0*10)/10)+' kg über dem Korridor'; }
    else if((a0-a1)/a1>maxGain){ dR=-25; why='Zunahme '+fmtNum(Math.round((a0-a1)*10)/10)+' kg/Woche – schneller als '+fmtNum(maxGain*100)+' %'; }
    if(!dT && !dR) continue;
    const nT=Math.max(-50,Math.min(100,out.train+dT)), nR=Math.max(-50,Math.min(100,out.rest+dR)); if(nT===out.train && nR===out.rest) continue;
    out.hist.push({ date:d, dT:nT-out.train, dR:nR-out.rest, why }); out.train=nT; out.rest=nR; last=d;
  }
  return out;
}
function nutWeight(date){
  const dated=S.bodyweight.filter(b=>b.date && b.date<=date && b.kg!=null).sort((a,b)=>a.date<b.date?1:-1);
  const win=dated.filter(b=>daysBetween(b.date,date)<7);
  if(win.length) return { kg:win.reduce((a,b)=>a+b.kg,0)/win.length, basis:win.length>1?'7-Tage-Schnitt aus '+win.length+' Messungen':'Messung vom '+fmtDate(win[0].date), provisional:win.length<3 };
  if(dated.length) return { kg:dated[0].kg, basis:'letzte Messung '+fmtDate(dated[0].date)+' (älter als 7 Tage)', provisional:true };
  const any=S.bodyweight.find(b=>b.kg!=null);
  if(any) return { kg:any.kg, basis:'Ausgangswert ohne Datum', provisional:true };

function nutAutoType(date){ const r=nutAutoTypeGym(date);

function nutAutoTypeGym(date){

/* Textsuche: jedes Suchwort muss ein Wort im Namen treffen (Wortanfang, Teilwort ab 4 Zeichen, kleine Tippfehler am Wortende wie „Bleue“) */
function txtNorm(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ß/g,'ss'); }
function txtMatch(name,q){ const nw=txtNorm(name).split(/[^a-z0-9]+/).filter(Boolean); const qw=txtNorm(q).split(/[^a-z0-9]+/).filter(w=>w.length>=2);
  if(!qw.length){ const t=txtNorm(q).trim(); return { hits:0, all:!!t && txtNorm(name).includes(t), start:0 }; }
  const hit=w=>nw.some(n=>n.startsWith(w) || (w.length>=4 && n.includes(w)) || (n.length>=4 && w.length-n.length<=1 && w.startsWith(n)));
  const hits=qw.filter(hit).length; const start=nw.length && (nw[0].startsWith(qw[0])||(nw[0].length>=4&&qw[0].startsWith(nw[0])))?1:0;
  return { hits, all:hits===qw.length, start }; }
function nutPickList(q){
  const slot=(NUT().meal_plans[nutTargets(nutDate()).time]||[]).find(s=>s.id===ui.nutSlot)||{};
  const pre=(slot.tags||[]).includes('pre');
  const ql=q.trim().toLowerCase();
  if(!ql){ const rec=nutRecentIds().map(nutFood).filter(f=>f && f.active!==false).slice(0,16);
    const sug=pre ? nutFoods(false).filter(f=>f.tags.includes('pre') && !rec.includes(f)).slice(0,8) : [];
    return (sug.length?'<div class="eyebrow" style="margin:8px 0 4px">Gut vor dem Training</div>'+sug.map(f=>'<button class="chip" data-act="nutSel" data-f="'+esc(f.id)+'">'+esc(f.name)+' · vor Training</button>').join(''):'')+
      (rec.length ? '<div class="eyebrow" style="margin:8px 0 4px">Zuletzt verwendet</div>'+rec.map(f=>'<button class="chip" data-act="nutSel" data-f="'+esc(f.id)+'">'+esc(f.name)+'</button>').join('') : (sug.length?'':'<p class="small muted">Tippe oben, um zu suchen.</p>')); }
  let l=nutFoods(false).filter(f=>txtMatch(f.name,ql).all || f.category.includes(ql));
  l=l.filter(f=>f.category!=='kantine' || slot.lunch);
  const score=f=>(f.user_rating||0)*2+(f.tags.includes('favorit')?5:0)+(pre&&(f.tags.includes('pre')||f.tags.includes('fettarm_ballaststoffarm'))?8:0);
  l.sort((a,b)=>txtMatch(b.name,ql).start-txtMatch(a.name,ql).start || score(b)-score(a) || a.name.localeCompare(b.name,'de'));
  if(!l.length) return '<p class="small muted">In deinen Lebensmitteln nichts gefunden – Treffer von Open Food Facts siehe unten.</p>';
  return l.slice(0,40).map(f=>'<button class="chip" data-act="nutSel" data-f="'+esc(f.id)+'">'+esc(f.name)+(f.tags.includes('favorit')?' ★':'')+(pre&&f.tags.includes('pre')?' · vor Training':'')+'</button>').join('');
}

/* ---------- Open Food Facts: Markenprodukte online suchen ----------
   Gesendet wird nur der Suchbegriff bzw. Barcode – keine persönlichen Daten. Suche nur auf Knopfdruck (Limit 10 Suchen/Minute). */
const OFF_BASE='https://world.openfoodfacts.org';
const OFF_FIELDS='code,product_name,product_name_de,generic_name_de,brands,nutriments,serving_quantity,quantity,countries_tags';
const offCache={};
function offMap(p){ const n=p.nutriments||{}; const g=k=>{ const v=n[k+'_100g']; return v==null||v===''?null:Math.round(Number(v)*10)/10; };
  let kcal=g('energy-kcal'); if(kcal==null && n['energy_100g']!=null) kcal=Math.round(Number(n['energy_100g'])/4.184);
  const P=g('proteins'), K=g('carbohydrates'), F=g('fat'); if([kcal,P,K,F].some(v=>v==null||Number.isNaN(v))) return null;
  const name=(p.product_name_de||p.product_name||p.generic_name_de||'').trim(); if(!name) return null;
  const brand=(p.brands||'').split(',')[0].trim();
  const per=/\d\s*(ml|cl|l)\b/i.test(p.quantity||'')?'100 ml':'100 g';
  const main = kcal>0 && P*4/kcal>=0.3 ? 'P' : (F*9>K*4 ? 'F' : 'K');
  const qn=parseFloat(String(p.quantity||'').replace(',','.')); const sv=p.serving_quantity?Number(p.serving_quantity):null;
  const piece = sv && qn && Math.abs(qn-sv)<0.5 ? Math.round(sv) : null;   // Einzelpackung (z. B. Riegel): 1 Stück = Packung
  return { code:String(p.code||''), name:(brand&&!name.toLowerCase().includes(brand.toLowerCase())?name+' ('+brand+')':name), kcal:Math.round(kcal), P, K, F, per,
    portion:p.serving_quantity?Math.round(Number(p.serving_quantity)):null, piece, main, qty:p.quantity||'', at:(p.countries_tags||[]).includes('en:austria'),
    dach:(p.countries_tags||[]).some(c=>c==='en:austria'||c==='en:germany'), de:!!(p.product_name_de||'').trim() }; }
async function offQuery(q){
  q=q.trim(); if(offCache[q]) return offCache[q];
  let list;
  if(/^\d{8,14}$/.test(q)){ const r=await fetch(OFF_BASE+'/api/v2/product/'+q+'.json?fields='+OFF_FIELDS);
    if(r.status===404){ list=[]; } else { if(!r.ok) throw new Error('HTTP '+r.status); const j=await r.json(); list=j.product?[Object.assign({code:q},j.product)]:[]; } }
  else { const get=async extra=>{ const r=await fetch(OFF_BASE+'/cgi/search.pl?action=process&json=1&search_simple=1&lc=de&page_size=100&search_terms='+encodeURIComponent(q)+extra+'&fields='+OFF_FIELDS);
      if(!r.ok) throw new Error(r.status===429?'zu viele Suchen – bitte eine Minute warten':'HTTP '+r.status); const j=await r.json(); return j.products||[]; };
    // Zuerst nur Produkte, die in Österreich verkauft werden; weltweit nur ergänzen, wenn das zu wenig ist (zählt als zweite Suche)
    list=await get('&tagtype_0=countries&tag_contains_0=contains&tag_0=austria');
    list.forEach(p=>{ p.countries_tags=Array.from(new Set([...(p.countries_tags||[]),'en:austria'])); });
    if(list.length<8){ offTimes.push(Date.now()); const seen=new Set(list.map(p=>String(p.code)));
      try{ (await get('')).forEach(p=>{ if(!seen.has(String(p.code))) list.push(p); }); }catch(e){ if(!list.length) throw e; } } }
  let out=list.map(offMap).filter(Boolean);
  // Reihenfolge: Österreich immer zuerst, dann Suchwörter im Produktnamen (alle > einige), Deutschland/deutscher Name, sonst Reihenfolge von Open Food Facts
  if(!/^\d{8,14}$/.test(q)){ out.forEach((r,i)=>{ const m=txtMatch(r.name,q); r._m=m.hits; r._all=m.all?1:0; r._st=m.start; r._i=i; });
    if(out.some(r=>r._m>0)) out=out.filter(r=>r._m>0);
    out.sort((a,b)=>(b.at-a.at)||(b._all-a._all)||(b._st-a._st)||((b.dach||b.de)-(a.dach||a.de))||(b._m-a._m)||(a._i-b._i)); }
  offCache[q]=out; return out; }
/* Automatische Online-Suche: 700 ms nach dem letzten Tastendruck, ab 3 Zeichen, max. 9 Suchen pro Minute (Limit 10) */
let offTimer=null, offSeq=0; const offTimes=[];
function offAuto(q,mode,now){ clearTimeout(offTimer); q=(q||'').trim();
  const box=document.getElementById('off-res'); if(!box) return;
  if(q.length<3 && !/^\d{8,14}$/.test(q)){ box.innerHTML='<p class="small muted">'+(mode==='fill'?'Name oder Barcode eingeben – Treffer erscheinen automatisch.':'Markenprodukte erscheinen hier automatisch ab 3 Zeichen (Name oder Barcode).')+'</p>'; offSeq++; return; }
  offTimer=setTimeout(()=>offRun(q,mode), now?0:700); }
async function offRun(q,mode){
  const box=document.getElementById('off-res'); if(!box) return; const my=++offSeq;
  if(navigator.onLine===false){ box.innerHTML='<p class="small muted">Offline – Online-Suche nicht möglich.</p>'; return; }
  if(!offCache[q.trim()]){ const t=Date.now(); while(offTimes.length && t-offTimes[0]>60000) offTimes.shift();
    if(offTimes.length>=9){ const wait=60000-(t-offTimes[0])+200; box.innerHTML='<p class="small muted">Kurz warten – Open Food Facts erlaubt 10 Suchen pro Minute …</p>'; clearTimeout(offTimer); offTimer=setTimeout(()=>{ if(my===offSeq) offRun(q,mode); }, wait); return; }
    offTimes.push(t); }
  box.innerHTML='<p class="small muted">Suche online nach „'+esc(q)+'“ …</p>';
  try{ const res=await offQuery(q); if(my!==offSeq || !document.getElementById('off-res')) return; ui.offRes=res; ui.offMode=mode;
    if(!res.length){ box.innerHTML='<p class="small muted">Online nichts mit vollständigen Nährwerten gefunden.</p>'; return; }
    box.innerHTML='<div class="off-list">'+res.slice(0,15).map((r,i)=>'<button class="off-item" data-act="offPick" data-mode="'+mode+'" data-i="'+i+'"><span class="off-n">'+(r.at?'<span class="off-at">AT</span>':'')+esc(r.name)+'</span><span class="off-m">'+r.kcal+' kcal · P '+fmtNum(r.P)+' · KH '+fmtNum(r.K)+' · F '+fmtNum(r.F)+' / '+r.per+(r.qty?' · '+esc(r.qty):'')+'</span></button>').join('')+'</div><p class="small muted" style="margin-top:6px">Daten von Open Food Facts (von Nutzern gepflegt) – Werte mit der Packung vergleichen.</p>';
  }catch(e){ if(my===offSeq) box.innerHTML='<p class="small" style="color:var(--bad)">Online-Suche fehlgeschlagen: '+esc(e.message||String(e))+'</p>'; } }

/* ---------- Gespeicherte Mahlzeiten (Vorlagen) ---------- */
function nutTpls(){ return S.nutrition.templates||[]; }
function nutTpl(id){ return nutTpls().find(t=>t.id===id)||null; }
function nutSlotNames(){ const m={}; Object.values(NUT().meal_plans||{}).forEach(l=>l.forEach(s=>{ if(!m[s.id]) m[s.id]=s.name.replace(/ \(.*\)$/,''); })); return m; }
const tgtKcal=x=>4*x.P+4*x.K+9*x.F;
function tplScaled(t, target){ const base=sumMac(t.items).kcal; let f=1;
  if(t.scale!==false && base>0 && target) f=Math.min(1.3, Math.max(0.7, tgtKcal(target)/base));
  return t.items.map(it=>{ const fd=nutFood(it.food); let g=(it.g||0)*f;
    if(fd && it.unit==='stk' && fd.piece_g){ const step=fd.piece_g>=100?0.5:1; g=Math.max(step, Math.round(g/fd.piece_g/step)*step)*fd.piece_g; }
    else if(isPortion(fd)) g=Math.max(0.5, Math.round(g*2)/2); else g=Math.max(5, r5(g));
    return { food:it.food, g, unit:it.unit, fixed:true }; }); }
function nutTplsForSlot(date, slotId){ const wd=weekdayOf(date);
  return nutTpls().map(t=>Object.assign({}, t, { _std: t.slot===slotId && (t.days||[]).includes(wd) }))
    .filter(t=>t._std || t.slot===slotId || !t.slot).sort((a,b)=>(b._std-a._std) || a.name.localeCompare(b.name,'de')); }
function nutStdTpl(date, slotId){ const wd=weekdayOf(date); return nutTpls().find(t=>t.slot===slotId && (t.days||[]).includes(wd)) || null; }
function nutRecentIds(){ const c={}; (S.nutrition.meals||[]).forEach(m=>(m.items||[]).forEach(i=>{ c[i.food]=(c[i.food]||0)+1; })); nutTpls().forEach(t=>t.items.forEach(i=>{ c[i.food]=(c[i.food]||0)+3; }));

const SHOP_CAT={ fleisch_fisch:'Fleisch & Fisch', eier_milch:'Eier & Milchprodukte', pflanzlich:'Pflanzlich', proteinpulver:'Proteinpulver', beilage:'Beilagen', gemuese:'Gemüse', obst:'Obst', fruehstueck:'Frühstück', brot:'Brot', fett:'Fette & Nüsse', suess:'Süßes', getraenk:'Getränke', sauce:'Saucen', gericht:'Gerichte', eigene:'Eigene Produkte' };
function shopRange(which){ const td=todayISO(); const mon=mondayOf(td);
  if(which==='next') { const m2=addDays(mon,7); return { from:m2, to:addDays(m2,6) }; }
  return { from:td, to:addDays(mon,6) }; }
function shopBuild(from,to){ const tot={}, miss={}, src={ planned:0, std:0 }; const sn=nutSlotNames();
  for(let d=from; d<=to; d=addDays(d,1)){ const T=nutTargets(d);
    nutMealPlan(T).forEach(x=>{ const m=nutMeal(d,x.slot.id); let items=null;
      if(m && m.items.length){ items=m.items; src.planned++; } else { const t=nutStdTpl(d,x.slot.id); if(t){ items=tplScaled(t,x); src.std++; } }
      if(!items){ const n=sn[x.slot.id]||x.slot.name; miss[n]=(miss[n]||0)+1; return; }
      items.forEach(it=>{ const f=nutFood(it.food); if(!f || f.category==='kantine' || it.g==null) return; const k=it.food; tot[k]=tot[k]||{ g:0, stk:false }; tot[k].g+=it.g; if(it.unit==='stk') tot[k].stk=true; }); }); }
  return { tot, miss, src }; }
function shopQty(f, e){ if(isPortion(f)) return Math.ceil(e.g)+' Port.';
  const ml=/ml/.test(f.per||''); if(f.piece_g && (e.stk || unitDefault(f)==='stk')){ const n=Math.ceil(e.g/f.piece_g-0.05); return n+' '+(f.piece_label||'Stück')+' (≈ '+Math.round(e.g)+(ml?' ml':' g')+')'; }
  const g=Math.ceil(e.g/10)*10; return (g>=1000?fmtNum(Math.round(g/100)/10)+(ml?' l':' kg'):g+(ml?' ml':' g')); }
function shopLoad(){ try{ return JSON.parse(localStorage.getItem('aos-shop')||'{}'); }catch(e){ return {}; } }
function shopStore(o){ try{ localStorage.setItem('aos-shop', JSON.stringify(o)); }catch(e){} }
function shopHTML(){ const which=ui.shopWeek||([0,6].includes(weekdayOf(todayISO()))?'next':'this'); const r=shopRange(which); const B=shopBuild(r.from,r.to);
  const key=r.from+'_'+r.to; const chk=(shopLoad()[key])||{};
  const groups={}; Object.entries(B.tot).forEach(([id,e])=>{ const f=nutFood(id); if(!f) return; const c=SHOP_CAT[f.category]||'Sonstiges'; (groups[c]=groups[c]||[]).push({ id, f, e }); });
  let h='<div class="seg" style="margin-bottom:10px">'+[['this','Diese Woche'],['next','Nächste Woche']].map(([k,l])=>'<button class="chip" data-act="shopWeek" data-v="'+k+'" aria-pressed="'+(k===which)+'">'+l+'</button>').join('')+'</div>';
  h+='<p class="small muted">'+fmtDateShort(r.from)+' – '+fmtDateShort(r.to)+' · Mengen passend zum kcal-Ziel jedes Tages.</p>';

    groups[c].sort((a,b)=>a.f.name.localeCompare(b.f.name,'de')).forEach(({id,f,e})=>{ const q=shopQty(f,e); const on=!!chk[id];
      txt.push((on?'☑ ':'☐ ')+f.name+' – '+q);
      h+='<button class="shop-row'+(on?' on':'')+'" data-act="shopChk" data-k="'+esc(key)+'" data-f="'+esc(id)+'"><span class="shop-box">'+(on?'✓':'')+'</span><span class="shop-n">'+esc(f.name)+'</span><span class="shop-q">'+esc(q)+'</span></button>'; }); });
  const ms=Object.entries(B.miss); if(ms.length) h+='<p class="small muted" style="margin-top:12px">Nicht eingeplant (keine Standard-Mahlzeit): '+esc(ms.map(([n,c])=>n+' '+c+'×').join(' · '))+'</p>';
  h+='<pre class="sr-only" id="shop-out">'+esc(txt.join('\n'))+'</pre>';
  return h; }

const METHOD_LABEL={ rpe_linear:'RPE-gesteuert linear', wave:'Wochenwelle', double:'Doppelprogression', bodyweight_reps:'Wdh steigern (KG)', velocity:'Tempo („alle schnell?“)',
  contacts:'Bodenkontakte', quality:'Qualität', reps_rom:'Wdh/Bewegungsumfang', reps_load:'Wdh/Last', load_distance:'Last/Strecke', load_time:'Last/Zeit', time:'Zeit' };
function plCurrentLoad(slot, exId, b){
  const e=REF.exMap[exId]; const H=plHistory(exId); const dec=lastDecision(exId);
  if(slot.method==='wave'){ const x=plE1RM(exId); if(x) return 'nach Welle · 1RM ≈ '+fmtNum(Math.round(x.kg*2)/2)+' kg'; }
  if(!['rpe_linear','wave','velocity','double','load_distance','load_time','reps_load'].includes(slot.method)) return 'Körpergewicht';
  const last=H[0]; const lastAt=last?((last.s.log&&last.s.log.loggedAt)||last.date):'';
  if(dec && (!last || dec.at>lastAt)) return fmtNum(dec.kg)+' kg (bestätigt)';
  if(last && topKg(last.le)!=null) return fmtNum(topKg(last.le))+' kg ('+fmtDateShort(last.date)+')';
  const st=(b.start_loads||{})[exId]; if(st!=null) return fmtNum(st)+' kg (Start)';

  const dayLbl='Heute · '+WD[weekdayOf(today)]+' '+fmtDate(today).slice(0,6);
  if(typeof REF==='undefined' || !REF.plan) return '<div class="section hero"><div class="eyebrow">'+dayLbl+'</div><div class="hero-title">'+(ghReady()?'Plan wird geladen …':'Noch nicht verbunden')+'</div></div>';
  const due=plDue(today); const T=REF.nut ? nutTargets(today) : null;
  const typ=T ? T.label.replace(/\s*\(.*\)\s*$/,'') : '';
  let state='rest', title='Ruhetag', sub='', btn='';
  if(due.doneToday){ state='done'; title=due.doneToday.name; sub='✓ erledigt'+(due.doneToday.durationMin?' · '+due.doneToday.durationMin+' min':'');
    btn='<button class="block" data-act="startLog" data-id="'+due.doneToday.id+'">Protokoll ansehen</button>'; }
  else if(due.plannedToday && !due.plannedToday.planner){ state='open'; title=due.plannedToday.name; sub='gespeichert · bereit zum Erfassen';
    btn=phBtn('Einheit erfassen','data-act="startLog" data-id="'+due.plannedToday.id+'"'); }
  else if(due.block && due.tpl && !due.offday){ const t=plTemplate(due.block, due.tpl); state='open'; title=t.id+' – '+t.name;
    sub='ca. '+t.time_min+' min';
    btn=phBtn('Einheit starten','data-act="go" data-view="training"'); }
  else if(isFieldDay(today)){ title='Kein Gym – '+((fieldCfg()||{}).name||'Feldtraining'); sub=((fieldCfg()||{}).time||'')+' · siehe unten'; }
  else { const n=plNextTraining(addDays(today,1)); sub=n?'Nächste Einheit: '+n.tpl+' · '+WD[weekdayOf(n.date)]+' '+fmtDate(n.date).slice(0,6):'Erholung'; }
  let h='<div class="section hero today-card"><div class="eyebrow">'+(state==='open'?'<span class="dot"></span>':'')+esc(dayLbl+(typ&&T.training?' · '+typ:''))+'</div>';
  h+=ovPhaseLine(today);
  h+='<div class="hero-title">'+esc(title)+'</div><div class="hero-sub">'+esc(sub)+'</div>';
  if(isFieldDay(today)){ const fc=fieldCfg(), fl=fieldLog(today);
    h+='<div class="tc-row tc-weight"><span class="tc-k">'+esc(fc.time||'Feld')+'</span><span>'+esc(fc.name||'Football-Training')+'<br><span class="small muted">'+(fl?esc(fieldSummary(fl)):'ca. '+(fc.duration_min||90)+' min')+'</span></span><button class="small'+(fl?' link':'')+'" data-act="fieldLog" data-d="'+today+'">'+(fl?'ändern':'Erfassen')+'</button></div>'; }
  const hints=[];
  if(T && T.entry) hints.push('Einstiegsphase: KH −'+NUT().entry.carb_minus_g+' g bis '+fmtDate(NUT().entry.until).slice(0,6));
  if(hints.length) h+='<div class="tc-hints">'+hints.map(x=>'<div>› '+esc(x)+'</div>').join('')+'</div>';
  let kc=''; if(T){ const di=nutDayItems(today,T); const k=di.length?Math.round(sumMac(di).kcal):null;
    kc='<div class="tc-kcal"><span class="tc-k">Kalorien</span><span>'+(k!=null?'<b>'+fmtK(k)+'</b> / '+fmtK(T.kcal):'<b>'+fmtK(T.kcal)+'</b>')+' kcal</span></div>'; }
  return h+(btn?'<div class="tc-btn">'+btn+'</div>':'')+cdBlock('tc-cd')+kc+MOTTO+'</div>';
}
/* Woche als Streifen Mo–So aus dem Plan: ✓ erledigt · ○ gespeichert · ✗ nicht erfasst */
function ovWeek(today){
  if(typeof REF==='undefined' || !REF.plan) return '';
  const mon=mondayOf(today);
  // Sonntag oder vor Blockbeginn: kommende Woche zeigen
  const cur=ovWeekStrip(today, mon); const next=(weekdayOf(today)===0 || !cur) ? ovWeekStrip(today, addDays(mon,7)) : '';
  if(next) return '<h2>Nächste Woche</h2>'+next;
  return cur ? '<h2>Diese Woche</h2>'+cur : '';
}
function ovWeekStrip(today, mon){
  const dn=['Mo','Di','Mi','Do','Fr','Sa','So']; let any=false;
  const cells=dn.map((d,i)=>{ const date=addDays(mon,i); const b=plBlockAt(date); let txt='', act='';
    const s=plSessions().find(x=>(sessionDate(x)===date) && x.status!=='ausgelassen');
    let done=false; if(s){ done=isDone(s); txt=s.planner.templateId; act=' data-act="startLog" data-id="'+s.id+'"'; any=true; }
    else if(b){ const sc=plScheduledAt(b,date); const t=sc.tpl; if(t){ txt=t+(date<today?' ✗':'')+(sc.changed?'*':''); any=true; } else if(sc.changed){ txt='frei*'; any=true; }
      if(date>=today) act=' data-act="dayEdit" data-d="'+date+'"'; }
    if(isFieldDay(date)){ const fl=fieldLog(date); txt=(txt?txt+'+':'')+(fl&&fl.status==='ausgefallen'?'F✗':'F'); any=true; }
    return '<div class="day'+(date===today?' today':'')+'"'+act+(act&&!s?'':'')+'><span class="wd">'+d+'</span><span class="dn">'+parseISO(date).getDate()+'</span>'+(done?'<span class="tp done claw-tp">'+CLAW+'<span class="sr-only">'+esc(txt)+' erledigt</span>'+(isFieldDay(date)?esc(txt.slice(txt.indexOf('+')))+'':'')+'</span>':'<span class="tp">'+esc(txt||'')+'</span>')+'</div>'; });
  if(!any) return '';
  return '<div class="weekstrip">'+cells.join('')+'</div><p class="small muted">Tipp auf einen Tag, um ihn zu ändern.</p>';
}

function calSorted(){ return (S.calendar||[]).slice().sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||''))); }
function calGames(){ const g=calSorted().filter(e=>e.kind==='game' && e.date);
  if(g.length) return g.map(e=>({ date:e.date, time:e.time||'', title:e.title||'', place:e.place||'', alt:[] }));
  const fg=(typeof REF!=='undefined' && REF.plan && REF.plan.season && REF.plan.season.first_game)||[];
  return fg.length ? [{ date:fg[0], time:'', title:'', place:'', alt:fg.slice(1) }] : []; }
function kickoffAt(g){ return new Date(g.date+'T'+(g.time||'00:00')+':00'); }
function cdNext(now){ now=now||new Date(); const G=calGames(); const td=todayISO();
  const i=G.findIndex(g=> g.time ? kickoffAt(g)>now : g.date>=td); if(i<0) return null;
  const g=G[i]; const ms=g.time ? kickoffAt(g)-now : null;
  return { g, first:i===0, live: ms!=null && ms<=7*864e5, ms, days:daysBetween(td, g.date) }; }
const p2=n=>String(n).padStart(2,'0');
function cdSegs(ms){ const t=Math.max(0,Math.floor(ms/1000)); const d=Math.floor(t/86400), h=Math.floor(t%86400/3600), m=Math.floor(t%3600/60), x=t%60;
  return [[d,'Tage'],[p2(h),'Std'],[p2(m),'Min'],[p2(x),'Sek']].map(([v,l])=>'<span class="cd-seg"><b>'+v+'</b><small>'+l+'</small></span>').join(''); }
function cdBlock(cls){ const c=cdNext(); if(!c) return '';
  const g=c.g; const when=fmtDateShort(g.date)+(g.alt.length?'/'+g.alt.map(fmtDateShort).join('/'):'')+(g.time?' · '+g.time:'');
  const lbl=(c.first?'Saisonstart':'Nächstes Spiel')+(g.title?' · '+g.title:'');
  const val = c.live ? '<div class="cd-v cd-live" data-t="'+kickoffAt(g).getTime()+'">'+cdSegs(c.ms)+'</div>'
    : '<div class="cd-v">'+(c.days<=0?'<span class="cd-seg"><b>Heute</b><small>Gameday</small></span>':'<span class="cd-seg"><b>'+c.days+'</b><small>'+(c.days===1?'Tag':'Tage')+'</small></span>')+'</div>';
  return '<div class="cd '+(cls||'')+(c.live?' is-live':'')+'"><div class="cd-k"><span>'+esc(lbl)+'</span><small>'+esc(when+(g.place?' · '+g.place:''))+'</small></div>'+val+'</div>'; }
setInterval(()=>{ const els=document.querySelectorAll('.cd-live[data-t]'); if(!els.length) return; let done=false;
  els.forEach(el=>{ const ms=Number(el.dataset.t)-Date.now(); if(ms<=0) done=true; else el.innerHTML=cdSegs(ms); });
  if(done) render(); }, 1000);

/* Fortschritt zum Ziel in %: vom ersten Test (Start) zum Ziel; bei Zeiten (s) ist weniger besser. Ohne vergleichbaren Messwert: null */
function goalVal(t){ return (t.unit==='kg' && t.reps>1 && t.reps<=10) ? Math.round(t.value*(1+t.reps/30)*2)/2 : t.value; }
function goalProgress(g){ const L=S.tests.filter(t=>t.name===g.testName && t.value!=null && t.unit===g.unit && t.date).sort((a,b)=>a.date<b.date?-1:1); if(!L.length||g.target==null) return null;
  const v=goalVal; const cur=v(L[L.length-1]), start=v(L[0]), lower=/^s$|sek/i.test(g.unit);
  let p; if(lower){ if(L.length<2||start===g.target) return cur<=g.target?100:null; p=(start-cur)/(start-g.target); }
  else { p = (L.length>=2 && start<g.target && start!==cur) ? (cur-start)/(g.target-start) : cur/g.target; }
  return Math.max(0, Math.min(100, Math.round(p*100))); }
function goalsSection(){

'use strict';
/* ===== AOS – Speicherung im privaten GitHub-Datenrepo =====
   Ablauf eines Abgleichs: Datei aus dem Datenrepo laden → mit dem Stand auf diesem Gerät zusammenführen
   (pro Datensatz gewinnt die jüngste Änderung, siehe mergeData) → Ergebnis zurückschreiben, falls sich etwas geändert hat.
   Der Zugriffsschlüssel (Token) bleibt nur auf diesem Gerät (localStorage, nicht in Sicherungen) und wird
   ausschließlich an api.github.com gesendet. */

const GH_KEY = 'aos-github-v1';
const GH_DEFAULT = { owner:'bqtmarcel', repo:'AOS_DATA', branch:'main', path:'aos-data.json', token:'' };
const gh = { cfg:null, state:'aus', syncing:false, again:false, timer:null, lastOk:null, lastError:'', dirty:false };

function ghLoad(){
  let c=null; try{ c=JSON.parse(localStorage.getItem(GH_KEY)||'null'); }catch(e){}
  gh.cfg = Object.assign({}, GH_DEFAULT, c&&c.cfg||{});
  gh.lastOk = c&&c.lastOk || null; gh.dirty = !!(c&&c.dirty);
  gh.state = ghReady() ? (gh.dirty?'ausstehend':'ok') : 'aus';
}
function ghStore(){ try{ localStorage.setItem(GH_KEY, JSON.stringify({ cfg:gh.cfg, lastOk:gh.lastOk, dirty:gh.dirty })); }catch(e){} }
function ghReady(){ return !!(gh.cfg && gh.cfg.token && gh.cfg.owner && gh.cfg.repo && gh.cfg.branch && gh.cfg.path); }

/* Base64 für UTF-8 (Umlaute) */
function b64enc(str){ const b=new TextEncoder().encode(str); let bin=''; for(let i=0;i<b.length;i+=0x8000) bin+=String.fromCharCode.apply(null, b.subarray(i,i+0x8000)); return btoa(bin); }
function b64dec(s){ const bin=atob(String(s).replace(/\s/g,'')); const b=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i); return new TextDecoder().decode(b); }

function ghRepoUrl(p){ return 'https://api.github.com/repos/'+encodeURIComponent(gh.cfg.owner)+'/'+encodeURIComponent(gh.cfg.repo)+(p||''); }
function ghFilePath(){ return gh.cfg.path.split('/').filter(Boolean).map(encodeURIComponent).join('/'); }
async function ghFetch(method, path, body){
  let res;
  const headers = { 'Accept':'application/vnd.github+json', 'Authorization':'Bearer '+gh.cfg.token, 'X-GitHub-Api-Version':'2022-11-28' };
  if(body) headers['Content-Type']='application/json';
  try{ res = await fetch(ghRepoUrl(path), { method, headers, cache:'no-store', body: body?JSON.stringify(body):undefined }); }
  catch(e){ const err=new Error('Keine Verbindung zu GitHub'); err.offline=true; throw err; }
  ghNoteExpiry(res);
  let data=null; try{ data=await res.json(); }catch(e){}
  if(!res.ok){ const err=new Error((data&&data.message)||('HTTP '+res.status)); err.status=res.status; throw err; }
  return data;
}
function ghErrText(e){
  if(e.offline) return 'Keine Verbindung – wird automatisch nachgeholt.';
  if(e.status===401) return 'Der Zugriffsschlüssel (Token) ist ungültig oder abgelaufen.';
  if(e.status===403) return 'Der Token darf auf das Datenrepo nicht zugreifen (Berechtigung „Contents: Read and write“ prüfen).';
  if(e.status===404) return 'Repo oder Branch nicht gefunden – oder der Token hat keinen Zugriff auf dieses Repo.';
  return e.message||String(e);
}

/* Datei laden; null, wenn sie noch nicht existiert */
async function ghPull(){
  let meta;
  try{ meta = await ghFetch('GET', '/contents/'+ghFilePath()+'?ref='+encodeURIComponent(gh.cfg.branch)); }
  catch(e){
    if(e.status===404){ await ghFetch('GET', '/branches/'+encodeURIComponent(gh.cfg.branch)); return { data:null, sha:null }; } // Branch muss existieren
    throw e;
  }
  if(Array.isArray(meta)) throw new Error('„'+gh.cfg.path+'“ ist im Datenrepo ein Ordner, keine Datei.');
  const text = (meta.content && meta.encoding==='base64') ? b64dec(meta.content) : b64dec((await ghFetch('GET','/git/blobs/'+meta.sha)).content); // > 1 MB: über Blob laden
  let d; try{ d=JSON.parse(text); }catch(e){ throw new Error('„'+gh.cfg.path+'“ im Datenrepo ist kein gültiges JSON – nichts überschrieben.'); }
  const v=validateData(d); if(!v.ok) throw new Error('„'+gh.cfg.path+'“ ist keine gültige AOS-Datei ('+v.errors[0]+') – nichts überschrieben.');
  return { data: migrate(d), sha: meta.sha };
}

/* Vergleichbarer Fingerabdruck des synchronisierten Inhalts (unabhängig von Reihenfolge und Gerät) */
function canon(v){ if(Array.isArray(v)) return '['+v.map(canon).join(',')+']'; if(v&&typeof v==='object') return '{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}'; return JSON.stringify(v===undefined?null:v); }
function syncSig(d){ const o={}; syncRecords(d).forEach((v,k)=>o[k]=v); return canon([o, d.sync&&d.sync.stamps||{}, d.sync&&d.sync.tombstones||{}]); }

function ghDevice(){ return isIOS() ? 'iPhone/iPad' : 'Browser'; }
function ghApplyMerged(d){
  S=d; syncInit();
  if(storageOK){ try{ localStorage.setItem(AOS_KEY, JSON.stringify(S)); }catch(e){} }
  // Offene Eingaben (Dialog, Protokoll in Arbeit) nicht unter den Fingern neu zeichnen
  const dlg=document.getElementById('dlg');
  if((dlg && dlg.open) || ui.draft){ gh.renderPending=true; renderShell(); }
  else { render(); }
}

async function ghSync(reason){
  if(!ghReady()){ ghSetState('aus'); return false; }
  if(gh.syncing){ gh.again=true; return false; }
  clearTimeout(gh.timer);
  if(navigator.onLine===false){ ghSetState('offline'); return false; }
  gh.syncing=true; ghSetState('laeuft');
  try{
    for(let attempt=0; ; attempt++){
      const { data:R, sha } = await ghPull();
      if(R){
        const res = mergeData(S, R);
        if(syncSig(res.data)!==syncSig(S)) ghApplyMerged(res.data);
        if(syncSig(S)===syncSig(R)){ gh.dirty=false; break; }   // Datenrepo ist bereits aktuell
      }
      try{
        const body = { message:'AOS-Abgleich ('+ghDevice()+')', content:b64enc(JSON.stringify(S, null, 1)), branch:gh.cfg.branch };
        if(sha) body.sha=sha;
        await ghFetch('PUT', '/contents/'+ghFilePath(), body);
        gh.dirty=false; break;
      }catch(e){
        // Ein anderes Gerät hat inzwischen gespeichert → neu laden, zusammenführen, nochmal schreiben
        if((e.status===409 || e.status===422) && attempt<3) continue;
        throw e;
      }
    }
    gh.lastOk=new Date().toISOString(); gh.lastError=''; ghStore(); ghSetState(gh.dirty?'ausstehend':'ok');
    return true;
  }catch(e){
    gh.lastError=ghErrText(e); ghStore(); ghSetState(e.offline?'offline':'fehler');
    if(reason==='manuell' || reason==='einrichten') toast(gh.lastError);
    return false;
  }finally{
    gh.syncing=false;
    if(gh.again){ gh.again=false; ghSchedule(1000); }
  }
}
function ghSchedule(ms){ if(!ghReady()) return; clearTimeout(gh.timer); gh.timer=setTimeout(()=>ghSync('auto'), ms); }
function ghOnLocalChange(){ if(!gh.cfg) return; gh.dirty=true; ghStore(); if(ghReady()){ if(!gh.syncing) ghSetState('ausstehend'); ghSchedule(3000); } }

/* ---------- Anzeige ---------- */
function ghTime(iso){ if(!iso) return ''; const d=new Date(iso); const t=pad(d.getHours())+':'+pad(d.getMinutes()); return isoOf(d)===todayISO()?t:fmtDateShort(isoOf(d))+' '+t; }
function ghDot(){ const st=(typeof gh!=='undefined'&&gh.state)||'aus'; const c={ok:'ok',laeuft:'run',ausstehend:'run',offline:'off',fehler:'err',aus:'off'}[st]||'off';
  return '<span class="sd '+c+'" title="'+esc({ok:'gespeichert',laeuft:'speichert',ausstehend:'ausstehend',offline:'offline',fehler:'Fehler beim Speichern',aus:'nicht verbunden'}[st]||st)+'" role="img" aria-label="Speicherstatus: '+esc({ok:'gespeichert',laeuft:'speichert',ausstehend:'ausstehend',offline:'offline',fehler:'Fehler',aus:'nicht verbunden'}[st]||st)+'">●</span>'; }
function ghChip(){
  const st=gh.state;
  const m = { aus:['Nicht mit GitHub verbunden','warn'], laeuft:['Wird gespeichert …','info'], ok:['Gespeichert '+ghTime(gh.lastOk),'ok'],
    ausstehend:['Änderungen noch nicht gespeichert','warn'], offline:['Offline – wird später gespeichert','warn'], fehler:['Speichern fehlgeschlagen','bad'] }[st] || ['',''];
  return '<button class="syncchip '+m[1]+'" data-act="ghOpen" title="'+esc(gh.lastError||'Datenspeicherung (GitHub)')+'">'+esc(m[0])+'</button>';
}
function ghSetState(st){
  gh.state=st;
  const hs=document.getElementById('hsync'); if(hs) hs.innerHTML=ghDot();
  const el=document.getElementById('syncchip'); if(el) el.innerHTML=ghChip();
  const box=document.getElementById('gh-status'); if(box) box.innerHTML=ghStatusText();
  const w=document.getElementById('syncwarn'); if(w) w.innerHTML=ghWarn();
}
/* Übersicht: nur melden, wenn Speichern wirklich fehlschlägt (offline ist normal und wird nachgeholt) */
/* Ablaufdatum des Tokens: aus der GitHub-Antwort (falls der Browser den Header lesen darf) oder von Hand eingetragen */
function ghNoteExpiry(res){ try{ const ex=res.headers.get('github-authentication-token-expiration'); if(ex){ const d=ex.slice(0,10); if(/^\d{4}-\d{2}-\d{2}$/.test(d) && gh.cfg.tokenExp!==d){ gh.cfg.tokenExp=d; ghStore(); } } }catch(e){} }
function ghTokenDays(){ const d=gh.cfg&&gh.cfg.tokenExp; if(!d||!ghReady()) return null; return daysBetween(todayISO(), d); }
function ghTokenWarn(){ const n=ghTokenDays(); if(n==null || n>14) return '';
  return '<div class="note '+(n<=3?'bad':'warn')+'"><strong>'+(n<0?'GitHub-Token ist abgelaufen.':'GitHub-Token läuft '+(n===0?'heute':n===1?'morgen':'in '+n+' Tagen')+' ab ('+fmtDate(gh.cfg.tokenExp)+').')+'</strong> Neuen Token erstellen und unter Profil → Datenspeicherung eintragen, sonst wird nicht mehr gespeichert. <button class="link" data-act="ghOpen">Öffnen</button></div>'; }
function ghWarn(){ return ghTokenWarn() + (gh.state==='fehler' ? '<div class="note bad"><strong>Speichern fehlgeschlagen.</strong> '+esc(gh.lastError||'')+' <button class="link" data-act="ghOpen">Details</button></div>' : ''); }
function ghStatusText(){
  if(!ghReady()) return '<span class="muted">Noch nicht verbunden.</span>';
  if(gh.state!=='aus') return ghChip().replace('data-act="ghOpen"','data-act="ghSyncNow"').replace(/title="[^"]*"/,'title="Jetzt abgleichen"')+(gh.lastError?'<br><span style="color:var(--bad)">'+esc(gh.lastError)+'</span>':'');
  return 'Status: <strong>'+esc({laeuft:'speichert …',ok:'aktuell',ausstehend:'Änderungen ausstehend',offline:'offline',fehler:'Fehler',aus:'aus'}[gh.state]||gh.state)+'</strong>'+
    (gh.lastOk?' · zuletzt abgeglichen: '+esc(ghTime(gh.lastOk)):'')+(gh.lastError?'<br><span style="color:var(--bad)">'+esc(gh.lastError)+'</span>':'');
}
function ghSection(){
  const c=gh.cfg;
  return pdet('gh','Datenspeicherung', ghReady()?(gh.cfg.repo):'nicht verbunden', '<span id="gh-sec"></span>'+
    '<p class="small">AOS speichert deine Trainings-, Ernährungs- und Körperdaten in deinem <strong>privaten</strong> Repo <code>'+esc(c.owner+'/'+c.repo)+'</code>. Jede Änderung wird nach wenigen Sekunden abgeglichen; ohne Netz wird gepuffert und später nachgeholt. iPhone und Laptop arbeiten so mit demselben Stand.</p>'+
    '<p id="gh-status" class="small" aria-live="polite">'+ghStatusText()+'</p>'+
    (ghReady()?'<p class="small muted">Plan & Datenbanken geladen '+(REF.at?ghTime(REF.at):'—')+' · <button class="link" data-act="plReload">neu laden</button></p>':'')+
    '<div class="fields">'+inp('gh-owner','GitHub-Konto',c.owner)+inp('gh-repo','Datenrepo',c.repo)+'</div>'+
    '<div class="fields">'+inp('gh-branch','Branch',c.branch)+inp('gh-path','Datei',c.path)+'</div>'+
    inp('gh-token','Zugriffsschlüssel (Fine-grained Token)','','type="password" autocomplete="off" spellcheck="false" placeholder="'+(c.token?'gespeichert – leer lassen, um ihn zu behalten':'github_pat_…')+'"')+
    inp('gh-exp','Token gültig bis (für die Erinnerung)',c.tokenExp||'','type="date"')+
    '<div class="row"><button class="primary" data-act="ghSave">Speichern & verbinden</button>'+(ghReady()?'<button data-act="ghSyncNow">Jetzt abgleichen</button><button class="small danger" data-act="ghForget">Token von diesem Gerät entfernen</button>':'')+'</div>'+
    '<details><summary class="small">So erstellst du den Token (einmal pro Gerät eintragen)</summary><ol class="small">'+
      '<li>GitHub → Settings → Developer settings → Personal access tokens → <strong>Fine-grained tokens</strong> → Generate new token.</li>'+
      '<li>Repository access: <strong>Only select repositories</strong> → <code>'+esc(c.repo)+'</code>.</li>'+
      '<li>Permissions → Repository permissions → <strong>Contents: Read and write</strong> (sonst nichts).</li>'+
      '<li>Ablaufdatum wählen, Token kopieren und hier einfügen. Das Ablaufdatum oben eintragen – AOS erinnert dich zwei Wochen vorher.</li></ol>'+
      '<p class="small muted">Der Token bleibt nur auf diesem Gerät, steht in keiner Sicherung und wird nur an api.github.com gesendet. Er kann ausschließlich das Datenrepo lesen und schreiben.</p></details>'+
    '');
}
ACT.ghOpen = ()=>{ ui.view='profil'; location.hash='profil'; ui.profOpen=ui.profOpen||{}; ui.profOpen.gh=true; render(); const el=document.getElementById('gh-sec'); if(el) el.scrollIntoView(); };
ACT.ghSave = async ()=>{
  const owner=val('gh-owner'), repo=val('gh-repo'), branch=val('gh-branch')||'main', path=val('gh-path')||'aos-data.json', token=val('gh-token');
  if(!owner||!repo){ toast('Bitte Konto und Repo eintragen.'); return; }
  if(!token && !gh.cfg.token){ toast('Bitte den Token einfügen.'); return; }
  if(token && !/^(github_pat_|ghp_)[A-Za-z0-9_]+$/.test(token)){ toast('Das sieht nicht nach einem GitHub-Token aus (beginnt mit github_pat_).'); return; }
  Object.assign(gh.cfg, { owner, repo, branch, path, tokenExp:val('gh-exp')||null }); if(token) gh.cfg.token=token;
  ghStore(); render();
  const ok = await ghSync('einrichten');
  if(ok){ toast('Verbunden. Deine Daten sind jetzt im Datenrepo gespeichert.'); refLoad(true); }
  render();
};
ACT.syncInfo = ()=>{ if(!ghReady()){ toast('Nicht mit dem Datenrepo verbunden – Profil → Datenspeicherung.'); return; }
  const st=gh.state; const last=gh.lastOk?'zuletzt gespeichert '+ghTime(gh.lastOk):'noch nie gespeichert';
  const t={ ok:'Alles gespeichert'+(gh.lastOk?' · '+ghTime(gh.lastOk):''), laeuft:'Wird gerade gespeichert …', ausstehend:'Änderungen werden gleich gespeichert · '+last, offline:'Offline – wird gespeichert, sobald Netz da ist · '+last, fehler:'Speichern fehlgeschlagen – neuer Versuch läuft · '+last }[st]||last;
  toast(t); if(['ausstehend','fehler','offline'].includes(st) && !gh.syncing) ghSync('manuell'); };
ACT.ghSyncNow = async ()=>{ const ok=await ghSync('manuell'); if(ok){ toast('Abgeglichen.'); refLoad(true); } };
ACT.ghForget = ()=>confirmDlg('Token entfernen?', 'AOS speichert auf diesem Gerät dann nur noch lokal, bis du wieder einen Token einträgst. Die Daten im Datenrepo bleiben unverändert.'+(gh.dirty?' <strong>Achtung: Es gibt noch nicht abgeglichene Änderungen.</strong>':''), 'Entfernen', ()=>{ gh.cfg.token=''; ghStore(); ghSetState('aus'); render(); }, true);

/* Automatisch abgleichen: beim Start, beim Zurückkehren in die App, wenn wieder Netz da ist, und vor dem Verlassen */
document.addEventListener('visibilitychange', ()=>{
  if(!ghReady()) return;
  if(document.visibilityState==='visible'){ refLoad(); if(!gh.lastOk || Date.now()-new Date(gh.lastOk).getTime()>20000 || gh.dirty) ghSync('fokus'); }
  else if(gh.dirty) ghSync('verlassen');
});
window.addEventListener('online', ()=>{ if(ghReady()) ghSync('online'); });
window.addEventListener('offline', ()=>{ if(ghReady()) ghSetState('offline'); });

/* Neue App-Version laden, sobald nichts Ungespeichertes offen ist */
function aosApplyUpdate(){
  if(!window.__aosUpdate) return;
  const dlg=document.getElementById('dlg');
  if(ui.draft || (dlg && dlg.open)){ if(!window.__aosUpdateToast){ window.__aosUpdateToast=true; toast('Neue AOS-Version verfügbar – sie wird geladen, sobald du gespeichert hast.'); } return; }
  const go=()=>location.reload();
  if(ghReady() && gh.dirty) ghSync('update').finally(go); else go();
}
(function init(){
  ghLoad(); load(); refInit();
  const h=location.hash.slice(1); if(VIEWS.some(v=>v[0]===h)) ui.view=h;
  render();
  if(ghReady()){ ghSync('start'); refLoad(); }
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost' || location.hostname==='127.0.0.1') && document.querySelector('link[rel=manifest]')){
    const hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{ reg.update().catch(()=>{});
      // Beim Zurückkehren in die App nach einer neuen Version suchen
      document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') reg.update().catch(()=>{}); });
    }).catch(e=>console.warn('Offline-Modus nicht verfügbar', e));
    navigator.serviceWorker.addEventListener('controllerchange', ()=>{ if(!hadController) return; window.__aosUpdate=true; aosApplyUpdate(); });
  }
})();
</script>
</body>
</html>
