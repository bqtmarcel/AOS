<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=7">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=7">
<meta name="theme-color" content="#0e0f10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AOS">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; manifest-src 'self'; worker-src 'self'; connect-src https://sraocwhvkisomjjoqznr.supabase.co https://world.openfoodfacts.org https://raw.githubusercontent.com; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>AOS – Athlete Operating System</title>
<style>
/* ===== AOS Design: Anthrazit, metallisch, monochrom =====
   Einziger Farbfleck ist das blinkende T im Kopf. Tiefe kommt aus Flächenstufen und Haarlinien, nicht aus Schatten oder Leuchten. */
:root{
  color-scheme: dark;
  --bg:#141517; --bg-deep:#0e0f10;
  --surface:#1c1e21; --surface-top:#212428; --surface2:#26292d; --surface3:#2f3237;
  --text:#ececee; --text2:#b4b7bc; --muted:#8f9298; --faint:#7d8086;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14); --hi:inset 0 1px 0 rgba(255,255,255,.06);
  --metal:linear-gradient(180deg,#eef0f2,#c6c9ce); --metal-press:linear-gradient(180deg,#d3d6da,#b3b7bd); --metal-ink:#121315;
  --accent:#e6e7e9; --accent-ink:#121315; --accent-soft:rgba(255,255,255,.07);
  --sig:#d4d6da; --sig-deep:#8e9197; --sig-ink:#121315; --sig-soft:rgba(255,255,255,.08);
  --warn:#e6e7e9; --warn-soft:rgba(255,255,255,.06); --bad:#f2f2f3; --bad-soft:rgba(255,255,255,.06);
  --info:#b4b7bc; --info-soft:rgba(255,255,255,.04);
  --r-ctl:10px; --r-card:14px; --r-panel:16px;
  --ease:cubic-bezier(.22,1,.36,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Helvetica Neue",Arial,sans-serif;
  --mono:"SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
a{color:var(--text)}
::selection{background:#e6e7e9;color:#121315}
p{margin:4px 0}
strong{font-weight:600}
hr{border:0;border-top:1px solid var(--line)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Vereinslogo als Hintergrund (Red Tigers, mit Erlaubnis des Vereins) – monochrom */
body::before{content:'';position:fixed;z-index:-1;pointer-events:none;right:-22vw;bottom:9vh;width:min(110vw,760px);aspect-ratio:593/445;background:url('img/tiger.png?v=1') center/contain no-repeat;opacity:.06;filter:grayscale(1) brightness(1.6) contrast(.9)}
@media (min-width:900px){body::before{right:-6vw;bottom:6vh;opacity:.05}}

/* Kopf */
header.top{position:sticky;top:0;z-index:20;background:var(--bg-deep);border-bottom:1px solid var(--line)}
.top-inner{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:12px 20px}
.brand{display:flex;align-items:center;line-height:1}
.brand .b-word{font-weight:600;font-size:1.15rem;letter-spacing:.08em;color:var(--text)}
.brand .b-cur{display:inline-block;width:1.05rem;height:1.05rem;margin-left:4px;background:url('img/t.png?v=1') center/contain no-repeat;animation:bcur 1.2s steps(1) infinite}
.brand small{margin-left:12px;padding-left:12px;border-left:1px solid var(--line2);font-size:.7rem;color:var(--muted);font-weight:400;line-height:1.3;text-align:left}
.brand small span{display:block;white-space:nowrap}
@keyframes bcur{50%{opacity:.25}}
#topinfo{margin-left:auto}
@media (min-width:761px){#topinfo{order:3;margin-left:0}}
.sysbar{display:flex;gap:10px;font-size:.75rem;color:var(--muted);white-space:nowrap}
.sysbar .sync-btn{background:none;border:0;box-shadow:none;padding:10px;margin:-10px;min-height:0;min-width:0;color:inherit}
.sysbar .sd{font-size:.8rem;line-height:1}
.sysbar .sd.ok,.sysbar .sd.run{color:var(--text2)} .sysbar .sd.err{color:var(--text)} .sysbar .sd.off{color:var(--faint)}

/* Navigation */
nav.tabs{display:flex;gap:4px;margin-left:auto;padding:4px;border-radius:var(--r-ctl);background:var(--surface);border:1px solid var(--line)}
nav.tabs button{display:flex;justify-content:center;align-items:center;min-height:40px;padding:8px 14px;border:0;border-radius:8px;background:transparent;color:var(--muted);box-shadow:none}
nav.tabs button:hover{color:var(--text)}
nav.tabs button svg{width:22px;height:22px;flex:none}
nav.tabs button svg .f{fill:currentColor;stroke:none}
nav.tabs button[aria-current="page"]{background:var(--surface3);color:var(--text);box-shadow:var(--hi)}

/* Seite */
main{max-width:980px;margin:0 auto;padding:24px 16px 96px;overflow-wrap:break-word}
h1{font-size:1.6rem;font-weight:500;line-height:1.15;margin:8px 0 20px;color:var(--text)}
h2{font-size:.95rem;font-weight:500;color:var(--text2);margin:32px 0 10px}
h3{font-size:.95rem;font-weight:600;margin:16px 0 6px}
.small{font-size:.84rem}
.muted{color:var(--muted)}
.eyebrow{font-size:.8rem;font-weight:400;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}

/* Flächen: Anthrazit mit leichtem Metallverlauf und Haarlinie */
.section,.ex{background:linear-gradient(180deg,var(--surface-top),var(--surface) 64px);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--hi)}
.section{padding:16px;margin:12px 0}
.ex{padding:16px;margin:12px 0}
.hero{padding:20px 16px 16px}
.hero .hero-title{font-size:1.3rem;font-weight:500;line-height:1.25;margin:8px 0 4px}
.hero .hero-sub{color:var(--muted);font-size:.9rem}
.hero .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--text);margin-right:8px;vertical-align:2px}
.empty{padding:16px;margin:12px 0;border:1px dashed var(--line2);border-radius:var(--r-card);color:var(--muted)}
.note{margin:8px 0;padding:10px 12px;border-radius:var(--r-ctl);background:var(--surface2);border-left:2px solid var(--line2);font-size:.88rem}
.note.warn,.note.bad{border-left-color:var(--text);background:var(--surface2)}
.field-card{border-color:var(--line2)}

/* Knöpfe */
button,.btn{font:inherit;font-size:.9rem;font-weight:500;cursor:pointer;color:var(--text);padding:10px 16px;min-height:44px;border-radius:var(--r-ctl);
  background:linear-gradient(180deg,var(--surface3),var(--surface2));border:1px solid var(--line2);box-shadow:var(--hi);
  transition:background-color .15s var(--ease),border-color .15s var(--ease),transform .12s var(--ease)}
button:hover{border-color:rgba(255,255,255,.22)}
button:active{transform:scale(.98)}
button:disabled{opacity:.5;cursor:not-allowed}
button.primary{background:var(--metal);color:var(--metal-ink);border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
button.primary:active{background:var(--metal-press)}
button.block{display:block;width:100%}
button.danger{color:var(--text)}
button.small{padding:6px 12px;min-height:36px;font-size:.84rem}
button.link{background:none;border:0;box-shadow:none;text-decoration:none;border-bottom:1px solid var(--line2);border-radius:0;padding:2px 0;margin:0 2px;min-height:auto}
button.chip{background:var(--surface2);border:1px solid var(--line2);border-radius:8px;min-height:40px;padding:7px 12px;margin:3px 4px 3px 0;font-size:.88rem;box-shadow:none}
button.chip[aria-pressed="true"]{background:var(--metal);color:var(--metal-ink);border-color:transparent;font-weight:600}
button.chip[aria-pressed="true"] .muted{color:inherit}
button.ph{font-size:1rem;font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Felder */
label{display:block;font-size:.8rem;font-weight:400;color:var(--muted);margin:10px 0 4px}
input,select,textarea{font:inherit;font-size:16px;width:100%;color:var(--text);background:var(--bg-deep);border:1px solid var(--line2);border-radius:var(--r-ctl);padding:10px 12px;min-height:48px;font-variant-numeric:tabular-nums}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
input::placeholder{color:var(--faint)}
textarea{resize:vertical}
select{-webkit-appearance:none;appearance:none;padding-right:36px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
input[type=checkbox]{width:auto;min-height:auto;transform:scale(1.25);margin-right:8px;accent-color:#d4d6da}
input[type=date]{max-width:100%;appearance:none;text-align:left}
.field{margin:8px 0;min-width:0}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px 12px}
details summary{cursor:pointer;margin:6px 0;color:var(--muted);font-size:.84rem;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:'+';display:inline-block;width:16px;color:var(--text)}
details[open]>summary::before{content:'–'}

/* Kennzeichen: leise Textmarken statt Pillen */
.badge,.cap{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:.75rem;font-weight:500;color:var(--text2);background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.badge.ok{color:var(--text)} .badge.warn,.badge.bad{color:var(--text);border-color:var(--line2)}
.syncchip{font:inherit;font-size:.78rem;line-height:1.3;min-height:0;padding:3px 10px;border-radius:6px;white-space:nowrap;box-shadow:none}
.syncchip.warn,.syncchip.bad,.syncchip.info{background:var(--surface2);color:var(--text2)}

/* Wochenstreifen */
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin:6px 0 4px}
.weekstrip .day{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;padding:8px 0 10px;border-radius:var(--r-ctl);background:transparent;border:0;min-height:auto}
.weekstrip .day[data-act]{cursor:pointer}
.weekstrip .day .wd{font-size:.72rem;color:var(--faint)}
.weekstrip .day .dn{font-size:1.05rem;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.weekstrip .day .tp{font-size:.72rem;font-weight:600;min-height:1em}
.weekstrip .day .tp.done{color:var(--muted)}
.weekstrip .day.today{background:var(--surface2);box-shadow:var(--hi),inset 0 0 0 1px var(--line2)}
.weekstrip .day.today .dn{color:var(--text);font-weight:600}
.weekstrip .day.today .wd{color:var(--text2)}
.weekstrip .day .tp.claw-tp{display:flex;justify-content:center;align-items:center;gap:1px;color:var(--muted)}
.weekstrip .day .tp .claw{width:18px;height:18px;margin-top:1px}
.claw{fill:none;stroke:currentColor;stroke-linecap:round;stroke-width:2.4}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day.unavail{background:repeating-linear-gradient(45deg,var(--surface2),var(--surface2) 6px,var(--surface) 6px,var(--surface) 12px)}
.day.today{border-color:var(--line2)}
.day h4{margin:0 0 6px;font-size:.85rem;display:flex;justify-content:space-between;gap:4px;flex-wrap:wrap}
.chips5{display:flex;gap:6px}.chips5 .chip{flex:1;margin:3px 0;font-size:1.1rem;font-weight:600;min-height:52px;font-variant-numeric:tabular-nums}
.chips7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.chips7 .chip{margin:0;padding-left:0;padding-right:0;min-width:0}
.chips10{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.chips10 .chip{margin:0;min-height:44px;font-weight:600;font-variant-numeric:tabular-nums}

/* Heute-Karte */
.today-card .hero-sub{margin-bottom:12px}
.tc-row{border-top:1px solid var(--line);padding:12px 0}
.tc-k{font-size:.8rem;color:var(--muted)}
.tc-weight{display:flex;align-items:center;gap:12px}
.tc-weight .tc-k{width:72px;flex:none}
.tc-weight>span:nth-child(2){flex:1}
.tc-hints{border-top:1px solid var(--line);padding:10px 0 2px;font-size:.8rem;color:var(--muted);display:grid;gap:4px}
.tc-btn{margin-top:12px}
.tc-phase{font-size:.8rem;color:var(--muted);margin:2px 0 8px}
.tc-phase b{color:var(--text);font-weight:600}
.tc-kcal{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:.85rem;color:var(--muted)}
.tc-kcal b{color:var(--text);font-size:1.05rem;font-weight:600}
.tc-cd{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.motto{margin-top:12px;font-size:.75rem;color:var(--faint);text-align:center;white-space:nowrap}
.motto b{color:var(--text2);font-weight:500}

/* Countdown */
.cd{display:flex;align-items:center;justify-content:space-between;gap:12px}
.cd-k{display:flex;flex-direction:column;gap:2px;min-width:0}
.cd-k span{font-size:.8rem;color:var(--text2);font-weight:500}
.cd-k small{font-size:.75rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd-v{display:flex;gap:8px;flex-shrink:0}
.cd-seg{display:flex;flex-direction:column;align-items:center;line-height:1}
.cd-seg b{font-family:var(--mono);font-size:1.6rem;font-weight:500;color:var(--text);font-variant-numeric:tabular-nums}
.cd-seg small{font-size:.66rem;color:var(--faint);margin-top:4px}
.cd.is-live{flex-direction:column;align-items:stretch}
.cd.is-live .cd-v{justify-content:space-between;gap:4px}
.cd.is-live .cd-seg{flex:1;padding:8px 0;border-radius:var(--r-ctl);background:var(--surface2);box-shadow:var(--hi)}
.cd.is-live .cd-seg b{font-size:1.45rem}
.cd-plan .cd-seg b{font-size:2rem}

/* Übungen und Sätze */
.ex-head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.ex-name{font-weight:600;font-size:1rem}
.plan-hint{color:var(--muted);font-size:.8rem}
.last-perf{font-size:.8rem;color:var(--muted);margin:2px 0 8px}.last-perf strong{color:var(--text);font-weight:600}
.plates{font-family:var(--mono);font-size:.78rem;color:var(--text2);margin:4px 0 0;font-variant-numeric:tabular-nums}
.setrow{display:grid;grid-template-columns:32px repeat(var(--n,3),minmax(0,1fr));gap:8px;margin:6px 0;align-items:end}
.setrow .lbl{font-family:var(--mono);font-size:.85rem;color:var(--faint);padding-bottom:16px;text-align:center}
.setrow.wu .lbl{color:var(--muted)}
.setrow.wu input{background:transparent;border-style:dashed}
.setrow label{margin:0 0 4px;text-align:center}
.setrow input{text-align:center;font-size:1.15rem;font-weight:500;min-height:52px}
.wu-tag{display:block;font-size:.75rem;color:var(--faint);text-align:center;padding-bottom:16px}

/* Laufende Einheit */
.live-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 4px;padding:10px 12px;border-radius:var(--r-ctl);background:var(--surface2);box-shadow:var(--hi);border:1px solid var(--line)}
.live-head span{font-size:.8rem;color:var(--muted)}
.live-head b,.live-bar b{font-family:var(--mono);font-weight:500;font-size:1.05rem;font-variant-numeric:tabular-nums;color:var(--text)}
.live-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin:0 0 12px;text-align:left}
.live-bar span{color:var(--text2)}
.log-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.log-actions .primary{grid-column:1/-1}

/* Pausentimer */
#rest-bar{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:40;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px;border-radius:var(--r-panel);background:var(--surface2);border:1px solid var(--line2);box-shadow:var(--hi),0 8px 24px rgba(0,0,0,.4);overflow:hidden}
#rest-bar .rb-l{font-size:.8rem;color:var(--muted)}
#rest-bar .rb-t{font-family:var(--mono);font-size:1.35rem;font-weight:500;font-variant-numeric:tabular-nums}
#rest-bar .rb-z{flex:1;font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rest-bar button{padding:0 12px}
#rest-bar i{position:absolute;left:0;bottom:0;height:2px;background:var(--muted)}
#rest-bar.ok i{background:var(--text)} #rest-bar.ok .rb-t{color:var(--text)}
#rest-bar.go{background:var(--metal);border-color:transparent}
#rest-bar.go .rb-l,#rest-bar.go .rb-t,#rest-bar.go .rb-z{color:var(--metal-ink)}
#rest-bar.go i{background:var(--metal-ink)}
#rest-bar.alarm{animation:alarm .5s steps(1) 6}
@keyframes alarm{50%{background:#fff;border-color:#fff}}
body:has(#rest-bar) .toast{bottom:calc(172px + env(safe-area-inset-bottom))}
body:has(#rest-bar) main{padding-bottom:calc(190px + env(safe-area-inset-bottom))!important}
@media (min-width:761px){#rest-bar{left:50%;right:auto;transform:translateX(-50%);bottom:24px;width:min(560px,90vw)}}

/* Tabellen */
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;vertical-align:top;border-bottom:1px solid var(--line);padding:9px 6px}
th{font-size:.78rem;color:var(--muted);font-weight:500}
td{font-variant-numeric:tabular-nums}
.table-wrap{overflow-x:auto}
main table:not(.stack){max-width:100%}
main table:not(.stack) td{overflow-wrap:anywhere}
table.supw td,table.supw th{text-align:center;padding:6px 2px}table.supw td:first-child,table.supw th:first-child{text-align:left}
table.wgrid td,table.wgrid th{white-space:nowrap;padding-left:4px;padding-right:4px}
table.wgrid td[colspan]{white-space:normal}
table.wgrid td:first-child{font-size:.75rem}
table.wgrid tr:has(+tr.wk-sub)>td{border-bottom:0;padding-bottom:2px}table.wgrid tr.wk-sub td{padding-top:0;font-size:.78rem}
pre.out{white-space:pre-wrap;font-family:var(--mono);font-size:.85rem;background:var(--bg-deep);border-radius:var(--r-ctl);padding:12px;border:1px solid var(--line);max-height:60vh;overflow:auto}

/* Dialog, Meldung */
dialog{padding:0;max-width:720px;width:calc(100% - 24px);color:var(--text);background:var(--surface);border:1px solid var(--line2);border-radius:var(--r-panel);box-shadow:var(--hi)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2;background:var(--surface)}
.dlg-head h2{margin:0;font-size:1.05rem;color:var(--text)}
.dlg-body{padding:12px 16px;max-height:75vh;overflow:auto}
.dlg-foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line);background:var(--surface)}
.toast{position:fixed;left:50%;transform:translateX(-50%);z-index:100;font-size:.9rem;max-width:90vw;font-weight:500;padding:10px 16px;border-radius:var(--r-ctl);background:var(--metal);color:var(--metal-ink);bottom:calc(104px + env(safe-area-inset-bottom))}

/* Diagramme */
.chart{display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--mono)}
.chart .gl{stroke:var(--line)}
.chart .ln{fill:none;stroke:var(--text);stroke-width:2}
.chart .pt{fill:var(--text)}
.chart .goal{stroke:var(--muted);stroke-dasharray:5 4;stroke-width:1.5}
.chart .ln-raw{stroke:var(--muted);stroke-width:1;opacity:.5}.chart .pt-raw{fill:var(--muted)}.chart .ln-trend{stroke-width:2.5}
.chart .bar-gym{fill:#d4d6da}.chart .bar-field{fill:#5d6066}
.lg{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px 0 6px;vertical-align:-1px}.lg-gym{background:#d4d6da}.lg-field{background:#5d6066}
.goal-row{padding:10px 0;border-bottom:1px solid var(--line)}.goal-row:last-of-type{border-bottom:0}
.goal-bar{height:6px;border-radius:3px;background:var(--surface3);overflow:hidden;margin:8px 0 4px}.goal-bar i{display:block;height:100%;background:var(--text);border-radius:3px}

/* Ernährung */
.off-box{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.off-list{display:grid;gap:6px;margin-top:8px}

<noscript><p style="padding:20px">AOS benötigt JavaScript. Bitte im Browser aktivieren.</p></noscript>
<script>
'use strict';
/* ===== AOS – Kern: Hilfsfunktionen, Datenmodell, Speicherung ===== */
const AOS_KEY = 'aos-data-v1';
const SCHEMA_VERSION = 3;
const SEED_TIME = '1970-01-01T00:00:00.000Z'; /* Ausgangsdaten gelten als "nie geändert" */
function slug(s){ return String(s).toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }
const WD = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const WD_LONG = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const STATUS_LABEL = {geplant:'geplant', absolviert:'absolviert', teilweise:'teilweise absolviert', ausgelassen:'ausgelassen'};
const TEST_CATS = ['Kraft','Sprung & Power','Sprint','Körpergewicht','Sonstige Athletik'];
const FORM_LABEL = {1:'1 – sehr schlecht',2:'2 – eher schlecht',3:'3 – normal',4:'4 – gut',5:'5 – sehr gut'};

function uid(p){ return (p||'id') + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pad(n){ return String(n).padStart(2,'0'); }
function isoOf(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function todayISO(){ return isoOf(new Date()); }
function parseISO(s){ if(!s) return null; const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(iso,n){ const d=parseISO(iso); d.setDate(d.getDate()+n); return isoOf(d); }
function mondayOf(iso){ const d=parseISO(iso); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); return isoOf(d); }
function weekdayOf(iso){ return parseISO(iso).getDay(); }
function fmtDate(iso){ if(!iso) return '—'; const d=parseISO(iso); return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear(); }
function fmtDateShort(iso){ if(!iso) return '—'; const d=parseISO(iso); return WD[d.getDay()]+' '+pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'; }
function daysBetween(a,b){ return Math.round((parseISO(b)-parseISO(a))/86400000); }
/* Zahlen mit Komma oder Punkt; leer => null (niemals schätzen) */
function num(v){ if(v===null||v===undefined) return null; const s=String(v).trim().replace(',','.'); if(s==='') return null; const n=Number(s); return isFinite(n)?n:null; }
function fmtNum(n){ if(n===null||n===undefined||n==='') return ''; return String(Math.round(n*100)/100).replace('.',','); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }

/* ---------- Ausgangsdaten ----------
   Bewusst neutral: Dieses Repo ist öffentlich. Persönliche Werte (Profil, Tests, Ziele, Blöcke …)
   liegen ausschließlich im privaten Datenrepo und kommen beim ersten Abgleich auf das Gerät. */
function seedData(){
  const now = new Date().toISOString();
  return {
    schemaVersion: SCHEMA_VERSION,
    meta: { createdAt: now, updatedAt: now, app:'AOS – Athlete Operating System' },
    profile: { name:'', birthYear:null, heightCm:null, targetWeightKg:null, positions:[], locations:[], trainingDays:['MON','TUE','THU','FRI'], experience:'fortgeschritten', cleanSafe:false, planEngine:'gruppen', planEngineSince:'' },
    goals: [], tests: [], bodyweight: [], blocks: [], sessions: [],
    unavailable: [], suggestionDecisions: {}, calendar: [],
    nutrition: defaultNutrition(),
    push: pushDefaults(), pushAgenda: { from:'', days:[] },
    settings: { seededAt: now }
  };
}
/* Neue Geräte bekommen ältere Zeitstempel als alles im Datenrepo: Beim ersten Abgleich gewinnt immer der gespeicherte Stand. */
const FRESH_TIME = '0000-01-01T00:00:00.000Z';
function freshData(){ const d=seedData(); syncStampAll(d, FRESH_TIME); return migrate(d); }   // migrate ergänzt u. a. die Standard-Trainingsorte

/* ---------- Speicher ---------- */
let S = null;
let storageOK = true;
function storageAvailable(){ try{ const k='__aos_t'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }catch(e){ return false; } }
function load(){
  storageOK = storageAvailable();
  let raw = null;
  if(storageOK){ try{ raw = localStorage.getItem(AOS_KEY); }catch(e){ raw=null; } }
  if(raw){
    try{ const d = JSON.parse(raw); const v = validateData(d); if(v.ok){ S = migrate(d); syncInit(); return; } console.warn('Ungültige gespeicherte Daten', v.errors); }
    catch(e){ console.warn('Gespeicherte Daten nicht lesbar', e); }
    // Defekte Daten nicht überschreiben: sichern
    try{ localStorage.setItem(AOS_KEY+'-defekt-'+Date.now(), raw); }catch(e){}
  }
  S = freshData();
  syncInit();
  save(true);
}
function save(silent){
  S.meta.updatedAt = new Date().toISOString();
  pushAgendaUpdate();
  const changed = syncTrack();
  if(changed && typeof sbOnLocalChange==='function') sbOnLocalChange();
  if(!storageOK) return false;
  try{ localStorage.setItem(AOS_KEY, JSON.stringify(S)); return true; }
  catch(e){ storageOK=false; if(!silent) toast('Speichern auf dem Gerät fehlgeschlagen'+(sbReady()?' – der Abgleich mit deinem AOS-Konto läuft weiter.':' – bitte jetzt eine JSON-Sicherung exportieren.')); return false; }
}
function migrate(d){
  // Platz für künftige Schema-Änderungen; fehlende Bereiche ergänzen statt Daten zu verwerfen
  d.unavailable = d.unavailable || [];
  d.fieldLogs = Array.isArray(d.fieldLogs) ? d.fieldLogs : [];
  d.calendar = Array.isArray(d.calendar) ? d.calendar : [];   // Kalender: Spieltage (Kickoff) und wichtige Termine   // Feldtraining (Football, Team): ein Eintrag pro Tag
  d.suggestionDecisions = d.suggestionDecisions || {};
  // Einheiten: Zwischenstand (draft) einer laufenden Einheit und getrennt gespeicherte Aufwärmsätze (warmup) – beides optional
  (d.sessions||[]).forEach(s=>{ if(s.draft!=null && (typeof s.draft!=='object' || !Array.isArray(s.draft.exercises))) delete s.draft;
    if(s.log && Array.isArray(s.log.exercises)) s.log.exercises.forEach(e=>{ if(e.warmup!=null && !Array.isArray(e.warmup)) delete e.warmup;
      (e.sets||[]).forEach(x=>{ if(x && x.rs!=null && !(typeof x.rs==='number' && x.rs>=0)) delete x.rs; }); }); });   // rs = gemessene Pause vor dem Satz (s)
  d.push = pushNormalize(d.push);   // Erinnerungen (Push): Einstellungen und Push-Abos der Geräte
  if(!d.pushAgenda || !Array.isArray(d.pushAgenda.days)) d.pushAgenda = { from:'', days:[] };   // vorberechnete Trainingstage für den Versand
  if(!d.nutrition || !Array.isArray(d.nutrition.items)) d.nutrition = defaultNutrition();
  const n=d.nutrition; n.combos=n.combos||[]; n.meals=n.meals||[]; n.templates=Array.isArray(n.templates)?n.templates:[]; n.dayOverrides=n.dayOverrides||{}; n.constraints=n.constraints||''; n.guides=n.guides||defaultNutrition().guides;
  Object.keys(n.dayOverrides).forEach(k=>{ if(typeof n.dayOverrides[k]!=='object' || n.dayOverrides[k]===null) n.dayOverrides[k]={}; });   // alte Tagesarten (Text) → neues Format
  d.settings = d.settings || {};
  (d.tests||[]).forEach(t=>{ if(t.name==='High-Bar Squatü') t.name='High-Bar Squat'; });   // Tippfehler aus der Ersterfassung
  // Trainingsorte: Public Gym, Home Gym, Feld (Name frei, Ausstattung als Freitext, Standard-Wochentage)
  d.profile.locations = Array.isArray(d.profile.locations) ? d.profile.locations : [];
  const L=d.profile.locations, has=id=>L.some(l=>l.id===id);
  if(!has('loc-public')) L.push({ id:'loc-public', name:'Public Gym', note:'', source:'standard' });
  if(!has('loc-own')) L.push({ id:'loc-own', name:'Home Gym', note:'', source:'standard' });
  if(!has('loc-field')){ L.push({ id:'loc-field', name:'Feld', note:'', source:'standard' });
    const rank={ 'loc-public':0, 'loc-own':1, 'loc-field':2 }; L.sort((a,b)=>(rank[a.id]??9)-(rank[b.id]??9)); }
  L.forEach(l=>{ if(l.id==='loc-own' && l.name==='Eigenes Gym') l.name='Home Gym'; if(typeof l.text!=='string') l.text=''; if(!Array.isArray(l.days)) l.days=[]; });
  d.blocks = Array.isArray(d.blocks) ? d.blocks : [];   // nur noch leerer Platzhalter (W3), Pläne erzeugt der Sessionplaner
  if(!d.sync) syncMigrateLegacy(d);
  cleanupLegacy(d);
  d.schemaVersion = SCHEMA_VERSION;
  return d;
}
/* Altdaten der früheren, von Hand geführten Planverwaltung entfernen (Backlog W3). Entfernte Datensätze bekommen eine
   Löschmarke, damit sie beim Abgleich mit iPhone/Laptop/Datenrepo nicht zurückkommen. Idempotent. */
function cleanupLegacy(d){
  const sy=d.sync; if(!sy) return; sy.stamps=sy.stamps||{}; sy.tombstones=sy.tombstones||{}; const now=new Date().toISOString();
  const tomb=k=>{ sy.tombstones[k]=now; delete sy.stamps[k]; };
  (d.blocks||[]).forEach(b=>tomb('blocks:'+b.id)); d.blocks=[];                         // alte Blöcke, Trainingstage, Änderungsprotokoll
  (d.unavailable||[]).forEach(x=>tomb('unavail:'+x)); d.unavailable=[];                 // alte „nicht verfügbar“-Tage (ersetzt durch Tag frei im Plan)
  Object.keys(d.suggestionDecisions||{}).forEach(k=>{ if(/^(deload|plan)\|/.test(k)){ tomb('decision:'+k); delete d.suggestionDecisions[k]; } });
  // Profil: Altfelder still entfernen, ohne den Zeitstempel zu erneuern – sonst überschreibt beim Abgleich die
  // frisch bereinigte (ältere) Fassung aus dem Datenrepo neuere Eingaben dieses Geräts (z. B. Ausstattung der Orte)
  const p=d.profile||{};
  ['positionHistory','sex','age'].forEach(f=>{ if(f in p) delete p[f]; });
  // alte Ausstattungsliste wurde nie ausgewertet – maßgeblich ist der Freitext (eine positive Liste würde dort alles andere ausschließen)
  (p.locations||[]).forEach(l=>{ if('equipment' in l) delete l.equipment; });
}
function validateData(d){
  const errors=[];
  if(!d || typeof d!=='object') return {ok:false, errors:['Die Datei enthält kein JSON-Objekt.']};
  if(typeof d.schemaVersion!=='number') errors.push('Feld „schemaVersion“ fehlt – das ist vermutlich keine AOS-Sicherung.');
  else if(d.schemaVersion>SCHEMA_VERSION) errors.push('Die Sicherung stammt aus einer neueren AOS-Version ('+d.schemaVersion+').');
  if(!d.profile || typeof d.profile!=='object') errors.push('Bereich „profile“ fehlt.');
  else if(!Array.isArray(d.profile.positions)) errors.push('Positionsliste fehlt im Profil.');
  ['goals','tests','bodyweight','blocks','sessions'].forEach(k=>{ if(!Array.isArray(d[k])) errors.push('Bereich „'+k+'“ fehlt oder ist keine Liste.'); });
  if(Array.isArray(d.blocks)) d.blocks.forEach((b,i)=>{ if(!b||!b.id||!Array.isArray(b.days)) errors.push('Trainingsblock '+(i+1)+' ist unvollständig.'); });

  return {ok: errors.length===0, errors};
}

const LOC_EQ = {

  field:['feld','rasen','kunstrasen','sprintstrecke','laufbahn'] };
const LOC_MOVE = {
  jump:{ label:'Sprünge', words:['sprung','sprünge','springen','jump','plyo','hüpf','hops'], test:e=>['jump','jump_loaded'].includes(e.pattern) },
  overhead:{ label:'Überkopf', words:['überkopf','ueberkopf','über kopf','overhead'], test:e=>e.pattern==='vertical_push' || e.id==='mb_slam' },

const LOC_ALWAYS = ['floor_space','wall','step','foot_anchor'];
const EQ_NAME = { barbell:'Langhantel', rack:'Rack', bench:'Bank', dumbbell:'Kurzhanteln', kettlebell:'Kettlebell', medball:'Medizinball', trap_bar:'Trap Bar', ssb:'SSB',
  landmine:'Landmine', cable:'Kabelzug', pull_up_bar:'Klimmzugstange', dip_bars:'Dip-Barren', box:'Box', belt_squat:'Belt Squat', leg_curl:'Beinbeuger-Maschine', lat_pulldown:'Latzug',
  shoulder_press_machine:'Schulterpresse', adductor_machine:'Adduktoren-Maschine', back_extension_bench:'Hyperextension', band:'Band', dip_belt:'Dipgürtel', plate:'Hantelscheiben', cones:'Hütchen', field:'Feld/Rasen' };
function locWordPos(clause, w){ const src = w.length<=3 ? '(^|[^a-zäöüß])'+w+'(?=$|[^a-zäöüß])' : '(^|[^a-zäöüß])'+w.replace(/[-\s]/g,'[-\\s]?');
  const m=new RegExp(src).exec(clause); return m ? m.index+m[1].length : -1; }
function locParse(text){
  const r={ empty:true, have:[], noEq:[], noMove:[] }; const t=String(text||'').toLowerCase().trim(); if(!t) return r; r.empty=false;
  // Satzteile; ein „kein/keine/ohne/nicht …“ gilt für alles danach im selben Satzteil („keine Sprünge oder Überkopf“)
  t.split(/[,;\n.\/+]|\s[–-]\s|\bund\b|\bsowie\b/).forEach(raw=>{ const c=' '+raw.trim()+' '; if(!raw.trim()) return;
    const nm=/(^|[^a-zäöüß])(kein|keine|keinen|keiner|ohne|nicht|kaum)(?=[^a-zäöüß]|$)/.exec(c); const negAt=nm?nm.index:-1;
    const isNeg=pos=> negAt>=0 && (pos>negAt || /\b(nicht|geht nicht|nicht möglich)\b/.test(c.slice(pos)));
    Object.entries(LOC_MOVE).forEach(([k,m])=>{ const ps=m.words.map(w=>locWordPos(c,w)).filter(x=>x>=0); if(ps.length && isNeg(Math.min(...ps))) r.noMove.push(k); });
    Object.entries(LOC_EQ).forEach(([k,ws])=>{ const ps=ws.map(w=>locWordPos(c,w)).filter(x=>x>=0); if(ps.length) (isNeg(Math.min(...ps))?r.noEq:r.have).push(k); }); });
  r.noMove=[...new Set(r.noMove)]; r.noEq=[...new Set(r.noEq)]; r.have=[...new Set(r.have)].filter(k=>!r.noEq.includes(k));
  return r; }
function locSummary(l){ const r=locParse(l.text); if(r.empty) return 'Leer – keine Einschränkung, alle Übungen möglich.';
  const out=[]; if(r.have.length) out.push('vorhanden: '+r.have.map(k=>EQ_NAME[k]).join(', ')+' (andere Geräte werden hier nicht geplant)');
  if(r.noEq.length) out.push('nicht vorhanden: '+r.noEq.map(k=>EQ_NAME[k]).join(', '));
  if(r.noMove.length) out.push('nicht möglich: '+r.noMove.map(k=>LOC_MOVE[k].label).join(', '));
  return out.length ? out.join(' · ') : 'Nichts erkannt – Text hat keine Auswirkung. Nenne Geräte (z. B. Langhantel, Rack, Kurzhanteln) oder „keine Sprünge“.'; }
/* Warum ist Übung e am Ort nicht möglich? null = möglich */
function locBlocks(e, r){ if(!r || r.empty) return null;
  for(const k of r.noMove) if(LOC_MOVE[k].test(e)) return LOC_MOVE[k].label+' nicht möglich';
  const eq=e.equipment||[]; const bad=eq.filter(q=>r.noEq.includes(q)); if(bad.length) return bad.map(q=>EQ_NAME[q]||q).join(', ')+' nicht vorhanden';
  if(r.have.length){ const ok=new Set(r.have.concat(LOC_ALWAYS)); if(r.have.includes('barbell')) ok.add('plate');
    const miss=eq.filter(q=>!ok.has(q)); if(miss.length) return miss.map(q=>EQ_NAME[q]||q).join(', ')+' nicht vorhanden'; }
  return null; }

'use strict';
/* ===== AOS – Änderungsverfolgung & Zusammenführen =====
   Jeder Eintrag (Einheit, Test, Mahlzeit …) ist ein "Datensatz" mit Schlüssel <bereich>:<id>.
   AOS merkt sich pro Datensatz, wann er zuletzt geändert (stamps) oder gelöscht (tombstones) wurde.
   Beim Zusammenführen gewinnt pro Datensatz die jüngste Änderung bzw. Löschung. */

const SYNC_ARRAYS = [
  ['goals','Ziele', d=>d.goals, (d,v)=>d.goals=v],
  ['tests','Testergebnisse', d=>d.tests, (d,v)=>d.tests=v],
  ['bodyweight','Körpergewichtsmessungen', d=>d.bodyweight, (d,v)=>d.bodyweight=v],
  ['blocks','Trainingsblöcke (inkl. Trainingstage & Übungen)', d=>d.blocks, (d,v)=>d.blocks=v],
  ['sessions','Trainingseinheiten', d=>d.sessions, (d,v)=>d.sessions=v],
  ['food','Ernährungsbausteine', d=>d.nutrition.items, (d,v)=>d.nutrition.items=v],
  ['combo','Ernährungskombinationen', d=>d.nutrition.combos, (d,v)=>d.nutrition.combos=v],
  ['mtpl','Gespeicherte Mahlzeiten', d=>d.nutrition.templates, (d,v)=>d.nutrition.templates=v],
  ['meal','Mahlzeiten', d=>d.nutrition.meals, (d,v)=>d.nutrition.meals=v],
  ['field','Feldtraining', d=>d.fieldLogs, (d,v)=>d.fieldLogs=v],
  ['cal','Kalender', d=>d.calendar, (d,v)=>d.calendar=v]
];

function syncRecords(d){
  const m=new Map();
  SYNC_ARRAYS.forEach(([c,,get])=>(get(d)||[]).forEach(r=>m.set(c+':'+r.id, r)));
  m.set('profile:_', d.profile);
  if(d.push) m.set('push:_', d.push);
  if(d.pushAgenda) m.set('pushag:_', d.pushAgenda);
  const n=d.nutrition; m.set('nutset:_', {guides:n.guides, guidesSource:n.guidesSource||'', constraints:n.constraints||''});
  (d.unavailable||[]).forEach(x=>m.set('unavail:'+x, true));
  Object.entries(d.suggestionDecisions||{}).forEach(([k,v])=>m.set('decision:'+k, v));
  Object.entries(n.dayOverrides||{}).forEach(([k,v])=>m.set('dayov:'+k, v));
  return m;
}
function applyRecords(d, m){
  SYNC_ARRAYS.forEach(([c,,,set])=>set(d, [...m].filter(([k])=>k.startsWith(c+':')).map(([,v])=>v)));
  if(m.has('profile:_')) d.profile=m.get('profile:_');
  if(m.has('push:_')) d.push=pushNormalize(m.get('push:_'));
  if(m.has('pushag:_')) d.pushAgenda=m.get('pushag:_');
  if(m.has('nutset:_')){ const x=m.get('nutset:_'); d.nutrition.guides=x.guides; d.nutrition.guidesSource=x.guidesSource; d.nutrition.constraints=x.constraints; }
  d.unavailable=[...m.keys()].filter(k=>k.startsWith('unavail:')).map(k=>k.slice(8)).sort();
  d.suggestionDecisions=Object.fromEntries([...m].filter(([k])=>k.startsWith('decision:')).map(([k,v])=>[k.slice(9),v]));
  d.nutrition.dayOverrides=Object.fromEntries([...m].filter(([k])=>k.startsWith('dayov:')).map(([k,v])=>[k.slice(6),v]));
}
function fp(v){ return JSON.stringify(v); }
function newDeviceId(){ return 'dev-'+Math.random().toString(36).slice(2,10); }
function syncStampAll(d, at){
  d.sync = d.sync || { stamps:{}, tombstones:{}, deviceId:newDeviceId() };
  syncRecords(d).forEach((v,k)=>{ d.sync.stamps[k]=at; });
}

/* Fingerabdrücke des zuletzt gespeicherten Stands (nur im Arbeitsspeicher) */
let lastFP = new Map();
function syncInit(){
  if(!S.sync) syncStampAll(S, S.meta.updatedAt||SEED_TIME);
  S.sync.stamps=S.sync.stamps||{}; S.sync.tombstones=S.sync.tombstones||{};
  lastFP=new Map(); syncRecords(S).forEach((v,k)=>{ lastFP.set(k, fp(v)); if(!S.sync.stamps[k]) S.sync.stamps[k]=S.meta.updatedAt||SEED_TIME; });
}
function syncTrack(){
  if(!S.sync) return false;
  const now=new Date().toISOString(); const cur=new Map(); let changed=false;
  syncRecords(S).forEach((v,k)=>{ const f=fp(v); cur.set(k,f);
    if(lastFP.get(k)!==f){ S.sync.stamps[k]=now; delete S.sync.tombstones[k]; changed=true; } });
  lastFP.forEach((f,k)=>{ if(!cur.has(k)){ S.sync.tombstones[k]=now; delete S.sync.stamps[k]; changed=true; } });
  lastFP=cur;
  return changed;
}

/* Ältere Daten (vor Version 3): Ausgangsdaten auf feste IDs umstellen, damit sie geräteübergreifend gleich sind */
function syncMigrateLegacy(d){
  const seed=seedData(); const remap={};
  const SRC='ausgangsdaten';
  d.tests.forEach(t=>{ if(t.source===SRC){ const nid='seed-test-'+slug(t.name)+'-'+(t.value==null?'x':t.value); if(seed.tests.some(x=>x.id===nid) && !d.tests.some(x=>x.id===nid)){ t.id=nid; } } });
  d.goals.forEach(g=>{ if(g.source===SRC){ const nid='seed-goal-'+slug(g.name); if(seed.goals.some(x=>x.id===nid) && !d.goals.some(x=>x.id===nid)) g.id=nid; } });
  const bw=d.bodyweight.find(x=>x.source===SRC); if(bw && !d.bodyweight.some(x=>x.id==='seed-bw-1')) bw.id='seed-bw-1';
  const b=d.blocks.find(x=>x.source===SRC);
  if(b && !d.blocks.some(x=>x.id==='seed-block-1')){
    remap[b.id]='seed-block-1'; b.id='seed-block-1';
    b.days.slice(0,4).forEach((day,i)=>{ const nid='seed-block-1-day-'+(i+1); remap[day.id]=nid; day.id=nid; });
  }
  d.sessions.forEach(s=>{ if(remap[s.blockId]) s.blockId=remap[s.blockId]; if(remap[s.dayId]) s.dayId=remap[s.dayId]; });
  const fr={};
  d.nutrition.items.forEach(f=>{ if(f.source===SRC){ const nid='seed-food-'+f.cat+'-'+slug(f.name); if(!d.nutrition.items.some(x=>x.id===nid)){ fr[f.id]=nid; f.id=nid; } } });
  const rm=a=>a.map(i=>fr[i]||i);
  d.nutrition.meals.forEach(m=>m.items=rm(m.items)); d.nutrition.combos.forEach(c=>c.items=rm(c.items));
  d.profile.positions.forEach(p=>{ if(p.code==='RB'&&!p.id.startsWith('seed')) p.id='seed-pos-rb'; if(p.code==='DE'&&!p.id.startsWith('seed')) p.id='seed-pos-de'; });
  // Zeitstempel: unveränderte Ausgangsdaten gelten als "nie geändert", alles andere als zuletzt gespeichert
  const norm=v=>JSON.stringify(v,(k,x)=>(k==='id'||k==='createdAt'||k==='replacedAt'||k==='version')?undefined:x);
  const sr=syncRecords(seed); const at=(d.meta&&d.meta.updatedAt)||new Date().toISOString();
  d.sync={ stamps:{}, tombstones:{}, deviceId:newDeviceId() };
  const same=new Map();
  syncRecords(d).forEach((v,k)=>{ const eq=sr.has(k) && norm(sr.get(k))===norm(v); if(eq) same.set(k, sr.get(k)); d.sync.stamps[k] = eq ? SEED_TIME : at; });
  // unveränderte Ausgangsdaten exakt auf den Standardstand bringen (gleiche IDs/Zeitfelder auf allen Geräten)
  if(same.size){ const m=syncRecords(d); same.forEach((v,k)=>m.set(k, clone(v))); applyRecords(d, m); }
}

/* Zusammenführen: lokaler Stand L + Datei R → neuer Stand + Bericht */
function mergeData(L, R){
  const lm=syncRecords(L), rm=syncRecords(R);
  const ls=L.sync.stamps, lt=L.sync.tombstones, rs=R.sync.stamps, rt=R.sync.tombstones;
  const keys=new Set([...lm.keys(), ...rm.keys(), ...Object.keys(lt), ...Object.keys(rt)]);
  const out=new Map(); const stamps={}, tombs={};
  const rep={ added:{}, updated:{}, deleted:{}, keptLocal:{}, total:0 };
  const inc=(o,k)=>{ const c=k.split(':')[0]; o[c]=(o[c]||0)+1; rep.total++; };
  // lokale Reihenfolge beibehalten, neue Einträge hinten anhängen
  const order=[...lm.keys(), ...[...rm.keys()].filter(k=>!lm.has(k))];
  const decide=k=>{
    const c=[];
    if(lm.has(k)) c.push({t:ls[k]||'', side:'L', del:false});
    if(lt[k]) c.push({t:lt[k], side:'L', del:true});
    if(rm.has(k)) c.push({t:rs[k]||'', side:'R', del:false});
    if(rt[k]) c.push({t:rt[k], side:'R', del:true});
    c.sort((a,b)=> a.t<b.t?1 : a.t>b.t?-1 : (a.side==='L'?-1:1));
    return c[0];
  };
  keys.forEach(k=>{
    const w=decide(k);
    if(w.del){ tombs[k]=[lt[k]||'',rt[k]||''].sort().pop(); if(lm.has(k)) inc(rep.deleted,k); return; }
    stamps[k]=w.t;
    if(w.side==='R'){ if(!lm.has(k)) inc(rep.added,k); else if(fp(lm.get(k))!==fp(rm.get(k))) inc(rep.updated,k); }
    else if(rm.has(k) && fp(lm.get(k))!==fp(rm.get(k))) inc(rep.keptLocal,k);
  });
  const m=new Map();
  order.forEach(k=>{ if(stamps[k]===undefined) return; const w=decide(k); m.set(k, clone(w.side==='R'?rm.get(k):lm.get(k))); });
  const res=clone(L); applyRecords(res, m);
  res.sync={ stamps, tombstones:tombs, deviceId:L.sync.deviceId, lastMerge:{ at:new Date().toISOString(), from:R.sync.deviceId||'', fileUpdatedAt:(R.meta&&R.meta.updatedAt)||'' } };
  return { data:res, report:rep };
}

/* ---------- Dateien & Zwischenablage ---------- */
function isIOS(){ return /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1); }
function isStandalone(){ return window.navigator.standalone===true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches); }
function download(filename, content, mime){
  const blob = new Blob([content], {type:(mime||'text/plain')+';charset=utf-8'});
  if(isIOS() && navigator.canShare && typeof File==='function'){
    try{ const file=new File([blob], filename, {type:blob.type});
      if(navigator.canShare({files:[file]})){ navigator.share({files:[file], title:filename}).catch(e=>{ if(e && e.name!=='AbortError') toast('Teilen nicht möglich: '+e.message); }); return; } }catch(e){}
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
async function copyText(text){
  try{ if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(text); toast('In die Zwischenablage kopiert.'); return true; } }catch(e){}
  const ta=document.createElement('textarea'); ta.value=text; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
  let ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
  ta.remove();
  toast(ok?'In die Zwischenablage kopiert.':'Kopieren nicht möglich – bitte den Text markieren und manuell kopieren.');

'use strict';
/* ===== AOS – Training protokollieren ===== */
const METRIC_FIELDS = {
  kraft:[['kg','kg','decimal'],['reps','Wdh','numeric'],['rpe','RPE','decimal']],
  zeit:[['time','Sek.','decimal'],['dist','Meter','decimal'],['rpe','RPE','decimal']],
  distanz:[['dist','Meter','decimal'],['time','Sek.','decimal'],['rpe','RPE','decimal']],
  sprung:[['height','cm','decimal'],['reps','Wdh','numeric']]   // Plyos: kein RPE
};
const SET_KEYS=['reps','kg','rpe','time','dist','height'];
function emptySet(){ return {reps:null,kg:null,rpe:null,time:null,dist:null,height:null}; }
function setHasData(x){ return SET_KEYS.some(k=>x[k]!=null); }

/* Übung in der Datenbank (Plan-ID, sonst gleicher Name) */
const LOAD_METHODS=['rpe_linear','wave','velocity','double','load_distance','load_time','reps_load'];
function exDb(e, pe){ if(typeof REF==='undefined' || !REF.exMap) return null; const id=pe&&pe.planner&&pe.planner.dbId;
  return (id&&REF.exMap[id]) || ((REF.ex&&REF.ex.exercises)||[]).find(x=>x.name_de===(e&&e.name)) || null; }
/* Lastart: 'bw' reines Körpergewicht (kein kg-Feld), 'added' Zusatzlast (Klimmzug/Dips mit Gewicht), 'load' normale Last */
function exKind(e, pe){
  const x=exDb(e,pe); const nm=((e&&e.name)||'')+' '+((e&&e.variant)||''); const added=/zusatz|weighted|mit last|mit gewicht|gewichtet/i.test(nm);
  if(x){ const eq=x.equipment||[]; const m=(pe&&pe.planner&&pe.planner.method)||(x.progression||[])[0];
    if(eq.includes('dip_belt')) return 'added';
    if(x.equipment_type==='bodyweight') return LOAD_METHODS.includes(m) ? (eq.includes('plate')?'added':'load') : (added?'added':'bw');
    return 'load'; }
  if(/klimmz|chin.?up|pull.?up|\bdips\b|liegestütz|push.?up|nordic|seitstütz|plank|knieheben|inverted row/i.test(nm)) return added?'added':'bw';
  return 'load';
}
function isPlyo(e, pe){ const x=exDb(e,pe); return (e&&e.metric)==='sprung' || !!(x && (x.pattern==='jump'||x.pattern==='jump_loaded')); }
function fieldsFor(e, pe){
  let F=METRIC_FIELDS[e.metric]||METRIC_FIELDS.kraft;
  if((e.metric||'kraft')==='kraft'){ const k=exKind(e,pe); if(k==='bw') F=F.filter(f=>f[0]!=='kg'); else if(k==='added') F=F.map(f=>f[0]==='kg'?['kg','+kg','decimal']:f); }
  if(isPlyo(e,pe)) F=F.filter(f=>f[0]!=='rpe');
  return F;
}

const LIVE_KEY='aos-live-v1';
function isLive(){ const s=ui.sessionId&&ui.draft&&sessionById(ui.sessionId); return !!(s&&!s.log); }
function logVisible(){ return ui.view==='training' && !!ui.sessionId && !!ui.draft && !ui.logHidden; }
function liveSave(){ try{ if(ui.sessionId&&ui.draft) localStorage.setItem(LIVE_KEY, JSON.stringify({ sessionId:ui.sessionId, draft:ui.draft })); else localStorage.removeItem(LIVE_KEY); }catch(e){} }
function liveRestore(){ try{ const L=JSON.parse(localStorage.getItem(LIVE_KEY)||'null'); if(!L||!L.draft) return false; const s=sessionById(L.sessionId);
  if(!s){ localStorage.removeItem(LIVE_KEY); return false; } ui.sessionId=L.sessionId; ui.draft=L.draft; ui.logHidden=false; return !s.log; }catch(e){ return false; } }
function clockTxt(iso){ const t=Math.max(0, Math.floor((Date.now()-new Date(iso).getTime())/1000)); const h=Math.floor(t/3600), m=Math.floor(t/60)%60, x=t%60;
  return (h?h+':'+pad(m):String(m))+':'+pad(x); }
function clockTick(){ document.querySelectorAll('[data-clock]').forEach(el=>{ el.textContent=clockTxt(el.dataset.clock); }); }

/* Bildschirm bleibt während der Einheit an, damit Pausentimer und Alarm weiterlaufen */
let WAKE=null;
async function wakeOn(){ try{ if(!WAKE && 'wakeLock' in navigator && document.visibilityState==='visible'){ WAKE=await navigator.wakeLock.request('screen'); WAKE.addEventListener('release',()=>{ WAKE=null; }); } }catch(e){ WAKE=null; } }

function draftFromLog(log){ const d=clone(log); d.exercises.forEach(e=>{ e.sets=(e.warmup||[]).map(x=>Object.assign(emptySet(),x,{wu:true})).concat(e.sets); delete e.warmup; }); return d; }
function startLog(id){
  const s=sessionById(id); if(!s) return;
  if(isLive() && ui.sessionId!==id){ const cur=sessionById(ui.sessionId); toast('„'+((cur.planner&&cur.planner.templateId)||cur.name)+'“ läuft noch – erst beenden oder abbrechen'); ACT.liveOpen(); return; }
  ui.view='training'; ui.logHidden=false; location.hash='training';
  if(ui.sessionId===id && ui.draft){ render(); window.scrollTo(0,0); return; }
  ui.sessionId=id;
  if(s.log) ui.draft=Object.assign(draftFromLog(s.log),{date:s.plannedDate||todayISO(), location:s.location||''});
  else if(s.draft && Array.isArray(s.draft.exercises)) ui.draft=clone(s.draft);   // zwischengespeichert, auch von einem anderen Gerät
  else ui.draft={ date:s.plannedDate||todayISO(), location:s.location||'', form:(s.planner&&s.planner.checkin&&s.planner.checkin.readiness)||null, durationMin:null, pain:'', notes:'', startedAt:new Date().toISOString(),
    exercises:s.plan.map(pe=>({planExId:pe.id, name:pe.name, variant:pe.variant, metric:pe.metric||'kraft',
      sets:warmupSets(pe).map(([w,r])=>Object.assign(emptySet(),{wu:true, pk:w, pr:r})).concat(Array.from({length:pe.sets||1},emptySet)), note:'', fast:null})) };
  render(); window.scrollTo(0,0);
}

/* ---------- Pausentimer: startet, sobald ein Satz eingetragen ist; Alarm mit Ton, Blinken und Mitteilung ---------- */
const REST={ start:0, min:0, max:0, key:'', iv:null, beeped:0, ac:null, label:'Pause', next:'' };
const WU_REST=[45,60];   // kurze Pause nach Aufwärmsätzen
function restRange(pe){ const m=String((pe&&pe.rest)||'').match(/(\d+)(?:\s*[–-]\s*(\d+))?/); if(!m) return [90,90]; const a=+m[1], b=m[2]?+m[2]:a; return [a,b]; }
/* Tatsächliche Pause messen: Zeit seit dem Eintrag des Vorsatzes derselben Übung minus geschätzte Satzdauer */
const LASTSET={ k:'', at:0 };
function restMeasure(ei, sj, pe){ const e=ui.draft.exercises[ei]; const x=e.sets[sj]; const pv=e.sets[sj-1];
  if(x.wu || !pv || pv.wu || LASTSET.k!==ei+'-'+(sj-1) || x.rs!=null) return;
  const role=(pe&&pe.planner&&pe.planner.role)||'assistance'; const work=(role==='power'?15:role==='main'?45:40)*(pe&&perSide(pe.reps)?2:1)+10;
  const gap=(Date.now()-LASTSET.at)/1000; if(gap<20 || gap>900) return; x.rs=Math.max(0, Math.round(gap-work)); }
function restMaybeStart(ei, sj, f, n){
  const s=sessionById(ui.sessionId); if(!s || s.log || typeof n!=='number' || Number.isNaN(n)) return;
  const e=ui.draft.exercises[ei]; const keys=(e.metric||'kraft')==='kraft' ? ['reps'] : ['reps',(METRIC_FIELDS[e.metric]||METRIC_FIELDS.kraft)[0][0]];
  if(!keys.includes(f)) return; const k=ei+'-'+sj; if(REST.key===k) return;
  const pe=(s.plan||[]).find(p=>p.id===e.planExId); const wu=!!e.sets[sj].wu;
  restMeasure(ei, sj, pe); LASTSET.k=k; LASTSET.at=Date.now();
  const [a,b]=wu?WU_REST:restRange(pe);
  // Nächster Satz für die Mitteilung
  let next=''; const nj=sj+1;
  if(nj<e.sets.length) next=e.name+' · '+(e.sets[nj].wu?'Aufwärmsatz':'Satz '+(nj-e.sets.filter(x=>x.wu).length+1));
  else if(ui.draft.exercises[ei+1]) next=ui.draft.exercises[ei+1].name;
  let label=wu?'Aufwärmpause':'Pause'; if(!wu){ try{ const r=learn().rest[(pe&&pe.planner&&pe.planner.role)||'assistance']; if(r&&r.warn) label='Volle Pause'; }catch(err){} }
  restStart(a,b,k,label,next);
}
function restStart(a,b,k,label,next){ Object.assign(REST,{ start:Date.now(), min:a, max:b, key:k||'', beeped:0, label:label||'Pause', next:next||'' });
  try{ if(!REST.ac){ const C=window.AudioContext||window.webkitAudioContext; if(C) REST.ac=new C(); } if(REST.ac && REST.ac.state==='suspended') REST.ac.resume(); }catch(e){}
  clearInterval(REST.iv); REST.iv=setInterval(restTick, 500); restTick(); }
function restBeep(n){ try{ navigator.vibrate && navigator.vibrate(n>1?[300,120,300,120,300]:[300,120,300]); const ac=REST.ac; if(!ac) return; if(ac.state==='suspended') ac.resume();
  for(let i=0;i<n+1;i++){ const o=ac.createOscillator(), g=ac.createGain(); o.type='square'; o.frequency.value=i%2?1175:880; o.connect(g); g.connect(ac.destination);
    const t=ac.currentTime+i*0.22; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.5,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.18); o.start(t); o.stop(t+0.2); } }catch(e){} }
function restNotify(){ try{ if(!('Notification' in window) || Notification.permission!=='granted' || !navigator.serviceWorker) return;
  navigator.serviceWorker.getRegistration().then(reg=>{ if(reg) reg.showNotification('Pause vorbei', { body:REST.next?'Weiter: '+REST.next:'Nächster Satz', tag:'aos-rest', renotify:true, icon:'./icon-192.png', data:{url:'#training'} }); }).catch(()=>{}); }catch(e){} }
function restAlarm(n){ restBeep(n); const el=document.getElementById('rest-bar'); if(el){ el.classList.remove('alarm'); void el.offsetWidth; el.classList.add('alarm'); } if(n===1) restNotify(); }
function restStop(){ clearInterval(REST.iv); REST.iv=null; REST.key=''; const el=document.getElementById('rest-bar'); if(el) el.remove(); }
function restTick(){
  if(!isLive()){ restStop(); return; }
  const sec=Math.floor((Date.now()-REST.start)/1000); const fmt=x=>Math.floor(x/60)+':'+String(x%60).padStart(2,'0');
  let el=document.getElementById('rest-bar');
  if(!el){ el=document.createElement('div'); el.id='rest-bar'; el.setAttribute('role','timer'); document.body.appendChild(el); }
  const st= sec>=REST.max ? 'go' : sec>=REST.min ? 'ok' : '';
  el.classList.toggle('ok', st==='ok'); el.classList.toggle('go', st==='go'); const pct=Math.min(100, sec/REST.max*100);
  el.innerHTML='<span class="rb-l">'+esc(REST.label)+'</span><span class="rb-t">'+fmt(sec)+'</span><span class="rb-z">'+(st==='go'?(REST.next?'Weiter: '+esc(REST.next):'Weiter'):'Ziel '+(REST.min===REST.max?fmt(REST.min):fmt(REST.min)+'–'+fmt(REST.max)))+'</span>'+
    '<button class="small" data-act="restPlus" aria-label="30 Sekunden länger">+30</button><button class="small" data-act="restStop" aria-label="Pause beenden">✕</button><i style="width:'+pct+'%"></i>';
  if(sec>=REST.min && REST.beeped<1){ REST.beeped=1; restAlarm(1); }
  if(REST.max>REST.min && sec>=REST.max && REST.beeped<2){ REST.beeped=2; restAlarm(2); }
}
ACT.restStop = ()=>restStop();
ACT.restPlus = ()=>{ REST.min+=30; REST.max+=30; if(REST.beeped>0 && (Date.now()-REST.start)/1000<REST.min) REST.beeped=0; restTick(); };
ACT.restNotifyAsk = async ()=>{ try{ const p=await Notification.requestPermission(); toast(p==='granted'?'Pausen-Alarm kommt jetzt auch als Mitteilung':'Mitteilungen nicht erlaubt – der Alarm kommt nur als Ton in der App'); }catch(e){} render(); };

/* ---------- Scheibenrechner: für jede Übung mit Hantelscheiben ---------- */
const PLATES=[25,20,15,10,5,2.5,1.25];
// Reihenfolge = Vorrang. side 2: Scheiben je Seite, side 1: ein Stapel. bar: Gewicht der Stange (im Protokoll-kg enthalten)
const PLATE_EQ=[ ['dip_belt',{bar:0,side:1,where:'am Gürtel'}], ['landmine',{bar:0,side:1,where:'am Stangenende'}], ['trap_bar',{bar:25,side:2,name:'Trap Bar'}],
  ['ssb',{bar:25,side:2,name:'SSB'}], ['belt_squat',{bar:0,side:2}], ['barbell',{bar:20,side:2,name:'Stange'}], ['plate',{bar:0,side:1}] ];
function plateSpec(e, pe){ const x=exDb(e,pe); if(!x){ if(e && exKind(e,pe)==='added') return PLATE_EQ[0][1]; return null; }
  const eq=x.equipment||[]; if(x.equipment_type==='bodyweight' && !eq.includes('plate')) return null;
  const hit=PLATE_EQ.find(([k])=>eq.includes(k)); return hit?hit[1]:null; }
function platesText(kg, sp){ if(!sp || kg==null || !(kg>0)) return ''; let rest=(kg-sp.bar)/sp.side;
  if(!(rest>0.001)) return sp.bar?(sp.name||'Stange')+' leer · '+fmtNum(sp.bar)+' kg':'';
  const out=[]; PLATES.forEach(p=>{ while(rest>=p-1e-9){ out.push(p); rest-=p; } });
  return fmtNum(kg)+' kg → '+(sp.side===2?'je Seite ':'Scheiben'+(sp.where?' '+sp.where:'')+' ')+out.map(fmtNum).join(' + ')+(rest>0.01?' (+'+fmtNum(Math.round(rest*sp.side*100)/100)+' kg fehlen)':'')+(sp.bar?' · '+(sp.name||'Stange')+' '+fmtNum(sp.bar)+' kg':''); }
function rowKg(e, j, pe, ar){ const x=e.sets[j]; if(!x) return null; if(typeof x.kg==='number' && !Number.isNaN(x.kg)) return x.kg; if(x.wu) return x.pk!=null?x.pk:null;
  if(ar && j>ar.from) return ar.kg; return pe&&pe.loadKg!=null?pe.loadKg:null; }
function platesUpdate(ei, j){ const el=document.getElementById('plates-'+ei); if(!el||!ui.draft) return; const s=sessionById(ui.sessionId); const e=ui.draft.exercises[ei]; if(!s||!e) return;
  const pe=(s.plan||[]).find(p=>p.id===e.planExId); const sp=plateSpec(e,pe); const ar=!s.log?autoreg(s,e):null;
  if(j==null){ const work=e.sets.map((x,k)=>[x,k]).filter(([x])=>!x.wu); const typed=work.filter(([x])=>typeof x.kg==='number'&&!Number.isNaN(x.kg)).slice(-1)[0]; j=typed?typed[1]:(work[0]?work[0][1]:0); }
  el.textContent=platesText(rowKg(e,j,pe,ar), sp); }

/* ---------- Aufwärmsätze zur Arbeitslast (Hauptübungen): stehen als eigene Zeilen vor den Arbeitssätzen ---------- */
function warmupSets(pe){ const kg=pe&&pe.loadKg; if(!(kg>=40) || !pe.planner || pe.planner.role!=='main') return [];
  const sp=plateSpec(null,pe); const bar=sp&&sp.side===2?sp.bar:0; const rd=x=>Math.round(x/2.5)*2.5; const out=[]; if(bar) out.push([bar,10]);
  [[0.4,5],[0.6,3],[0.8,2]].forEach(([p,r])=>{ const w=rd(kg*p); if(w>(out.length?out[out.length-1][0]:0) && w<kg && (!bar||w>bar)) out.push([w,r]); });
  return out; }

/* Letzte Leistung einer Übung (gleicher Name und Variante), ohne die aktuelle Einheit */
function lastPerf(e, excludeId){
  const key=e.name+'|'+(e.variant||'');
  const ss=loggedSessions().filter(s=>s.id!==excludeId).reverse();
  for(const s of ss){ const le=s.log.exercises.find(x=>x.name+'|'+(x.variant||'')===key); if(!le) continue;
    const sets=le.sets.filter(x=>Object.values(x).some(v=>v!=null)); if(!sets.length) continue;
    const withKg=sets.filter(x=>x.kg!=null);
    const top=withKg.length?withKg.reduce((a,b)=>(b.kg>a.kg||(b.kg===a.kg&&(b.reps||0)>(a.reps||0)))?b:a):sets[0];
    const same=sets.every(x=>x.kg===sets[0].kg && x.reps===sets[0].reps);
    const rp=sets.map(x=>x.rpe).filter(v=>v!=null); const rpMax=rp.length?Math.max(...rp):null;
    const txt=(same&&sets.length>1&&sets[0].reps!=null ? sets.length+' × '+istOf(Object.assign({},top,{rpe:rpMax})) : istOf(top)+(sets.length>1?' · '+sets.length+' Sätze':''));
    return { date:sessionDate(s), text:txt };
  }
  return null;
}

/* Autoregulation in der Einheit (Hauptübungen mit Lastvorgabe): Der letzte Satz mit kg + RPE entscheidet über die
   restlichen Sätze. Über der RPE-Obergrenze −5 %, mindestens 1 RPE über dem Ziel −2,5 %. Gesteigert wird hier nie. */
function autoreg(s, e){
  const pe=(s.plan||[]).find(p=>p.id===e.planExId); if(!pe || pe.loadKg==null || (e.metric||'kraft')!=='kraft' || !pe.planner || pe.planner.role!=='main') return null;
  const cap=(s.planner&&s.planner.cap!=null)?s.planner.cap:null; const tgt=pe.rpeTarget!=null?Number(String(pe.rpeTarget).replace(',','.')):null;
  let j=-1; e.sets.forEach((x,k)=>{ if(!x.wu && typeof x.kg==='number' && !isNaN(x.kg) && typeof x.rpe==='number' && !isNaN(x.rpe)) j=k; }); if(j<0) return null;
  const x=e.sets[j]; let p=0, why='';
  // Zu kurze Pause vor dem Satz: erst volle Pause, gleiche Last (außer deutlich über der Obergrenze)
  const [ra]=restRange(pe); const nW0=e.sets.filter(y=>y.wu).length;
  if(x.rs!=null && x.rs<0.8*ra && !(cap!=null && x.rpe>cap+1) && ((cap!=null && x.rpe>cap) || (tgt!=null && !isNaN(tgt) && x.rpe>=tgt+1)))
    return { from:j, kg:x.kg, text:'Satz '+(j-nW0+1)+': RPE '+fmtNum(x.rpe)+' nach nur '+fmtSec(x.rs)+' Pause (geplant ab '+fmtSec(ra)+'). Nimm die volle Pause und bleib bei '+fmtNum(x.kg)+' kg.' };
  if(cap!=null && x.rpe>cap){ p=0.05; why='über der Obergrenze RPE '+fmtNum(cap); }
  else if(tgt!=null && !isNaN(tgt) && x.rpe>=tgt+1){ p=0.025; why='deutlich über dem Ziel RPE '+fmtNum(tgt); }
  if(!p) return null;
  const inc=plInc(pe.planner.dbId); let kg=Math.round(x.kg*(1-p)/inc)*inc; if(kg>=x.kg) kg=x.kg-inc; if(kg<=0) return null;
  const nW=e.sets.filter(y=>y.wu).length;
  return { from:j, kg, text:'Satz '+(j-nW+1)+' lag mit RPE '+fmtNum(x.rpe)+' '+why+' → restliche Sätze '+fmtNum(kg)+' kg ('+(p===0.05?'−5 %':'−2,5 %')+').' };
}
function autoregUpdate(i){ const s=sessionById(ui.sessionId); if(!s||!ui.draft) return; const e=ui.draft.exercises[i]; const a=autoreg(s,e);
  const el=document.getElementById('ar-'+i); if(el){ el.textContent=a?a.text:''; el.hidden=!a; }
  const pe=(s.plan||[]).find(p=>p.id===e.planExId);
  e.sets.forEach((x,j)=>{ if(x.wu) return; const inp=document.getElementById('s-'+i+'-'+j+'-kg'); if(inp) inp.placeholder = (a && j>a.from) ? fmtNum(a.kg) : (pe&&pe.loadKg!=null&&pe.planner&&pe.planner.role==='main'?fmtNum(pe.loadKg):''); }); }
function updateDraftFromInput(t){
  const dr=ui.draft; if(!dr) return; const k=t.dataset.log;
  if(k==='set'){ const f=t.dataset.f; const v=t.value.trim(); const n = f==='reps' ? (v===''?null:(/^\d+$/.test(v)?parseInt(v,10):NaN)) : (v===''?null:(num(v)==null?NaN:num(v)));
    dr.exercises[+t.dataset.e].sets[+t.dataset.s][f]=n;
    restMaybeStart(+t.dataset.e, +t.dataset.s, f, n);
    if(f==='kg') platesUpdate(+t.dataset.e, +t.dataset.s);
    if(f==='kg'||f==='rpe') autoregUpdate(+t.dataset.e);
    if(f==='rpe'){ const s=sessionById(ui.sessionId); const cap=(s.planner&&s.planner.cap!=null)?s.planner.cap:capMax(blockById(s.blockId)); const over=cap!=null&&typeof n==='number'&&n>cap; t.style.borderColor=over?'var(--warn)':''; t.style.borderWidth=over?'2px':''; t.title=over?'über der RPE-Obergrenze':''; } }
  else if(k==='exnote') dr.exercises[+t.dataset.e].note=t.value;
  else if(k==='fast') dr.exercises[+t.dataset.e].fast = t.value==='' ? null : t.value==='ja';
  else if(k==='meta'){ const f=t.dataset.f;
    if(f==='form') dr.form=t.value===''?null:Number(t.value);
    else if(f==='durationMin') dr.durationMin=t.value.trim()===''?null:(/^\d+$/.test(t.value.trim())?parseInt(t.value,10):NaN);
    else dr[f]=t.value; }

function lineChart(points, opts){
  opts=opts||{}; const W=640,H=200,P={l:44,r:14,t:14,b:28};
  if(points.length<2) return '';
  const xs=points.map(p=>parseISO(p.x).getTime()); const ys=points.map(p=>p.y);
  let y0=Math.min(...ys), y1=Math.max(...ys); if(opts.goal!=null){ y0=Math.min(y0,opts.goal); y1=Math.max(y1,opts.goal); }
  if(y0===y1){ y0-=1; y1+=1; } const pad=(y1-y0)*0.1; y0-=pad; y1+=pad;
  const x0=Math.min(...xs), x1=Math.max(...xs)||x0+1;
  const X=t=>P.l+(x1===x0?0.5:(t-x0)/(x1-x0))*(W-P.l-P.r), Y=v=>H-P.b-(v-y0)/(y1-y0)*(H-P.t-P.b);
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opts.label||'Verlauf')+'">';
  for(let i=0;i<=3;i++){ const v=y0+(y1-y0)*i/3; s+='<line class="gl" x1="'+P.l+'" x2="'+(W-P.r)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text x="'+(P.l-6)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+fmtNum(Math.round(v*10)/10)+'</text>'; }
  if(opts.goal!=null) s+='<line class="goal" x1="'+P.l+'" x2="'+(W-P.r)+'" y1="'+Y(opts.goal)+'" y2="'+Y(opts.goal)+'"/><text x="'+(W-P.r)+'" y="'+(Y(opts.goal)-5)+'" text-anchor="end">Ziel '+fmtNum(opts.goal)+'</text>';
  if(opts.trend){ const av=points.map((p,i)=>{ const w=points.filter((q,j)=>xs[j]<=xs[i] && xs[j]>xs[i]-7*864e5); return w.reduce((a,q)=>a+q.y,0)/w.length; });
    s+='<polyline class="ln ln-raw" points="'+points.map((p,i)=>X(xs[i])+','+Y(p.y)).join(' ')+'"/>';
    s+='<polyline class="ln ln-trend" points="'+av.map((v,i)=>X(xs[i])+','+Y(v)).join(' ')+'"/>'; }
  else s+='<polyline class="ln" points="'+points.map((p,i)=>X(xs[i])+','+Y(p.y)).join(' ')+'"/>';
  points.forEach((p,i)=>{ s+='<circle class="pt'+(opts.trend?' pt-raw':'')+'" cx="'+X(xs[i])+'" cy="'+Y(p.y)+'" r="4"><title>'+fmtDate(p.x)+': '+fmtNum(p.y)+(opts.unit?' '+opts.unit:'')+'</title></circle>'; });
  s+='<text x="'+P.l+'" y="'+(H-8)+'">'+fmtDate(points[0].x)+'</text><text x="'+(W-P.r)+'" y="'+(H-8)+'" text-anchor="end">'+fmtDate(points[points.length-1].x)+'</text></svg>';
  return s;
}

/* ---------- Standortbestimmung: beste Sätze der letzten 7 Tage als Testergebnis übernehmen (Spezifikation 3.8) ---------- */
const TEST_SYN=[['kniebeuge','squat'],['kreuzheben','deadlift'],['bankdrücken','bench'],['klimmzug','pull'],['klimmzüge','pull'],['liegestütz','push-up']];
function normName(n){ let x=String(n||'').toLowerCase().replace(/[()–-]/g,' '); TEST_SYN.forEach(([a,b])=>{ x=x.split(a).join(b); }); return x.split(/\s+/).filter(w=>w.length>1).sort().join(' '); }
function guessTest(exName){ const names=[...new Set(S.tests.map(t=>t.name))]; const a=normName(exName).split(' ');
  let best=null, sc=0; names.forEach(n=>{ const b=normName(n).split(' '); const k=a.filter(w=>b.includes(w)).length/Math.max(a.length,b.length); if(k>sc){ sc=k; best=n; } }); return sc>=0.5?best:''; }
function fromTrainingCandidates(){ const from=addDays(todayISO(),-6); const out={};
  loggedSessions().filter(s=>sessionDate(s)>=from).forEach(s=>s.log.exercises.forEach(e=>{

    if(kg.length){ const t=kg.reduce((a,b)=>(b.kg>a.kg||(b.kg===a.kg&&b.reps>a.reps))?b:a); c={value:t.kg,unit:'kg',reps:t.reps,rpe:t.rpe,category:'Kraft'}; }
    else if(ht.length){ const t=ht.reduce((a,b)=>b.height>a.height?b:a); c={value:t.height,unit:'cm',reps:null,rpe:t.rpe,category:'Sprung & Power'}; }
    else { const r=e.sets.filter(x=>x.reps!=null&&x.kg==null); if(r.length){ const t=r.reduce((a,b)=>b.reps>a.reps?b:a); c={value:t.reps,unit:'Wdh',reps:null,rpe:t.rpe,category:'Kraft'}; } }
    if(!c) return; const k=e.name+(e.variant?' ('+e.variant+')':''); const prev=out[k];

/* Wochenbelastung (Session-RPE × Minuten, „AU“): Gym aus den Protokollen (Ø RPE der Sätze × Dauer), Feld aus dem Feldprotokoll.
   Einheiten ohne Dauer oder RPE werden nicht geschätzt, sondern weggelassen und gezählt. */
function weeklyLoad(weeks){
  const mon=mondayOf(todayISO()); const W=[]; for(let i=weeks-1;i>=0;i--) W.push({mon:addDays(mon,-7*i), gym:0, field:0, miss:0});
  const at=d=>W.find(w=>d>=w.mon && d<=addDays(w.mon,6));
  loggedSessions().forEach(s=>{ const w=at(sessionDate(s)); if(!w) return; const rp=[]; s.log.exercises.forEach(e=>e.sets.forEach(x=>{ if(x.rpe!=null) rp.push(x.rpe); }));
    if(s.log.durationMin && rp.length) w.gym+=Math.round(s.log.durationMin*rp.reduce((a,b)=>a+b,0)/rp.length); else w.miss++; });
  (S.fieldLogs||[]).forEach(l=>{ const w=at(l.date); if(!w||l.status==='ausgefallen') return; if(l.rpe&&l.durationMin) w.field+=l.rpe*l.durationMin; else w.miss++; });
  return W;
}
function readySection(){
  const L=loggedSessions().map(s=>{ const c=(s.planner&&s.planner.checkin)||{}; return { d:sessionDate(s), r:s.log.form!=null?s.log.form:(c.readiness!=null?c.readiness:null), p:c.pain||0 }; }).filter(x=>x.r!=null).slice(-20);
  if(L.length<2) return '';
  const avg=a=>Math.round(a.reduce((x,y)=>x+y,0)/a.length*10)/10; const last5=L.slice(-5).map(x=>x.r);
  const pain=L.filter(x=>x.p>0);
  const b=lineChart(L.map(x=>({x:x.d,y:x.r})),{label:'Tagesform'})+'<p class="small">Ø der letzten '+last5.length+' Einheiten: <strong>'+fmtNum(avg(last5))+'</strong> von 5'+(pain.length?' · Beschwerden in '+pain.length+' von '+L.length+' Einheiten':'')+'</p><p class="small muted">Tagesform 1 = schlecht, 5 = top – aus dem Check-in vor der Einheit.</p>';
  return pdet('v-ready','Tagesform','Ø '+fmtNum(avg(last5))+' von 5', b);
}
function loadSection(){
  const W=weeklyLoad(8); const tot=w=>w.gym+w.field; if(!W.some(w=>tot(w)>0)) return '';
  const max=Math.max(...W.map(tot)); const cur=W[W.length-1], prev=W.slice(-4,-1).filter(w=>tot(w)>0);
  const avg=prev.length?prev.reduce((a,w)=>a+tot(w),0)/prev.length:0; const ratio=avg?tot(cur)/avg:null;
  const Wd=640,H=170,P={l:8,r:8,t:10,b:24}; const bw=(Wd-P.l-P.r)/W.length;
  let svg='<svg class="chart" viewBox="0 0 '+Wd+' '+H+'" role="img" aria-label="Wochenbelastung">';
  W.forEach((w,i)=>{ const x=P.l+i*bw+bw*0.18, wd=bw*0.64, sc=v=>v/max*(H-P.t-P.b); const g=sc(w.gym), f=sc(w.field); const y0=H-P.b;
    if(w.gym) svg+='<rect class="bar-gym" x="'+x+'" y="'+(y0-g)+'" width="'+wd+'" height="'+g+'"><title>Gym '+w.gym+' AU</title></rect>';
    if(w.field) svg+='<rect class="bar-field" x="'+x+'" y="'+(y0-g-f)+'" width="'+wd+'" height="'+f+'"><title>Feld '+w.field+' AU</title></rect>';
    svg+='<text x="'+(x+wd/2)+'" y="'+(H-8)+'" text-anchor="middle">'+fmtDate(w.mon).slice(0,6)+'</text>'; });
  svg+='</svg>';
  let b=svg+'<p class="small"><span class="lg lg-gym"></span> Gym <span class="lg lg-field"></span> Feld · diese Woche <strong>'+tot(cur)+' AU</strong>'+(avg?' · Schnitt der 3 Wochen davor '+Math.round(avg)+' AU':'')+'</p>';
  if(ratio!=null && ratio>1.3) b+='<div class="note warn small">Diese Woche liegt die Belastung <strong>'+Math.round((ratio-1)*100)+' %</strong> über dem Schnitt der Vorwochen. Starke Sprünge erhöhen das Verletzungsrisiko – Schlaf, Essen und Erholung im Blick behalten.</div>';
  const miss=W.reduce((a,w)=>a+w.miss,0); if(miss) b+='<p class="small muted">'+miss+' Einheit'+(miss===1?'':'en')+' ohne Dauer oder RPE nicht enthalten.</p>';
  b+='<p class="small muted">Belastung = Anstrengung (RPE) × Minuten. Gym: Ø RPE der Sätze × Dauer.</p>';
  return pdet('v-load','Wochenbelastung','diese Woche '+tot(cur)+' AU'+(ratio!=null&&ratio>1.3?' · stark gestiegen':''), b);
}
function testCard(name){
  const list=S.tests.filter(t=>t.name===name).slice().sort((a,b)=>{ if(a.date&&b.date) return a.date<b.date?-1:1; if(a.date) return 1; if(b.date) return -1; return 0; });
  const goal=S.goals.find(g=>g.testName===name && g.status==='aktiv');
  const units=[...new Set(list.filter(t=>t.value!=null).map(t=>t.unit))];
  const pts=list.filter(t=>t.date&&t.value!=null&&t.unit===units[0]).map(t=>({x:t.date,y:t.value}));
  const last=list[list.length-1];
  let h='';
  if(pts.length>=2) h+=lineChart(pts,{unit:units[0],goal:goal&&goal.unit===units[0]?goal.target:null,label:name});
  // Vergleich der letzten beiden Einträge
  if(list.length>=2){
    const a=list[list.length-2], b=list[list.length-1]; const issues=[];
    if(!a.date||!b.date) issues.push('mindestens ein Datum fehlt – Reihenfolge unsicher');
    if(a.conditions && b.conditions && a.conditions!==b.conditions) issues.push('Testbedingungen unterscheiden sich');
    if(a.unit!==b.unit) issues.push('unterschiedliche Einheiten');
    if((a.reps||null)!==(b.reps||null)) issues.push('unterschiedliche Wiederholungszahl');
    let diff=''; if(a.value!=null&&b.value!=null&&a.unit===b.unit){ const d=b.value-a.value; diff=(d>0?'+':'')+fmtNum(d)+' '+b.unit; }
    h+='<p class="small">Vergleich der letzten beiden Einträge: '+esc(testValueText(a))+' → '+esc(testValueText(b))+(diff?' ('+esc(diff)+')':'')+'</p>';
    if(issues.length) h+='<div class="note warn small">Vergleich nur eingeschränkt aussagekräftig: '+esc(issues.join('; '))+'.</div>';
  }
  h+='<div class="table-wrap"><table><thead><tr><th>Datum</th><th>Ergebnis</th><th>Bedingungen</th><th>Hinweise</th><th></th></tr></thead><tbody>'+
    list.slice().reverse().map(t=>{ const g=testGaps(t);
      return '<tr><td>'+(t.date?fmtDate(t.date):'—')+'</td><td>'+esc(testValueText(t))+'</td><td>'+esc(t.conditions||'—')+'</td><td>'+srcBadge(t)+' '+g.map(x=>badge(x,'warn')).join(' ')+(t.note?'<div class="small muted">'+esc(t.note)+'</div>':'')+'</td><td><button class="small" data-act="editTest" data-id="'+t.id+'">Bearbeiten</button></td></tr>'; }).join('')+
    '</tbody></table></div><div class="add-row"><button class="small" data-act="editTest" data-name="'+esc(name)+'">+ Neue Messung</button></div>';
  const info=[last?'Aktuell <strong>'+esc(testValueText(last))+'</strong>':'', goal?'Ziel '+esc(fmtNum(goal.target)+' '+goal.unit):'', list.length===1?'1 Eintrag':list.length+' Einträge'].filter(Boolean).join(' · ');
  return pdet('vt-'+name,name,'','<p class="small muted" style="margin-top:0">'+info+'</p>'+h);
}

/* Verlauf je Übung aus den Protokollen: schwerster erfasster Satz pro Einheit (keine Hochrechnung) */
function trainingProgress(){
  const map={};
  loggedSessions().forEach(s=>s.log.exercises.forEach(e=>{
    const key=e.name+(e.variant?' ('+e.variant+')':'');
    const withKg=e.sets.filter(x=>x.kg!=null);
    const top=withKg.length?withKg.reduce((a,b)=>(b.kg>a.kg||(b.kg===a.kg&&(b.reps||0)>(a.reps||0)))?b:a):null;
    (map[key]=map[key]||[]).push({date:sessionDate(s), top, sets:e.sets, session:s});
  }));
  const keys=Object.keys(map).sort();
  if(!keys.length) return '<div class="empty">Sobald Einheiten protokolliert sind, siehst du hier je Übung den Verlauf.</div>';
  if(!ui.exName || !map[ui.exName]) ui.exName=keys[0];
  const list=map[ui.exName];
  let h='<div class="section">'+sel('pr-ex','Übung',keys.map(k=>[k,k+' ('+map[k].length+')']),ui.exName,'data-chg="pickEx"');
  const pts=list.filter(x=>x.top).map(x=>({x:x.date,y:x.top.kg}));
  h+= pts.length>=2 ? lineChart(pts,{unit:'kg',label:'Schwerster Satz '+ui.exName}) : '<p class="small muted">Diagramm ab zwei Einheiten mit Gewichtsangabe.</p>';
  // Geschätztes 1RM (Epley), nur Sätze mit Gewicht und 1–10 Wdh
  const e1=x=>{ const c=x.sets.filter(y=>y.kg!=null&&y.reps>=1&&y.reps<=10).map(y=>y.kg*(1+(y.reps===1?0:y.reps/30))); return c.length?Math.round(Math.max(...c)*2)/2:null; };
  const ep=list.map(x=>({x:x.date,y:e1(x)})).filter(p=>p.y!=null);
  if(ep.length) h+='<h3 style="margin-top:16px">Geschätztes 1RM</h3>'+(ep.length>=2?lineChart(ep,{unit:'kg',label:'Geschätztes 1RM '+ui.exName}):'')+
    '<p class="small muted">Aktuell ≈ <strong>'+fmtNum(ep[ep.length-1].y)+' kg</strong>'+(ep.length>=2?' ('+(ep[ep.length-1].y-ep[0].y>=0?'+':'')+fmtNum(Math.round((ep[ep.length-1].y-ep[0].y)*2)/2)+' kg seit '+fmtDate(ep[0].x)+')':'')+'. Schätzung nach Epley aus dem besten Satz bis 10 Wdh – kein getestetes Maximum.</p>';
  h+='<div class="table-wrap"><table><thead><tr><th>Datum</th><th>Schwerster Satz</th><th>Alle Sätze</th></tr></thead><tbody>'+list.slice().reverse().map(x=>'<tr><td>'+fmtDate(x.date)+'</td><td>'+(x.top?fmtNum(x.top.kg)+' kg × '+(x.top.reps!=null?x.top.reps:'?')+(x.top.rpe!=null?' @'+fmtNum(x.top.rpe):''):'—')+'</td><td class="small">'+esc(x.sets.map(y=>istOf(y)).filter(Boolean).join(' | ')||'—')+'</td></tr>').join('')+'</tbody></table></div>';
  h+='<p class="small muted">„Schwerster Satz“ ist der erfasste Satz mit dem höchsten Gewicht – keine Schätzung eines Maximalgewichts.</p></div>';
  return h;
}

function readBackup(el, onOk){
  const f=el.files&&el.files[0]; el.value=''; if(!f) return;
  const fail=msg=>openDlg('Datei nicht verwendbar', msg+'<p class="small muted">Deine aktuellen Daten wurden nicht verändert.</p>','<button data-act="closeDlg">OK</button>');
  if(f.size>20*1024*1024){ fail('<p>Die Datei ist größer als 20 MB und wird nicht als AOS-Sicherung erkannt.</p>'); return; }
  const r=new FileReader();
  r.onload=()=>{
    let d; try{ d=JSON.parse(r.result); }catch(e){ fail('<p>Die Datei „'+esc(f.name)+'“ ist keine gültige JSON-Datei.</p>'); return; }
    const v=validateData(d);
    if(!v.ok){ fail('<p>„'+esc(f.name)+'“ ist keine gültige AOS-Sicherung:</p><ul>'+v.errors.slice(0,8).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'); return; }
    try{ onOk(d, f); }catch(e){ console.error(e); fail('<p>Die Sicherung konnte nicht verarbeitet werden ('+esc(e.message)+').</p>'); }
  };
  r.onerror=()=>toast('Die Datei konnte nicht gelesen werden.');
  r.readAsText(f);
}
